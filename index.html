<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>IsIsland - Educational Adventure</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    /* Strict cross-browser reset & iOS legacy styling */
    * {
      -webkit-box-sizing: border-box;
      -moz-box-sizing: border-box;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1e2d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #game-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: -webkit-box;
      display: -webkit-flex;
      display: -ms-flexbox;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      -ms-flex-align: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      -ms-flex-pack: center;
      justify-content: center;
      background: radial-gradient(circle at center, #2e3a59 0%, #111522 100%);
    }
    canvas {
      display: block;
      background-color: #70c5ce;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }
    /* Hidden accessible input for legacy iOS virtual keyboard fallback */
    #hidden-input {
      position: absolute;
      top: -100px;
      left: -100px;
      opacity: 0;
      font-size: 16px; /* Prevents auto zoom in iOS */
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="480" height="854"></canvas>
    <input type="text" id="hidden-input" maxlength="12" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  </div>

  <script>
    /* =====================================================================
       IsIsland: ES5 Pure Vanilla Engine & Game Framework
       Strictly written without modern ES6+ features for iOS 12 Safari.
       ===================================================================== */
    (function () {
      'use strict';

      // -------------------------------------------------------------
      // 1. AUDIO SYNTHESIS ENGINE (Web Audio API with iOS unlocking)
      // -------------------------------------------------------------
      var AudioEngine = (function () {
        var ctx = null;
        var isMuted = false;

        function getContext() {
          if (!ctx) {
            var AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              ctx = new AudioCtx();
            }
          }
          if (ctx && ctx.state === 'suspended') {
            ctx.resume();
          }
          return ctx;
        }

        // Unlock audio on early touch events
        function unlock() {
          var c = getContext();
          if (c) {
            var buffer = c.createBuffer(1, 1, 22050);
            var source = c.createBufferSource();
            source.buffer = buffer;
            source.connect(c.destination);
            if (source.start) {
              source.start(0);
            } else if (source.noteOn) {
              source.noteOn(0);
            }
          }
        }

        function playTone(freq, type, duration, delay) {
          if (isMuted) return;
          var c = getContext();
          if (!c) return;
          delay = delay || 0;
          try {
            var osc = c.createOscillator();
            var gain = c.createGain();
            osc.type = type || 'sine';
            osc.frequency.setValueAtTime(freq, c.currentTime + delay);

            gain.gain.setValueAtTime(0.2, c.currentTime + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + delay + duration);

            osc.connect(gain);
            gain.connect(c.destination);

            if (osc.start) {
              osc.start(c.currentTime + delay);
              osc.stop(c.currentTime + delay + duration);
            } else if (osc.noteOn) {
              osc.noteOn(c.currentTime + delay);
              osc.noteOff(c.currentTime + delay + duration);
            }
          } catch (e) {
            // Audio context failed or unavailable
          }
        }

        return {
          unlock: unlock,
          toggleMute: function () {
            isMuted = !isMuted;
            return isMuted;
          },
          isMuted: function () {
            return isMuted;
          },
          playClick: function () {
            playTone(600, 'triangle', 0.08);
          },
          playSuccess: function () {
            playTone(523.25, 'sine', 0.1, 0);     // C5
            playTone(659.25, 'sine', 0.1, 0.08);  // E5
            playTone(783.99, 'sine', 0.2, 0.16);  // G5
            playTone(1046.50, 'sine', 0.35, 0.24); // C6
          },
          playPop: function () {
            playTone(320, 'sine', 0.04);
            playTone(880, 'sine', 0.08, 0.02);
          },
          playNote: function (hz) {
            playTone(hz, 'triangle', 0.35);
          },
          playWhistle: function () {
            playTone(900, 'sine', 0.15, 0);
            playTone(1200, 'sine', 0.2, 0.1);
          },
          playSplat: function () {
            playTone(180, 'square', 0.12);
          }
        };
      })();

      // -------------------------------------------------------------
      // 2. GLOBAL STATE & PERSISTENCE
      // -------------------------------------------------------------
      var STORAGE_KEY = 'isisland_state_v1';
      var state = {
        name: 'Adventurer',
        passkey: '1234',
        coins: 100,
        stars: 12,
        currentScene: 'LOGIN',
        wardrobe: {
          skin: '#ffd4b2',
          hair: '#5c3a21',
          hairStyle: 0, // 0: short, 1: curly, 2: crown/buns
          dress: '#ff6f91',
          dressStyle: 0, // 0: casual, 1: chef apron, 2: party gown
          accessory: 1 // 0: none, 1: party hat, 2: chef hat, 3: glasses
        },
        scores: {}
      };

      function loadStorage() {
        try {
          var raw = window.localStorage.getItem(STORAGE_KEY);
          if (raw) {
            var data = JSON.parse(raw);
            for (var key in data) {
              if (data.hasOwnProperty(key)) {
                state[key] = data[key];
              }
            }
          }
        } catch (e) {
          // localStorage disabled or private browsing quota
        }
      }

      function saveStorage() {
        try {
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}
      }

      loadStorage();

      // -------------------------------------------------------------
      // 3. CANVAS SETUP & SCALING (480 x 854 Portrait)
      // -------------------------------------------------------------
      var V_WIDTH = 480;
      var V_HEIGHT = 854;

      var canvas = document.getElementById('gameCanvas');
      var ctx = canvas.getContext('2d');
      var hiddenInput = document.getElementById('hidden-input');

      var scale = 1;
      var offsetX = 0;
      var offsetY = 0;

      function resizeCanvas() {
        var winW = window.innerWidth;
        var winH = window.innerHeight;

        var scaleX = winW / V_WIDTH;
        var scaleY = winH / V_HEIGHT;
        scale = Math.min(scaleX, scaleY);

        var finalW = Math.floor(V_WIDTH * scale);
        var finalH = Math.floor(V_HEIGHT * scale);

        canvas.style.width = finalW + 'px';
        canvas.style.height = finalH + 'px';

        var rect = canvas.getBoundingClientRect();
        offsetX = rect.left;
        offsetY = rect.top;
      }

      window.addEventListener('resize', resizeCanvas, false);
      window.addEventListener('orientationchange', resizeCanvas, false);
      resizeCanvas();

      // -------------------------------------------------------------
      // 4. TOUCH & POINTER NORMALIZER (iOS 12 touch handling)
      // -------------------------------------------------------------
      var input = {
        x: 0,
        y: 0,
        isDown: false,
        justPressed: false,
        justReleased: false
      };

      function updateCoords(clientX, clientY) {
        var rect = canvas.getBoundingClientRect();
        var clientRelX = clientX - rect.left;
        var clientRelY = clientY - rect.top;
        input.x = clientRelX * (V_WIDTH / rect.width);
        input.y = clientRelY * (V_HEIGHT / rect.height);
      }

      function onPointerStart(clientX, clientY) {
        AudioEngine.unlock();
        updateCoords(clientX, clientY);
        input.isDown = true;
        input.justPressed = true;
      }

      function onPointerMove(clientX, clientY) {
        updateCoords(clientX, clientY);
      }

      function onPointerEnd() {
        input.isDown = false;
        input.justReleased = true;
      }

      canvas.addEventListener('touchstart', function (e) {
        if (e.touches && e.touches.length > 0) {
          onPointerStart(e.touches[0].clientX, e.touches[0].clientY);
        }
        e.preventDefault();
      }, false);

      canvas.addEventListener('touchmove', function (e) {
        if (e.touches && e.touches.length > 0) {
          onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
        }
        e.preventDefault();
      }, false);

      canvas.addEventListener('touchend', function (e) {
        onPointerEnd();
        e.preventDefault();
      }, false);

      canvas.addEventListener('mousedown', function (e) {
        onPointerStart(e.clientX, e.clientY);
      }, false);

      window.addEventListener('mousemove', function (e) {
        if (input.isDown) {
          onPointerMove(e.clientX, e.clientY);
        }
      }, false);

      window.addEventListener('mouseup', function () {
        if (input.isDown) {
          onPointerEnd();
        }
      }, false);

      // -------------------------------------------------------------
      // 5. DRAWING & UI HELPERS (Pure ES5 Procedural Graphics)
      // -------------------------------------------------------------
      function fillRoundRect(c, x, y, w, h, r, fillColor, strokeColor, strokeWidth) {
        c.save();
        c.beginPath();
        c.moveTo(x + r, y);
        c.lineTo(x + w - r, y);
        c.quadraticCurveTo(x + w, y, x + w, y + r);
        c.lineTo(x + w, y + h - r);
        c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        c.lineTo(x + r, y + h);
        c.quadraticCurveTo(x, y + h, x, y + h - r);
        c.lineTo(x, y + r);
        c.quadraticCurveTo(x, y, x + r, y);
        c.closePath();
        if (fillColor) {
          c.fillStyle = fillColor;
          c.fill();
        }
        if (strokeColor) {
          c.strokeStyle = strokeColor;
          c.lineWidth = strokeWidth || 2;
          c.stroke();
        }
        c.restore();
      }

      function drawButton(c, x, y, w, h, text, color, textColor, icon) {
        var isHover = (input.x >= x && input.x <= x + w && input.y >= y && input.y <= y + h);
        var btnColor = color || '#38b000';
        var txtColor = textColor || '#ffffff';

        // Drop shadow
        fillRoundRect(c, x, y + 4, w, h, 14, 'rgba(0,0,0,0.25)');
        fillRoundRect(c, x, y, w, h, 14, btnColor, '#ffffff', 2);

        // Highlight sheen
        c.save();
        c.beginPath();
        c.ellipse(x + w / 2, y + 8, w * 0.4, 4, 0, 0, Math.PI * 2);
        c.fillStyle = 'rgba(255,255,255,0.35)';
        c.fill();
        c.restore();

        c.save();
        c.fillStyle = txtColor;
        c.textAlign = 'center';
        c.textBaseline = 'middle';
        c.font = 'bold 18px -apple-system, sans-serif';
        if (icon) {
          c.fillText(icon + ' ' + text, x + w / 2, y + h / 2 + 1);
        } else {
          c.fillText(text, x + w / 2, y + h / 2 + 1);
        }
        c.restore();

        return (isHover && input.justReleased);
      }

      function drawAvatar(c, cx, cy, scaleFactor, wardrobeData) {
        c.save();
        c.translate(cx, cy);
        c.scale(scaleFactor, scaleFactor);

        var skin = wardrobeData.skin;
        var hair = wardrobeData.hair;
        var dress = wardrobeData.dress;
        var dStyle = wardrobeData.dressStyle;
        var hStyle = wardrobeData.hairStyle;
        var acc = wardrobeData.accessory;

        // Shadow under feet
        c.fillStyle = 'rgba(0, 0, 0, 0.18)';
        c.beginPath();
        c.ellipse(0, 85, 36, 12, 0, 0, Math.PI * 2);
        c.fill();

        // Legs / Shoes
        c.fillStyle = '#4a3b32';
        fillRoundRect(c, -16, 60, 10, 22, 4, '#4a3b32');
        fillRoundRect(c, 6, 60, 10, 22, 4, '#4a3b32');
        c.fillStyle = '#ffffff';
        fillRoundRect(c, -18, 76, 14, 8, 3, '#222222');
        fillRoundRect(c, 4, 76, 14, 8, 3, '#222222');

        // Body / Dress
        c.fillStyle = dress;
        if (dStyle === 0) { // Casual T-shirt & shorts
          fillRoundRect(c, -20, 15, 40, 36, 8, dress, '#ffffff', 1);
          c.fillStyle = '#2b5876';
          fillRoundRect(c, -18, 45, 36, 18, 4, '#2b5876');
        } else if (dStyle === 1) { // Chef Coat & Apron
          fillRoundRect(c, -22, 12, 44, 52, 8, '#ffffff', '#dddddd', 2);
          // Red chef necktie
          c.fillStyle = '#e63946';
          c.beginPath();
          c.moveTo(-6, 14);
          c.lineTo(6, 14);
          c.lineTo(0, 28);
          c.closePath();
          c.fill();
          // Apron stripes
          c.fillStyle = dress;
          fillRoundRect(c, -18, 36, 36, 26, 4, dress);
        } else { // Festive Ballgown
          c.beginPath();
          c.moveTo(-16, 15);
          c.lineTo(16, 15);
          c.lineTo(34, 68);
          c.lineTo(-34, 68);
          c.closePath();
          c.fillStyle = dress;
          c.fill();
          c.strokeStyle = '#ffffff';
          c.lineWidth = 2;
          c.stroke();
          // Ribbon
          c.fillStyle = '#ffd166';
          fillRoundRect(c, -18, 28, 36, 6, 2, '#ffd166');
        }

        // Arms
        c.fillStyle = skin;
        fillRoundRect(c, -28, 16, 10, 32, 5, skin);
        fillRoundRect(c, 18, 16, 10, 32, 5, skin);

        // Head
        c.fillStyle = skin;
        c.beginPath();
        c.arc(0, -14, 28, 0, Math.PI * 2);
        c.fill();
        c.strokeStyle = 'rgba(0,0,0,0.06)';
        c.stroke();

        // Eyes (blinking effect occasionally)
        var blink = (Math.floor(Date.now() / 3000) % 10 === 0 && (Date.now() % 300 < 150));
        c.fillStyle = '#222222';
        if (!blink) {
          c.beginPath();
          c.arc(-10, -14, 3.5, 0, Math.PI * 2);
          c.arc(10, -14, 3.5, 0, Math.PI * 2);
          c.fill();
          // Eye shines
          c.fillStyle = '#ffffff';
          c.beginPath();
          c.arc(-11, -16, 1.2, 0, Math.PI * 2);
          c.arc(9, -16, 1.2, 0, Math.PI * 2);
          c.fill();
        } else {
          c.strokeStyle = '#222222';
          c.lineWidth = 2;
          c.beginPath();
          c.moveTo(-14, -14); c.lineTo(-6, -14);
          c.moveTo(6, -14); c.lineTo(14, -14);
          c.stroke();
        }

        // Cheeks
        c.fillStyle = 'rgba(255, 99, 132, 0.4)';
        c.beginPath();
        c.arc(-16, -7, 4.5, 0, Math.PI * 2);
        c.arc(16, -7, 4.5, 0, Math.PI * 2);
        c.fill();

        // Cheerful Smile
        c.strokeStyle = '#632b2b';
        c.lineWidth = 2.2;
        c.beginPath();
        c.arc(0, -8, 8, 0.15 * Math.PI, 0.85 * Math.PI, false);
        c.stroke();

        // Hair Styles
        c.fillStyle = hair;
        if (hStyle === 0) { // Short bob / crop
          c.beginPath();
          c.arc(0, -22, 28, Math.PI, Math.PI * 2);
          c.lineTo(28, -8);
          c.quadraticCurveTo(24, 6, 18, 0);
          c.lineTo(10, -18);
          c.lineTo(-10, -18);
          c.lineTo(-18, 0);
          c.quadraticCurveTo(-24, 6, -28, -8);
          c.closePath();
          c.fill();
        } else if (hStyle === 1) { // Curly locks
          c.beginPath();
          c.arc(0, -24, 30, Math.PI * 0.9, Math.PI * 2.1);
          c.fill();
          for (var i = -3; i <= 3; i++) {
            c.beginPath();
            c.arc(i * 10, -32, 10, 0, Math.PI * 2);
            c.fill();
          }
          c.beginPath();
          c.arc(-26, -10, 11, 0, Math.PI * 2);
          c.arc(26, -10, 11, 0, Math.PI * 2);
          c.fill();
        } else { // High Bun & fringe
          c.beginPath();
          c.arc(0, -44, 16, 0, Math.PI * 2);
          c.fill();
          c.beginPath();
          c.arc(0, -22, 29, Math.PI * 0.9, Math.PI * 2.1);
          c.lineTo(28, -6);
          c.lineTo(-28, -6);
          c.closePath();
          c.fill();
        }

        // Accessories
        if (acc === 1) { // Party Cone Hat
          c.fillStyle = '#ffb703';
          c.beginPath();
          c.moveTo(-14, -36);
          c.lineTo(14, -36);
          c.lineTo(0, -75);
          c.closePath();
          c.fill();
          c.strokeStyle = '#e63946';
          c.lineWidth = 3;
          c.stroke();
          // Pompom
          c.fillStyle = '#e63946';
          c.beginPath();
          c.arc(0, -77, 6, 0, Math.PI * 2);
          c.fill();
        } else if (acc === 2) { // Chef Toque
          c.fillStyle = '#f8f9fa';
          c.beginPath();
          c.rect(-18, -44, 36, 14);
          c.fill();
          c.strokeStyle = '#dcdcdc';
          c.stroke();
          // Puffy top
          c.beginPath();
          c.arc(0, -56, 18, 0, Math.PI * 2);
          c.arc(-14, -50, 13, 0, Math.PI * 2);
          c.arc(14, -50, 13, 0, Math.PI * 2);
          c.fill();
        } else if (acc === 3) { // Cool Glasses
          c.strokeStyle = '#2b2d42';
          c.lineWidth = 3;
          c.strokeRect(-20, -18, 16, 10);
          c.strokeRect(4, -18, 16, 10);
          c.beginPath();
          c.moveTo(-4, -13);
          c.lineTo(4, -13);
          c.stroke();
        }

        c.restore();
      }

      // Universal HUD bar for Game Scenes
      function drawHUD(c, title, showBack) {
        // Top banner
        fillRoundRect(c, 10, 12, V_WIDTH - 20, 56, 16, 'rgba(255,255,255,0.92)', '#c5d3e8', 2);

        // Sound Button
        var soundX = V_WIDTH - 64;
        var soundY = 18;
        var isSoundClick = drawButton(c, soundX, soundY, 44, 44, AudioEngine.isMuted() ? '🔇' : '🔊', '#4a4e69');
        if (isSoundClick) {
          AudioEngine.toggleMute();
          AudioEngine.playClick();
        }

        // Stats: Coins & Stars
        c.font = 'bold 15px -apple-system, sans-serif';
        c.fillStyle = '#b58300';
        c.textAlign = 'left';
        c.fillText('🪙 ' + state.coins, 18, 35);
        c.fillStyle = '#7a3b8c';
        c.fillText('⭐ ' + state.stars, 18, 55);

        // Scene Title
        c.fillStyle = '#1e293b';
        c.font = 'bold 18px -apple-system, sans-serif';
        c.textAlign = 'center';
        c.fillText(title || '', V_WIDTH / 2, 42);

        // Back Button
        if (showBack) {
          var backX = V_WIDTH - 120;
          var backY = 18;
          var backClick = drawButton(c, backX, backY, 50, 44, '🔙', '#e63946');
          if (backClick) {
            AudioEngine.playClick();
            state.currentScene = 'OVERWORLD';
            saveStorage();
          }
        }
      }

      // -------------------------------------------------------------
      // 6. SCENE: LOGIN & PROFILE SELECTION
      // -------------------------------------------------------------
      var loginProfileList = ['Explorer Tim', 'Chef Bella', 'Maya Adventurer', 'Leo Spark'];
      var selectedProfileIdx = 0;

      function renderLoginScene() {
        // Cheerful Gradient Sky
        var grad = ctx.createLinearGradient(0, 0, 0, V_HEIGHT);
        grad.addColorStop(0, '#56ccf2');
        grad.addColorStop(1, '#2f80ed');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

        // Fluffy Clouds
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.beginPath();
        ctx.arc(80, 90, 45, 0, Math.PI * 2);
        ctx.arc(130, 80, 55, 0, Math.PI * 2);
        ctx.arc(180, 95, 40, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(380, 160, 40, 0, Math.PI * 2);
        ctx.arc(420, 150, 50, 0, Math.PI * 2);
        ctx.fill();

        // Game Brand Title
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(0,0,0,0.3)';
        ctx.shadowBlur = 10;
        ctx.font = '900 46px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('IsIsland', V_WIDTH / 2, 110);
        ctx.font = 'bold 16px -apple-system, sans-serif';
        ctx.fillStyle = '#fff3b0';
        ctx.fillText('🌴 Educational Discovery Island 🎂', V_WIDTH / 2, 140);
        ctx.restore();

        // Card Container
        var cardY = 175;
        fillRoundRect(ctx, 24, cardY, V_WIDTH - 48, 640, 20, '#ffffff', '#e0e7ff', 3);

        // Avatar Preview Box
        fillRoundRect(ctx, V_WIDTH / 2 - 60, cardY + 20, 120, 140, 16, '#f1f5f9', '#cbd5e1', 1);
        drawAvatar(ctx, V_WIDTH / 2, cardY + 100, 0.75, state.wardrobe);

        // Customize Quick Link
        if (drawButton(ctx, V_WIDTH / 2 - 70, cardY + 168, 140, 34, 'Wardrobe 👗', '#8338ec')) {
          AudioEngine.playClick();
          state.currentScene = 'WARDROBE';
        }

        // Name & Profile Selection
        ctx.fillStyle = '#334155';
        ctx.font = 'bold 16px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Select Explorer Profile:', V_WIDTH / 2, cardY + 225);

        for (var i = 0; i < loginProfileList.length; i++) {
          var py = cardY + 242 + i * 46;
          var isCur = (state.name === loginProfileList[i]);
          var bg = isCur ? '#3a86ff' : '#f8fafc';
          var tx = isCur ? '#ffffff' : '#334155';

          if (drawButton(ctx, 44, py, V_WIDTH - 88, 38, loginProfileList[i], bg, tx)) {
            AudioEngine.playClick();
            state.name = loginProfileList[i];
            saveStorage();
          }
        }

        // Passkey / Secret Code Display & Input Trigger
        var passY = cardY + 440;
        ctx.fillStyle = '#475569';
        ctx.font = 'bold 14px -apple-system, sans-serif';
        ctx.fillText('Island Passkey Code: [ ' + state.passkey + ' ]', V_WIDTH / 2, passY);

        // Keypad buttons to change passkey for kids
        ctx.font = 'bold 13px -apple-system, sans-serif';
        ctx.fillText('Quick Pin:', V_WIDTH / 2, passY + 25);
        var pinOptions = ['1234', '7777', '9999', '4321'];
        for (var p = 0; p < pinOptions.length; p++) {
          var px = 45 + p * 100;
          var activePin = (state.passkey === pinOptions[p]);

      // Minigame A2: Balloon Pop Reflex
      function renderGameA2() {
        ctx.fillStyle = '#e0f2fe';
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
        drawHUD(ctx, 'Balloon Reflex', true);

        // Spawn balloons
        var now = Date.now();
        if (!balloonGame.gameOver && now - balloonGame.lastSpawn > 650) {
          balloonGame.lastSpawn = now;
          var colors = ['#f72585', '#4cc9f0', '#7209b7', '#ffb703', '#43aa8b'];
          balloonGame.balloons.push({
            x: 60 + Math.random() * (V_WIDTH - 120),
            y: V_HEIGHT + 30,
            radius: 28 + Math.random() * 12,
            speed: 2.5 + Math.random() * 3,
            color: colors[Math.floor(Math.random() * colors.length)],
            popped: false
          });
        }

        // Update timer
        if (!balloonGame.gameOver) {
          balloonGame.timeLeft -= 1 / 60;
          if (balloonGame.timeLeft <= 0) {
            balloonGame.timeLeft = 0;
            balloonGame.gameOver = true;
            AudioEngine.playSuccess();
            state.scores['GAME_A2'] = Math.max(state.scores['GAME_A2'] || 0, balloonGame.score);
            state.stars += Math.floor(balloonGame.score / 5);
            saveStorage();
          }
        }

        // Draw Balloons & hit test
        for (var b = balloonGame.balloons.length - 1; b >= 0; b--) {
          var ball = balloonGame.balloons[b];
          ball.y -= ball.speed;

          // Draw balloon
          ctx.save();
          ctx.fillStyle = ball.color;
          ctx.beginPath();
          ctx.ellipse(ball.x, ball.y, ball.radius, ball.radius * 1.2, 0, 0, Math.PI * 2);
          ctx.fill();
          // Knot & string
          ctx.fillStyle = ball.color;
          ctx.beginPath();
          ctx.moveTo(ball.x - 4, ball.y + ball.radius * 1.2);
          ctx.lineTo(ball.x + 4, ball.y + ball.radius * 1.2);
          ctx.lineTo(ball.x, ball.y + ball.radius * 1.2 + 6);
          ctx.fill();
          ctx.strokeStyle = '#888888';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(ball.x, ball.y + ball.radius * 1.2 + 6);
          ctx.quadraticCurveTo(ball.x + 6, ball.y + ball.radius * 1.2 + 20, ball.x, ball.y + ball.radius * 1.2 + 35);
          ctx.stroke();
          ctx.restore();

          // Check pop touch
          if (input.justPressed && !balloonGame.gameOver) {
            var dist = Math.sqrt((input.x - ball.x) * (input.x - ball.x) + (input.y - ball.y) * (input.y - ball.y));
            if (dist < ball.radius * 1.2) {
              AudioEngine.playPop();
              balloonGame.score += 1;
              state.coins += 2;
              balloonGame.balloons.splice(b, 1);
              continue;
            }
          }

          if (ball.y < -50) {
            balloonGame.balloons.splice(b, 1);
          }
        }

        // Score Card Overlay
        fillRoundRect(ctx, 30, 80, V_WIDTH - 60, 48, 12, 'rgba(255,255,255,0.9)');
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 18px -apple-system, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('Balloons: ' + balloonGame.score, 45, 110);
        ctx.textAlign = 'right';
        ctx.fillText('Time: ' + Math.ceil(balloonGame.timeLeft) + 's', V_WIDTH - 45, 110);

        if (balloonGame.gameOver) {
          fillRoundRect(ctx, 40, 320, V_WIDTH - 80, 200, 18, '#ffffff', '#38b000', 3);
          ctx.fillStyle = '#1e293b';
          ctx.font = 'bold 24px -apple-system, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('Party Time Finished! 🎈', V_WIDTH / 2, 370);
          ctx.font = '18px -apple-system, sans-serif';
          ctx.fillText('Final Score: ' + balloonGame.score, V_WIDTH / 2, 410);

          if (drawButton(ctx, V_WIDTH / 2 - 80, 445, 160, 48, 'Play Again 🔄', '#38b000')) {
            initFestiveGame('GAME_A2');
          }
        }

      // Minigame A4: Musical Bells Memory
      function renderGameA4() {
        ctx.fillStyle = '#edf2f4';
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
        drawHUD(ctx, 'Memory Bells', true);

        ctx.fillStyle = '#2b2d42';
        ctx.font = 'bold 20px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Melody Memory Game', V_WIDTH / 2, 105);
        ctx.font = '14px -apple-system, sans-serif';
        ctx.fillText(bellGame.isPlayingSeq ? 'Listen to the bells...' : 'Your turn to repeat!', V_WIDTH / 2, 130);
        ctx.fillText('Round Score: ' + bellGame.score, V_WIDTH / 2, 155);

        // Sequence playback loop
        var now = Date.now();
        if (bellGame.isPlayingSeq && now - bellGame.lastTick > 700) {
          bellGame.lastTick = now;
          if (bellGame.seqStep < bellGame.sequence.length) {
            var bellIdx = bellGame.sequence[bellGame.seqStep];
            AudioEngine.playNote(bellGame.frequencies[bellIdx]);
            bellGame.activeFlash = bellIdx;
            bellGame.seqStep++;
          } else {
            bellGame.isPlayingSeq = false;
            bellGame.activeFlash = -1;
            bellGame.playerStep = 0;
          }
        }

        // Draw 4 Large Musical Bells
        var bellNames = ['Bell C', 'Bell E', 'Bell G', 'High C'];
        for (var b = 0; b < 4; b++) {
          var bx = 65 + (b % 2) * 190;
          var by = 210 + Math.floor(b / 2) * 200;
          var isFlash = (bellGame.activeFlash === b);

          fillRoundRect(ctx, bx, by, 160, 160, 24, isFlash ? '#ffffff' : bellGame.bellColors[b], '#2b2d42', 3);

          // Bell contour
          ctx.fillStyle = isFlash ? bellGame.bellColors[b] : '#ffffff';
          ctx.beginPath();
          ctx.arc(bx + 80, by + 65, 36, Math.PI, 0, false);
          ctx.lineTo(bx + 125, by + 115);
          ctx.lineTo(bx + 35, by + 115);
          ctx.closePath();
          ctx.fill();

          ctx.font = 'bold 16px -apple-system, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(bellNames[b], bx + 80, by + 140);

          // Player touch reaction
          if (!bellGame.isPlayingSeq && input.justPressed) {
            if (input.x >= bx && input.x <= bx + 160 && input.y >= by && input.y <= by + 160) {
              AudioEngine.playNote(bellGame.frequencies[b]);
              if (bellGame.sequence[bellGame.playerStep] === b) {
                bellGame.playerStep++;
                if (bellGame.playerStep >= bellGame.sequence.length) {
                  // Passed sequence round!
                  AudioEngine.playSuccess();
                  bellGame.score += 1;
                  state.coins += 4;
                  state.scores['GAME_A4'] = Math.max(state.scores['GAME_A4'] || 0, bellGame.score);
                  saveStorage();

                  // Add next note
                  bellGame.sequence.push(Math.floor(Math.random() * 4));
                  bellGame.isPlayingSeq = true;
                  bellGame.seqStep = 0;
                  bellGame.lastTick = Date.now() + 400;
                }
              } else {
                // Incorrect sequence reset
                AudioEngine.playSplat();
                bellGame.sequence = [Math.floor(Math.random() * 4)];
                bellGame.isPlayingSeq = true;
                bellGame.seqStep = 0;
                bellGame.lastTick = Date.now();
                bellGame.score = 0;
              }
            }
          }
        }
      }

        ctx.font = 'bold 16px -apple-system, sans-serif';
        ctx.fillText('Orders Served: ' + orderGame.score, V_WIDTH / 2, 255);

        // Serving Tables & options
        for (var m = 0; m < orderGame.menu.length; m++) {
          var my = 290 + m * 88;
          var dishName = orderGame.menu[m];
          if (drawButton(ctx, 50, my, V_WIDTH - 100, 68, dishName, '#0d3b66', '#ffffff')) {
            if (dishName === orderGame.currentOrder) {
              AudioEngine.playSuccess();
              orderGame.score += 1;
              state.coins += 5;
              state.scores['GAME_B5'] = Math.max(state.scores['GAME_B5'] || 0, orderGame.score);
              saveStorage();
              nextOrder();
            } else {
              AudioEngine.playSplat();
            }
          }
        }
      }

      // -------------------------------------------------------------
      // 11. SCENE DISPATCHER & MAIN TICK
      // -------------------------------------------------------------
      function tick() {
        ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);

        switch (state.currentScene) {
          case 'LOGIN':
            renderLoginScene();
            break;
          case 'WARDROBE':
            renderWardrobeScene();
            break;
          case 'OVERWORLD':
            renderOverworldScene();
            break;
          case 'FESTIVE_MENU':
            renderFestiveMenu();
            break;
          case 'CHEF_MENU':
            renderChefMenu();
            break;
          case 'GAME_A1':
            renderGameA1();
            break;
          case 'GAME_A2':
            renderGameA2();
            break;
          case 'GAME_A3':
            renderGameA3();
            break;
          case 'GAME_A4':
            renderGameA4();
            break;
          case 'GAME_A5':
            renderGameA5();
            break;
          case 'GAME_B1':
            renderGameB1();
            break;
          case 'GAME_B2':
            renderGameB2();
            break;
          case 'GAME_B3':
            renderGameB3();
            break;
          case 'GAME_B4':
            renderGameB4();
            break;
          case 'GAME_B5':
            renderGameB5();
            break;
          default:
            renderLoginScene();
            break;
        }

        // Reset single-frame inputs
        input.justPressed = false;
        input.justReleased = false;

        // Legacy cross-browser animation frame request
        var requestAnim = window.requestAnimationFrame ||
                          window.webkitRequestAnimationFrame ||
                          window.mozRequestAnimationFrame ||
                          function (callback) { window.setTimeout(callback, 1000 / 60); };
        requestAnim(tick);
      }

      // Boot application on window load
      window.onload = function () {
        resizeCanvas();
        tick();
      };
    })();
  </script>
</body>
</html>
