<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Isis Land</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #87CEEB;
      font-family: 'Arial Rounded MT Bold', 'Helvetica', sans-serif;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
    }
    #ui-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .html-card {
      background: white;
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.18);
      text-align: center;
      max-width: 320px;
      width: 85%;
      border: 4px solid #FFD700;
      pointer-events: auto;
      display: none;
      flex-direction: column;
      gap: 15px;
    }
    h1 { color: #FF69B4; font-size: 32px; margin: 0; }
    input[type="text"] {
      padding: 12px;
      border-radius: 15px;
      border: 2px solid #ddd;
      font-size: 16px;
      width: 100%;
      box-sizing: border-box;
      font-family: inherit;
    }
    .btn {
      background: linear-gradient(180deg, #FF69B4 0%, #FF1493 100%);
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 0 #C71585;
      font-family: inherit;
    }
    .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #C71585; }
    .file-input { display: none; }
    .photo-preview {
      width: 100px; height: 100px;
      border-radius: 50%;
      background: #ddd;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 2px solid #FF69B4;
    }
  </style>
</head>
<body>

  <div id="game-container"></div>
  

  <div id="ui-overlay">
    
    <div id="start-card" class="html-card" style="display: flex;">
      <h1>✨ Isis Land ✨</h1>
      <p>Bem-vinda ao seu mundo mágico de aprender e brincar!</p>
      <button class="btn" id="btn-start">JOGAR ▶️</button>
      <div style="display: flex; gap: 10px; justify-content: center;">
        <button class="btn" style="padding: 10px;">🔊</button>
        <button class="btn" style="padding: 10px;">⚙️</button>
      </div>
    </div>

    
    <div id="register-card" class="html-card">
      <h1>Seu Perfil</h1>
      <input type="text" id="input-name" placeholder="Digite seu nome">
      <div style="display: flex; gap: 10px;">
        <label class="btn" style="padding: 10px;">M</label>
        <label class="btn" style="padding: 10px;">F</label>
      </div>
      <div class="photo-preview" id="photo-area">📸</div>
      <input type="file" id="file-upload" class="file-input" accept="image/*">
      <button class="btn" id="btn-upload">Carregar Foto</button>
      <button class="btn" id="btn-submit">OK</button>
    </div>

    
    <div id="avatar-card" class="html-card">
      <h1>Escolha seu Avatar</h1>
      <div id="avatar-selection" style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;"></div>
      <div id="clothing-selection" style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 15px;"></div>
      <button class="btn" id="btn-create">CRIAR AVATAR</button>
    </div>
  </div>

  <script>
    const ui = {
      start: document.getElementById('start-card'),
      register: document.getElementById('register-card'),
      avatar: document.getElementById('avatar-card'),
      name: document.getElementById('input-name'),
      file: document.getElementById('file-upload'),
      preview: document.getElementById('photo-area'),
      btnUpload: document.getElementById('btn-upload'),
    };

    ui.btnUpload.addEventListener('click', () => ui.file.click());
    ui.file.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        const reader = new FileReader();
        reader.onload = (event) => {
          ui.preview.innerHTML = `<img src="${event.target.result}" style="width:100%; height:100%; object-fit:cover;">`;
        };
        reader.readAsDataURL(e.target.files.readAsDataURL(e.target.files[0]);
      }
    });

    const config = {
      type: Phaser.AUTO,
      parent: 'game-container',
      width: window.innerWidth,
      height: window.innerHeight,
      backgroundColor: '#87CEEB',
      physics: {
        default: 'arcade',
        arcade: { debug: false }
      },
      scene: [StartScene, CloudTransitionScene, RegisterScene, AvatarScene, IslandScene]
    };
    const game = new Phaser.Game(config);


    class StartScene extends Phaser.Scene {
      constructor() { super('StartScene'); }
      create() {
        document.getElementById('btn-start').onclick = () => {
          ui.start.style.display = 'none';
          this.scene.start('CloudTransitionScene');
        };
      }
    }

    class CloudTransitionScene extends Phaser.Scene {
      constructor() { super('CloudTransitionScene'); }
      create() {
        const w = this.scales.width;
        const h = this.scales.height;
        this.cameras.main.setBackgroundColor('#FFC0CB');

        let clouds = [];
        for (let i = 0; i < 6; i++) {
          let cloud = this.add.circle(100 + i * 150, h/2, 60, 0xFFFFFF);
          cloud.setAlpha(0.9);
          clouds.push(cloud);
        }

        this.tweens.add({
          targets: clouds,
          x: '+=1000',
          duration: 3000,
          stagger: 200,
          onComplete: () => {
            ui.register.style.display = 'flex';
            this.scene.start('RegisterScene');
          }
        });
      }
    }

    class RegisterScene extends Phaser.Scene {
      constructor() { super('RegisterScene'); }
      create() {
        document.getElementById('btn-submit').onclick = () => {
          if (ui.name.value.trim() !== "") {
            ui.register.style.display = 'none';
            this.scene.start('AvatarScene');
          }
        };
      }
    }

    class AvatarScene extends Phaser.Scene {
      constructor() { super('AvatarScene'); }
      create() {
        const avatars = [0xFF69B4, 0x00BFFF, 0x32CD32];
        const container = document.getElementById('avatar-selection');
        avatars.forEach(color => {
          let div = document.createElement('div');
          div.style.width = '50px'; div.style.height = '50px';
          div.style.borderRadius = '50%'; div.style.background = color.toString(16);
          div.style.background = '#' + color.toString(16).padStart(6, '0');
          container.appendChild(div);
        });

        const clothes = [0xFFFF00, 0xFF4500];
        const clothContainer = document.getElementById('clothing-selection');
        clothes.forEach(color => {
          let div = document.createElement('div');
          div.style.width = '50px'; div.style.height = '30px';
          div.style.background = '#' + color.toString(16).padStart(6, '0');
          clothContainer.appendChild(div);
        });

        document.getElementById('btn-create').onclick = () => {
          ui.avatar.style.display = 'none';
          this.scene.start('IslandScene');
        };
      }
    }

    class IslandScene extends Phaser.Scene {
      constructor() { super('IslandScene'); }
      create() {
        const w = this.scale.width;
        const h = this.scale.height;

        this.cameras.main.setZoom(0.001);
        this.tweens.add({
          targets: this.cameras.main,
          zoom: 1,
          duration: 2500,
          ease: 'Cubic'
        });

        const bg = this.add.rectangle(w/2, h/2, w, h, 0x87CEEB).setScrollFactor(0);
        const sun = this.add.circle(w - 100, 100, 50, 0xFFD700).setScrollFactor(0);

        const groundBounds = new Phaser.Geom.Rectangle(0, h - 200, w*2, 200);
        this.physics.world.setBounds(0, 0, w*2, h);

        this.ground = this.add.rectangle(w, h - 100, w*2, 200, 0x32CD32);
        this.physics.add.existing(this.ground, true);

        this.player = this.add.circle(w, h - 300, 30, 0xFF69B4);
        this.player.setStrokeStyle(4, 0xFFFFFF);
        this.physics.add.existing(this.player);
        this.player.body.setCollideWorldBounds(true);
        this.physics.add.collider(this.player, this.ground);

        this.cameras.main.startFollow(this.player, true, 0.05, 0.05);
        this.cameras.main.setBounds(0, 0, w*2, h);


        this.buildUI(w, h);
        this.setupControls();
      }

      buildUI(w, h) {
        const uiGroup = this.add.container().setScrollFactor(0);

        const dPadLeft = this.add.circle(100, h - 100, 50, 0x000000, 0.3);
        const dPadRight = this.add.circle(220, h - 100, 50, 0x000000, 0.3);
        const btnJump = this.add.circle(w - 150, h - 100, 60, 0xFF1493, 0.5);

        dPadLeft.setInteractive();
        dPadRight.setInteractive();
        btnJump.setInteractive();

        this.moveLeft = false;
        this.moveRight = false;

        dPadLeft.on('pointerdown', () => this.moveLeft = true);
        dPadLeft.on('pointerup', () => this.moveLeft = false);
        dPadLeft.on('pointerout', () => this.moveLeft = false);

        dPadRight.on('pointerdown', () => this.moveRight = true);
        dPadRight.on('pointerup', () => this.moveRight = false);
        dPadRight.on('pointerout', () => this.moveRight = false);

        btnJump.on('pointerdown', () => {
          if (this.player.body.touching.down) {
            this.player.body.setVelocityY(-400);
          }
        });

        uiGroup.add([dPadLeft, dPadRight, btnJump]);
      }

      setupControls() {
        this.cursors = this.input.keyboard.createCursorKeys();
      }

      update() {
        if (this.cursors.left.isDown || this.moveLeft) {
          this.player.body.setVelocityX(-200);
        } else if (this.cursors.right.isDown || this.moveRight) {
          this.player.body.setVelocityX(200);
        } else {
          this.player.body.setVelocityX(0);
        }

        if (this.cursors.up.isDown && this.player.body.touching.down) {
          this.player.body.setVelocityY(-400);
        }
      }
    }
  </script>
</body>
</html>
