<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IsIsland - A Ilha da Ísis</title>
<!-- Phaser 3 CDN Otimizado -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
<style>
* {
box-sizing: border-box;
user-select: none;
-webkit-user-select: none;
-webkit-touch-callout: none;
}
body {
margin: 0;
padding: 0;
background: #030712;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
overflow: hidden;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
#game-container {
width: 100%;
max-width: 480px;
height: 100%;
max-height: 854px;
box-shadow: 0 0 30px rgba(0, 0, 0, 0.95);
position: relative;
background: #87CEEB;
}
</style>
</head>
<body>
<div id="game-container"></div>
<script>
// =========================================================================
// ARQUITETURA CENTRAL DE DADOS & ESTADO GLOBAL (ISLAND CORE v5.0)
// =========================================================================
const GAME_CONFIG = {
type: Phaser.AUTO,
parent: 'game-container',
width: 480,
height: 854,
backgroundColor: '#70d6ff',
scale: {
mode: Phaser.Scale.FIT,
autoCenter: Phaser.Scale.CENTER_BOTH
},
scene: [
MasterBootScene,
SplashLoaderScene,
MainMenuScene,
CharacterCustomizerScene,
IslandWorldScene,
KitchenManagerScene,
MiniGameBurgerScene,
MiniGamePizzaScene,
MiniGameSweetsScene,
SeasonalEventsScene,
ProfileSettingsScene
]
};
let gameState = {
version: '5.0.0-mega',
quality: 'HIGH',
sound: true,
player: {
name: 'Ísis',
gender: 'menina',
avatarPhoto: null,
coins: 1500,
gems: 50,
level: 1,
experience: 0
},
inventory: {
hats: ['Coroa Ouro', 'Laço Rosa', 'Chapéu Natalino'],
activeHat: 'Coroa Ouro',
tops: ['Camiseta Azul', 'Cropped Vermelho', 'Vestido Princesa'],
activeTop: 'Camiseta Azul',
bottoms: ['Tênis Rosa', 'Coturno', 'Sandália Festiva'],
activeBottom: 'Tênis Rosa'
},
restaurants: {
burgerIsland: { level: 1, unlocked: true },
pizzaIsland: { level: 1, unlocked: true },
sweetIsland: { level: 1, unlocked: false }
}
};
// =========================================================================
// MÓDULO 1: MASTER BOOT SCENE (Inicialização Segura para iOS 12)
// =========================================================================
class MasterBootScene extends Phaser.Scene {
constructor() {
super('MasterBootScene');
}
preload() {
let graphics = this.make.graphics({ x: 0, y: 0, add: false });
// Fundo de Céu Principal
graphics.fillStyle(0x3a86ff, 1);
graphics.fillRect(0, 0, 480, 854);
graphics.generateTexture('tex_sky', 480, 854);
graphics.clear();
// Base Isométrica da Ilha Principal
graphics.fillStyle(0x38b000, 1);
graphics.fillEllipse(240, 440, 420, 280);
graphics.fillStyle(0x70e000, 1);
graphics.fillEllipse(240, 425, 370, 230);
graphics.fillStyle(0xfde047, 1);
graphics.fillEllipse(240, 470, 440, 140);
graphics.generateTexture('tex_isometric_island', 480, 800);
graphics.clear();
// Botão Padrão Principal
graphics.fillStyle(0xff0054, 1);
graphics.fillRoundedRect(0, 0, 280, 70, 22);
graphics.generateTexture('tex_btn_main', 280, 70);
graphics.clear();
// Botão Secundário
graphics.fillStyle(0xffb703, 1);
graphics.fillRoundedRect(0, 0, 190, 55, 16);
graphics.generateTexture('tex_btn_sec', 190, 55);
graphics.clear();
}
create() {
this.scene.start('SplashLoaderScene');
}
}
// =========================================================================
// MÓDULO 2: SPLASH LOADER & AUDIO SYSTEM
// =========================================================================
class SplashLoaderScene extends Phaser.Scene {
constructor() {
super('SplashLoaderScene');
}
create() {
this.add.image(240, 427, 'tex_sky');
this.add.text(240, 320, 'ISLAND', { fontSize: '76px', fontStyle: 'bold', color: '#ffb703' }).setOrigin(0.5);
this.add.text(240, 390, 'A Ilha Mágica da Ísis', { fontSize: '24px', fontStyle: 'bold', color: '#ffffff' }).setOrigin(0.5);
let loadingBar = this.add.rectangle(240, 520, 320, 24, 0x000000, 0.4).setOrigin(0.5);
let progressFill = this.add.rectangle(88, 520, 10, 16, 0x06d6a0).setOrigin(0, 0.5);
let progress = 0;
this.time.addEvent({
delay: 25,
repeat: 100,
callback: () => {
progress++;
progressFill.width = (310 * progress) / 100;
if (progress >= 100) {
this.scene.start('MainMenuScene');
}
}
});
}
}
// =========================================================================
// MÓDULO 3: MAIN MENU SCENE (Menu Principal Rico e Temático)
// =========================================================================
class MainMenuScene extends Phaser.Scene {
constructor() {
super('MainMenuScene');
}
create() {
this.add.image(240, 427, 'tex_sky');
let c1 = this.add.circle(80, 140, 50, 0xffffff, 0.85);
let c2 = this.add.circle(400, 210, 70, 0xffffff, 0.85);
this.tweens.add({
targets: [c1, c2],
x: '+= 40',
duration: 4000,
yoyo: true,
repeat: -1,
ease: 'Sine.easeInOut'
});
this.add.text(240, 142, 'ISLAND', { fontSize: '72px', fontStyle: 'bold', color: '#7209b7' }).setOrigin(0.5);
this.add.text(240, 138, 'ISLAND', { fontSize: '72px', fontStyle: 'bold', color: '#ff0054' }).setOrigin(0.5);
this.add.image(240, 440, 'tex_isometric_island').setScale(0.9);
this.createDistrictBadge(240, 330, '👑 Reino da Ísis', 0xf72585);
this.createDistrictBadge(130, 470, '🎄 Natal', 0x06d6a0);
this.createDistrictBadge(350, 470, '🐰 Páscoa', 0xff0054);
this.createDistrictBadge(240, 570, '🎉 Carnaval', 0xffb703);
let btnStart = this.add.image(240, 690, 'tex_btn_main').setInteractive();
this.add.text(240, 690, 'JOGAR AGORA', { fontSize: '26px', fontStyle: 'bold', color: '#ffffff' }).setOrigin(0.5);
btnStart.on('pointerdown', () => {
this.playAudioFeedback();
this.scene.start('CharacterCustomizerScene');
});
let btnSettings = this.add.image(140, 785, 'tex_btn_sec').setInteractive();
this.add.text(140, 785, 'Configurações', { fontSize: '18px', fontStyle: 'bold', color: '#000' }).setOrigin(0.5);
btnSettings.on('pointerdown', () => this.scene.start('ProfileSettingsScene'));
let btnEvents = this.add.image(340, 785, 'tex_btn_sec').setInteractive();
this.add.text(340, 785, 'Eventos', { fontSize: '18px', fontStyle: 'bold', color: '#000' }).setOrigin(0.5);
btnEvents.on('pointerdown', () => this.scene.start('SeasonalEventsScene'));
}
createDistrictBadge(x, y, label, color) {
let badge = this.add.rectangle(x, y, 130, 42, color, 0.92).setInteractive();
badge.setStrokeStyle(3, 0xffffff);
this.add.text(x, y, label, { fontSize: '15px', fontStyle: 'bold', color: '#ffffff' }).setOrigin(0.5);
}
playAudioFeedback() {
if (!gameState.sound) return;
try {
let ctx = new (window.AudioContext || window.webkitAudioContext)();
let osc = ctx.createOscillator();
let gain = ctx.createGain();
osc.type = 'sine';
osc.frequency.setValueAtTime(523.25, ctx.currentTime);
gain.gain.setValueAtTime(0.1, ctx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
osc.connect(gain);
gain.connect(ctx.destination);
osc.start();
osc.stop(ctx.currentTime + 0.15);
} catch(e) {}
}
}
// =========================================================================
// MÓDULO 4: CHARACTER CUSTOMIZER SCENE (Avatar & Upload Seguro iOS 12)
// =========================================================================
class CharacterCustomizerScene extends Phaser.Scene {
constructor() {
super('CharacterCustomizerScene');
}
create() {
this.add.rectangle(240, 427, 480, 854, 0xffe5ec);
this.add.text(240, 50, 'Personalizar Personagem', { fontSize: '26px', fontStyle: 'bold', color: '#d90429' }).setOrigin(0.5);
let btnMenina = this.add.rectangle(130, 115, 120, 45, gameState.player.gender === 'menina' ? 0xffb703 : 0xffffff).setInteractive();
btnMenina.setStrokeStyle(3, 0xd90429);
this.add.text(130, 115, '👧 Menina', { fontSize: '16px', fontStyle: 'bold', color: '#000' }).setOrigin(0.5);
let btnMenino = this.add.rectangle(350, 115, 120, 45, gameState.player.gender === 'menino' ? 0xffb703 : 0xffffff).setInteractive();
btnMenino.setStrokeStyle(3, 0x1d3557);
this.add.text(350, 115, '👦 Menino', { fontSize: '16px', fontStyle: 'bold', color: '#000' }).setOrigin(0.5);
btnMenina.on('pointerdown', () => {
gameState.player.gender = 'menina';
btnMenina.setFillStyle(0xffb703);
btnMenino.setFillStyle(0xffffff);
});
btnMenino.on('pointerdown', () => {
gameState.player.gender = 'menino';
btnMenino.setFillStyle(0xffb703);
btnMenina.setFillStyle(0xffffff);
});
let avatarBox = this.add.rectangle(240, 260, 200, 210, 0xffffff).setInteractive();
avatarBox.setStrokeStyle(4, 0xffb703);
let placeholder = this.add.text(240, 260, 'Avatar\n(Toque para carregar foto)', { fontSize: '14px', align: 'center', color: '#666' }).setOrigin(0.5);
let btnUpload = this.add.rectangle(150, 395, 150, 45, 0x3a86ff).setInteractive();
this.add.text(150, 395, 'Carregar Foto', { fontSize: '15px', fontStyle: 'bold', color: '#fff' }).setOrigin(0.5);
let btnRemove = this.add.rectangle(330, 395, 110, 45, 0xef233c).setInteractive();
this.add.text(330, 395, 'Remover', { fontSize: '15px', fontStyle: 'bold', color: '#fff' }).setOrigin(0.5);
let fileInput = document.createElement('input');
fileInput.type = 'file';
fileInput.accept = 'image/*';
fileInput.style.display = 'none';
document.body.appendChild(fileInput);
fileInput.onchange = (e) => {
let file = e.target.files[0];
if (file) {
let reader = new FileReader();
reader.onload = (event) => {
let key = 'user_avatar_custom';
if (this.textures.exists(key)) this.textures.remove(key);
this.load.image(key, event.target.result);
this.load.once('complete', () => {
placeholder.setVisible(false);
if (this.avatarImg) this.avatarImg.destroy();
this.avatarImg = this.add.image(240, 260, key).setDisplaySize(160, 175);
gameState.player.avatarPhoto = key;
});
this.load.start();
};
reader.readAsDataURL(file);
}
};
btnUpload.on('pointerdown', () => fileInput.click());
btnRemove.on('pointerdown', () => {
if (this.avatarImg) { this.avatarImg.destroy(); this.avatarImg = null; }
placeholder.setVisible(true);
gameState.player.avatarPhoto = null;
fileInput.value = '';
});
let nameBox = this.add.rectangle(240, 470, 320, 50, 0xffffff).setInteractive();
nameBox.setStrokeStyle(2, 0xadb5bd);
let nameTxt = this.add.text(240, 470, gameState.player.name, { fontSize: '20px', fontStyle: 'bold', color: '#000' }).setOrigin(0.5);
nameBox.on('pointerdown', () => {
let n = prompt("Digite o nome da Ísis / Jogador:", gameState.player.name);
if (n !== null && n.trim() !== '') {
gameState.player.name = n.trim();
nameTxt.setText(gameState.player.name);
}
});
let btnOk = this.add.image(240, 765, 'tex_btn_main').setInteractive();
this.add.text(240, 765, 'SALVAR E ENTRAR', { fontSize: '20px', fontStyle: 'bold', color: '#fff' }).setOrigin(0.5);
btnOk.on('pointerdown', () => {
if (fileInput.parentNode) fileInput.parentNode.removeChild(fileInput);
this.scene.start('IslandWorldScene');
});
}
}
// =========================================================================
// MÓDULO 5: ISLAND WORLD SCENE (Mapa Principal Interativo)
// =========================================================================
class IslandWorldScene extends Phaser.Scene {
constructor() {
super('IslandWorldScene');
}
create() {
this.add.image(240, 427, 'tex_sky');
this.add.image(240, 440, 'tex_isometric_island').setScale(1.1);
this.add.text(240, 55, ⁠Bem-vinda, ${gameState.player.name}!⁠, { fontSize: '24px', fontStyle: 'bold', color: '#fff', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5);
this.createNode(130, 310, '🍔 Burger Island', 0xf72585, 'MiniGameBurgerScene');
this.createNode(350, 310, '🍕 Pizza Festival', 0x7209b7, 'MiniGamePizzaScene');
this.createNode(240, 460, '🍦 Doce Ilha', 0x3a0ca3, 'MiniGameSweetsScene');
this.createNode(140, 600, '🎄 Natal', 0x06d6a0, 'SeasonalEventsScene');
this.createNode(340, 600, '🐰 Páscoa', 0xff0054, 'SeasonalEventsScene');
this.add.rectangle(240, 105, 300, 36, 0x000000, 0.4).setStrokeStyle(2, 0xffb703);
this.add.text(240, 105, ⁠🪙 ${gameState.player.coins}   💎 ${gameState.player.gems}   ⭐ Nível ${gameState.player.level}⁠, { fontSize: '15px', fontStyle: 'bold', color: '#ffb703' }).setOrigin(0.5);
let btnBack = this.add.rectangle(75, 785, 110, 40, 0x222222, 0.9).setInteractive();
this.add.text(75, 785, '⬅ Menu', { fontSize: '15px', color: '#fff' }).setOrigin(0.5);
btnBack.on('pointerdown', () => this.scene.start('MainMenuScene'));
}
createNode(x, y, title, color, targetScene) {
let circle = this.add.circle(x, y, 42, color).setInteractive();
circle.setStrokeStyle(4, 0xffffff);
this.add.text(x, y + 52, title, { fontSize: '13px', fontStyle: 'bold', color: '#fff', stroke: '#000', strokeThickness: 3, align: 'center' }).setOrigin(0.5);
circle.on('pointerdown', () => {
this.scene.start(targetScene);
});
}
}
// =========================================================================
// MÓDULOS 6, 7, 8, 9, 10: MINIJOGOS DE CULINÁRIA & EVENTOS SAZONAIS
// =========================================================================
class MiniGameBurgerScene extends Phaser.Scene {
constructor() { super('MiniGameBurgerScene'); }
create() {
this.add.rectangle(240, 427, 480, 854, 0xf8f9fa);
this.add.rectangle(240, 45, 480, 70, 0xf72585);
this.add.text(240, 40, '🍔 Burger Island', { fontSize: '24px', fontStyle: 'bold', color: '#fff' }).setOrigin(0.5);
let score = 0;
let scoreTxt = this.add.text(240, 200, ⁠Hambúrgueres Prontos: ${score}⁠, { fontSize: '20px', fontStyle: 'bold', color: '#333' }).setOrigin(0.5);
let grill = this.add.rectangle(240, 360, 280, 120, 0xdda15e).setInteractive();
grill.setStrokeStyle(3, 0xffffff);
this.add.text(240, 360, '🔥 Toque para Grelhar!', { fontSize: '18px', fontStyle: 'bold', color: '#fff' }).setOrigin(0.5);
grill.on('pointerdown', () => {
score++;
gameState.player.coins += 10;
scoreTxt.setText(⁠Hambúrgueres Prontos: ${score}⁠);
this.tweens.add({ targets: grill, scale: 1.05, duration: 60, yoyo: true });
});
let btnBack = this.add.image(240, 770, 'tex_btn_main').setInteractive();
this.add.text(240, 770, 'VOLTAR PARA A ILHA', { fontSize: '18px', fontStyle: 'bold', color: '#fff' }).setOrigin(0.5);
btnBack.on('pointerdown', () => this.scene.start('IslandWorldScene'));
}
}
class MiniGamePizzaScene extends Phaser.Scene {
constructor() { super('MiniGamePizzaScene'); }
create() {
this.add.rectangle(240, 427, 480, 854, 0xf8f9fa);
this.add.rectangle(240, 45, 480, 70, 0x7209b7);
this.add.text(240, 40, '🍕 Pizza Festival', { fontSize: '24px', fontStyle: 'bold', color: '#fff' }).setOrigin(0.5);
this.add.text(240, 250, 'Monte a pizza perfeita!', { fontSize: '18px', fontStyle: 'bold', color: '#333' }).setOrigin(0.5);
let btnBack = this.add.image(240, 770, 'tex_btn_main').setInteractive();
this.add.text(240, 770, 'VOLTAR PARA A ILHA', { fontSize: '18px', fontStyle: 'bold', color: '#fff' }).setOrigin(0.5);
btnBack.on('pointerdown', () => this.scene.start('IslandWorldScene'));
}
}
class MiniGameSweetsScene extends Phaser.Scene {
constructor() { super('MiniGameSweetsScene'); }
create() {
this.add.rectangle(240, 427, 480, 854, 0xf8f9fa);
this.add.rectangle(240, 45, 480, 70, 0x3a0ca3);
this.add.text(240, 40, '🍦 Doce Ilha', { fontSize: '24px', fontStyle: 'bold', color: '#fff' }).setOrigin(0.5);
this.add.text(240, 250, 'Crie sobremesas incríveis!', { fontSize: '18px', fontStyle: 'bold', color: '#333' }).setOrigin(0.5);
let btnBack = this.add.image(240, 770, 'tex_btn_main').setInteractive();
this.add.text(240, 770, 'VOLTAR PARA A ILHA', { fontSize: '18px', fontStyle: 'bold', color: '#fff' }).setOrigin(0.5);
btnBack.on('pointerdown', () => this.scene.start('IslandWorldScene'));
}
}
class SeasonalEventsScene extends Phaser.Scene {
constructor() { super('SeasonalEventsScene'); }
create() {
this.add.rectangle(240, 427, 480, 854, 0x0d1b2a);
this.add.text(240, 80, 'Eventos Especiais', { fontSize: '28px', fontStyle: 'bold', color: '#06d6a0' }).setOrigin(0.5);
this.add.text(240, 250, '🎄 Natal, 🐰 Páscoa & 🎉 Carnaval\nConteúdos sazonais ativos!', { fontSize: '16px', color: '#fff', align: 'center' }).setOrigin(0.5);
let btnBack = this.add.image(240, 770, 'tex_btn_main').setInteractive();
this.add.text(240, 770, 'VOLTAR', { fontSize: '18px', fontStyle: 'bold', color: '#fff' }).setOrigin(0.5);
btnBack.on('pointerdown', () => this.scene.start('MainMenuScene'));
}
}
class ProfileSettingsScene extends Phaser.Scene {
constructor() { super('ProfileSettingsScene'); }
create() {
this.add.rectangle(240, 427, 480, 854, 0xf8f9fa);
this.add.text(240, 80, 'Configurações', { fontSize: '28px', fontStyle: 'bold', color: '#1d3557' }).setOrigin(0.5);
let btnSoundToggle = this.add.rectangle(240, 250, 280, 50, 0x4361ee).setInteractive();
let soundTxt = this.add.text(240, 250, ⁠Som: ${gameState.sound ? 'LIGADO' : 'DESLIGADO'}⁠, { fontSize: '18px', fontStyle: 'bold', color: '#fff' }).setOrigin(0.5);
btnSoundToggle.on('pointerdown', () => {
gameState.sound = !gameState.sound;
soundTxt.setText(⁠Som: ${gameState.sound ? 'LIGADO' : 'DESLIGADO'}⁠);
});
let btnBack = this.add.image(240, 770, 'tex_btn_main').setInteractive();
this.add.text(240, 770, 'VOLTAR', { fontSize: '18px', fontStyle: 'bold', color: '#fff' }).setOrigin(0.5);
btnBack.on('pointerdown', () => this.scene.start('MainMenuScene'));
}
}
// Inicialização Global
window.onload = function() {
new Phaser.Game(GAME_CONFIG);
};
</script>
</body>
</html>
