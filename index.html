<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Isis Land - Educational Discovery Island</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Game Architecture State Manager
        const GameState = {
            current: 'login', // login, map, district, minigame, wardrobe, achievements
            coins: 250,
            stars: 45,
            selectedExplorer: 'Explorer Tim',
            passcode: '1234',
            activeDistrict: null,
            activeMinigame: null,
            audioEnabled: true
        };

        // Districts Definition (Multiple Seasonal & Holiday Themes with 5 Mini-games each)
        const districts = [
            {
                id: 'festive',
                name: 'Festive District',
                theme: 'Birthday & Celebration Party',
                color: '#FF69B4',
                x: 0.25,
                y: 0.35,
                games: [
                    'Birthday Cake Decorator',
                    'Balloon Pop Reflex',
                    'Gift Color Sorting',
                    'Musical Memory Bells',
                    'Candle Blow Out'
                ]
            },
            {
                id: 'culinary',
                name: 'Culinary Island',
                theme: 'Chef Cook-off & Snacks',
                color: '#FFA500',
                x: 0.75,
                y: 0.45,
                games: [
                    'Pizza Master Builder',
                    'Juice Bar Blending',
                    'Burger Stack Challenge',
                    'Cookie Shape Match',
                    'Kitchen Timer Rush'
                ]
            },
            {
                id: 'winter',
                name: 'Winter Wonderland',
                theme: 'Holiday Snow & Ice Festival',
                color: '#00CED1',
                x: 0.35,
                y: 0.70,
                games: [
                    'Snowflake Catch',
                    'Ice Sculpting',
                    'Penguin Slide',
                    'Hot Cocoa Mixer',
                    'Snowball Target'
                ]
            },
            {
                id: 'wisdom',
                name: 'Wisdom Castle',
                theme: 'Royal Library & Puzzle Hall',
                color: '#9370DB',
                x: 0.65,
                y: 0.75,
                games: [
                    'Alphabet Quest',
                    'Number Match',
                    'Shape Castle Build',
                    'Memory Cards',
                    'Logic Maze'
                ]
            }
        ];

        // Touch & Mouse Input Handlers
        canvas.addEventListener('pointerdown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            processInput(x, y);
        });

        function processInput(x, y) {
            if (GameState.current === 'login') {
                // Enter Island Button
                if (x > canvas.width/2 - 150 && x < canvas.width/2 + 150 && y > canvas.height/2 + 100 && y < canvas.height/2 + 170) {
                    GameState.current = 'map';
                }
            } else if (GameState.current === 'map') {
                // Check district clicks
                districts.forEach(d => {
                    const dx = x - canvas.width * d.x;
                    const dy = y - canvas.height * d.y;
                    if (Math.hypot(dx, dy) < 55) {
                        GameState.activeDistrict = d;
                        GameState.current = 'district';
                    }
                });

                // Bottom bar buttons
                if (y > canvas.height - 80) {
                    if (x < canvas.width / 2) {
                        GameState.current = 'login';
                    } else {
                        GameState.current = 'wardrobe';
                    }
                }
            } else if (GameState.current === 'district') {
                // Back to map
                if (y < 70 && x < 100) {
                    GameState.current = 'map';
                    return;
                }
                // Check game list clicks
                let startY = canvas.height / 2 - 100;
                GameState.activeDistrict.games.forEach((game, idx) => {
                    if (y > startY + idx * 55 && y < startY + idx * 55 + 45 && x > canvas.width/2 - 200 && x < canvas.width/2 + 200) {
                        GameState.activeMinigame = game;
                        GameState.current = 'minigame';
                    }
                });
            } else if (GameState.current === 'minigame' || GameState.current === 'wardrobe') {
                // Back button
                if (y < 70 && x < 100) {
                    GameState.current = GameState.current === 'minigame' ? 'district' : 'map';
                }
            }
        }

        // Render Engine Functions
        function renderLogin() {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Background Decorative Elements
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.arc(canvas.width/2, canvas.height/2 - 50, 120, 0, Math.PI*2);
            ctx.fill();

            // Title Container
            ctx.fillStyle = '#334155';
            ctx.roundRect(canvas.width/2 - 220, 50, 440, 110, 24);
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#38bdf8';
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 36px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Isis Land', canvas.width/2, 100);
            ctx.font = '16px sans-serif';
            ctx.fillStyle = '#94a3b8';
            ctx.fillText('🌴 Educational Discovery Island - Complete Experience 🏝️', canvas.width/2, 135);

            // Enter Button
            ctx.fillStyle = '#10b981';
            ctx.roundRect(canvas.width/2 - 160, canvas.height/2 + 100, 320, 70, 20);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 24px sans-serif';
            ctx.fillText('ENTER ISLAND 🚀', canvas.width/2, canvas.height/2 + 143);
        }

        function renderMap() {
            // Ocean Background
            ctx.fillStyle = '#0ea5e9';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Island Base Shape
            ctx.fillStyle = '#15803d';
            ctx.beginPath();
            ctx.ellipse(canvas.width/2, canvas.height/2, canvas.width*0.4, canvas.height*0.35, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.lineWidth = 8;
            ctx.strokeStyle = '#166534';
            ctx.stroke();

            // Top HUD Stats Bar
            ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
            ctx.roundRect(20, 20, 140, 45, 22);
            ctx.fill();
            ctx.fillStyle = '#fbbf24';
            ctx.font = 'bold 18px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('🪙 ' + GameState.coins, 35, 50);

            ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
            ctx.roundRect(180, 20, 110, 45, 22);
            ctx.fill();
            ctx.fillStyle = '#22d3ee';
            ctx.fillText('⭐ ' + GameState.stars, 195, 50);

            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.font = 'bold 28px sans-serif';
            ctx.fillText('Isisland World Map', canvas.width/2, 50);

            // Draw Districts Nodes
            districts.forEach(d => {
                const posX = canvas.width * d.x;
                const posY = canvas.height * d.y;

                ctx.beginPath();
                ctx.arc(posX, posY, 55, 0, Math.PI*2);
                ctx.fillStyle = d.color;
                ctx.fill();
                ctx.lineWidth = 5;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText(d.name, posX, posY + 75);
            });

            // Bottom Navigation Bar
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, canvas.height - 85, canvas.width, 85);

            ctx.fillStyle = '#334155';
            ctx.roundRect(30, canvas.height - 70, canvas.width/2 - 45, 55, 14);
            ctx.fill();
            ctx.roundRect(canvas.width/2 + 15, canvas.height - 70, canvas.width/2 - 45, 55, 14);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 18px sans-serif';
            ctx.fillText('Switch Profile', canvas.width*0.25, canvas.height - 37);
            ctx.fillText('Change Outfit', canvas.width*0.75, canvas.height - 37);
        }

        function renderDistrict() {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Back Header
            ctx.fillStyle = '#334155';
            ctx.roundRect(20, 20, 110, 45, 12);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('⬅ Back', 75, 48);

            ctx.font = 'bold 32px sans-serif';
            ctx.fillStyle = GameState.activeDistrict.color;
            ctx.fillText(GameState.activeDistrict.name, canvas.width/2, 100);
            ctx.font = '18px sans-serif';
            ctx.fillStyle = '#94a3b8';
            ctx.fillText(GameState.activeDistrict.theme, canvas.width/2, 130);

            // Render 5 Mini-games List
            let startY = canvas.height / 2 - 110;
            GameState.activeDistrict.games.forEach((game, idx) => {
                ctx.fillStyle = '#334155';
                ctx.roundRect(canvas.width/2 - 220, startY + idx * 60, 440, 50, 14);
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = GameState.activeDistrict.color;
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 18px sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(`🎮 ${game}`, canvas.width/2 - 200, startY + idx * 60 + 31);
                
                ctx.fillStyle = '#fbbf24';
                ctx.textAlign = 'right';
                ctx.fillText('PLAY ▶', canvas.width/2 + 195, startY + idx * 60 + 31);
            });
        }

        function renderMinigame() {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Back Header
            ctx.fillStyle = '#334155';
            ctx.roundRect(20, 20, 110, 45, 12);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('⬅ Exit', 75, 48);

            ctx.font = 'bold 28px sans-serif';
            ctx.fillStyle = '#38bdf8';
            ctx.fillText(GameState.activeMinigame, canvas.width/2, 90);

            // Interactive Play Area Mockup Box
            ctx.fillStyle = '#1e293b';
            ctx.roundRect(canvas.width/2 - 250, 130, 500, canvas.height - 220, 20);
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#475569';
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = '20px sans-serif';
            ctx.fillText('Interactive Mini-game Canvas Loaded Successfully!', canvas.width/2, canvas.height/2);
            ctx.font = '14px sans-serif';
            ctx.fillStyle = '#94a3b8';
            ctx.fillText('Fully optimized for iPad Air 1 touch performance.', canvas.width/2, canvas.height/2 + 30);
        }

        function renderWardrobe() {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#334155';
            ctx.roundRect(20, 20, 110, 45, 12);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('⬅ Back', 75, 48);

            ctx.font = 'bold 30px sans-serif';
            ctx.fillStyle = '#a855f7';
            ctx.fillText('Wardrobe & Character Customization', canvas.width/2, 100);

            ctx.fillStyle = '#1e293b';
            ctx.roundRect(canvas.width/2 - 200, 150, 400, 300, 20);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = '20px sans-serif';
            ctx.fillText('Explorer: ' + GameState.selectedExplorer, canvas.width/2, 300);
        }

        // Main Loop
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (GameState.current === 'login') {
                renderLogin();
            } else if (GameState.current === 'map') {
                renderMap();
            } else if (GameState.current === 'district') {
                renderDistrict();
            } else if (GameState.current === 'minigame') {
                renderMinigame();
            } else if (GameState.current === 'wardrobe') {
                renderWardrobe();
            }
            requestAnimationFrame(gameLoop);
        }

        // Safari RoundRect Polyfill Safety
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };
        }

        gameLoop();
    </script>
</body>
</html>
