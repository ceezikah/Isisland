<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ISISLAND</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0;
      background-color: #29B6F6;
      font-family: 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

    /* Camada de UI sobre o Canvas */
    #ui-layer {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 10; pointer-events: none;
    }

    /* TELA 1: HUD Inicial estilo Star Island */
    #start-hud {
      width: 100%; height: 100%; position: absolute; top: 0; left: 0;
      pointer-events: none;
    }
    .game-title {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      font-size: clamp(34px, 7vw, 60px); font-weight: 900;
      color: #FFEB3B;
      text-shadow: 0 4px 0 #F57F17, -3px -3px 0 #E91E63, 3px -3px 0 #E91E63, -3px 3px 0 #E91E63, 3px 3px 0 #E91E63, 0 8px 15px rgba(0,0,0,0.35);
      letter-spacing: 3px; margin: 0; white-space: nowrap;
    }
    .side-menu {
      position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 14px; pointer-events: auto;
    }
    .star-btn {
      background: linear-gradient(180deg, #FFB300 0%, #FB8C00 100%);
      color: #fff; border: 3px solid #FFF;
      padding: 14px 28px; font-size: 22px; font-weight: bold;
      border-radius: 30px; cursor: pointer;
      box-shadow: 0 5px 0 #E65100, 0 8px 15px rgba(0,0,0,0.3);
      text-shadow: 1px 2px 0 #BF360C;
      font-family: inherit; transition: transform 0.1s;
    }
    .star-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #E65100; }
    .bottom-left-hud {
      position: absolute; bottom: 18px; left: 20px;
      display: flex; gap: 12px; pointer-events: auto;
    }
    .hud-toggle {
      background: rgba(0, 60, 120, 0.75); color: #FFF;
      border: 2px solid #81D4FA; padding: 8px 16px;
      font-size: 15px; font-weight: bold; border-radius: 20px;
      cursor: pointer; font-family: inherit;
      box-shadow: 0 3px 6px rgba(0,0,0,0.25);
    }

    /* TELA 2: Tela Rosinha de Perfil e Foto */
    #profile-screen {
      display: none; width: 100%; height: 100%;
      background: linear-gradient(180deg, #FF80AB 0%, #F8BBD0 100%);
      pointer-events: auto; flex-direction: column;
      align-items: center; justify-content: center; padding: 15px;
    }
    .pink-card {
      background: #FFF; border: 5px solid #FF4081; border-radius: 28px;
      padding: 20px 25px; width: 92%; max-width: 440px;
      box-shadow: 0 12px 30px rgba(194, 24, 91, 0.3);
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .pink-card h2 { color: #E91E63; margin: 0; font-size: 24px; }
    .gender-row { display: flex; gap: 15px; width: 100%; justify-content: center; }
    .gender-btn {
      flex: 1; padding: 10px; border-radius: 18px; border: 3px solid #E0E0E0;
      background: #F5F5F5; font-size: 16px; font-weight: bold; color: #555;
      cursor: pointer; font-family: inherit;
    }
    .gender-btn.active.boy { border-color: #2196F3; background: #E3F2FD; color: #1565C0; }
    .gender-btn.active.girl { border-color: #E91E63; background: #FCE4EC; color: #AD1457; }
    .photo-box {
      width: 110px; height: 110px; border-radius: 22px;
      border: 4px dashed #FF80AB; background: #FFF0F5;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative; font-size: 42px;
    }
    .photo-box img { width: 100%; height: 100%; object-fit: cover; }
    .photo-btns { display: flex; gap: 10px; }
    .btn-small {
      padding: 8px 14px; border-radius: 14px; border: none;
      font-weight: bold; font-size: 14px; cursor: pointer; font-family: inherit;
      color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,0.2);
    }
    .btn-load { background: #29B6F6; }
    .btn-remove { background: #EF5350; }
    .name-input {
      width: 100%; padding: 12px 15px; border-radius: 16px;
      border: 3px solid #F48FB1; font-size: 17px; text-align: center;
      font-family: inherit; outline: none; color: #333;
    }
    .btn-ok {
      background: linear-gradient(180deg, #66BB6A 0%, #43A047 100%);
      color: #fff; border: none; padding: 12px 40px; font-size: 20px;
      font-weight: bold; border-radius: 25px; cursor: pointer;
      box-shadow: 0 5px 0 #2E7D32; font-family: inherit; width: 100%;
    }

    /* TELA 3: Customização do Avatar (10 opções de cada) */
    #wardrobe-screen {
      display: none; width: 100%; height: 100%;
      background: linear-gradient(180deg, #CE93D8 0%, #F3E5F5 100%);
      pointer-events: auto; flex-direction: row;
      align-items: center; justify-content: center; padding: 12px; gap: 15px;
    }
    .avatar-preview-panel {
      background: #FFF; border: 4px solid #AB47BC; border-radius: 24px;
      padding: 15px; display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
      width: 40%; max-width: 240px; height: 90%; max-height: 360px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
    .wardrobe-panel {
      background: #FFF; border: 4px solid #AB47BC; border-radius: 24px;
      padding: 15px; display: flex; flex-direction: column;
      width: 58%; max-width: 420px; height: 90%; max-height: 360px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15); justify-content: space-between;
    }
    .cat-tabs {
      display: flex; gap: 5px; overflow-x: auto; padding-bottom: 6px;
    }
    .cat-tab {
      flex: 1; padding: 8px 6px; border-radius: 12px; border: 2px solid #E1BEE7;
      background: #F3E5F5; font-size: 12px; font-weight: bold; color: #6A1B9A;
      cursor: pointer; text-align: center; white-space: nowrap; font-family: inherit;
    }
    .cat-tab.active { background: #AB47BC; color: #FFF; border-color: #7B1FA2; }
    .items-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
      padding: 8px 0; overflow-y: auto; flex: 1; align-content: center;
    }
    .item-slot {
      aspect-ratio: 1; border-radius: 14px; border: 3px solid #E0E0E0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; font-size: 11px; font-weight: bold; color: #333;
      position: relative; padding: 4px; text-align: center;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,0.15);
    }
    .item-slot.selected { border-color: #FF4081; transform: scale(1.06); box-shadow: 0 0 10px rgba(255,64,129,0.5); }

    /* Transição de Nuvens e Círculo (Íris) */
    #cloud-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 25; overflow: hidden; display: none;
    }
    .cloud-puff {
      position: absolute; background: #FFF; border-radius: 50%;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      transition: transform 0.9s ease-in-out;
    }
    #iris-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 30; display: none;
      background: #000;
      clip-path: circle(150% at 50% 50%);
      transition: clip-path 1.1s ease-in-out;
    }

    @media (max-width: 600px) and (orientation: portrait) {
      #wardrobe-screen { flex-direction: column; }
      .avatar-preview-panel { width: 92%; height: 42%; max-width: none; }
      .wardrobe-panel { width: 92%; height: 52%; max-width: none; }
    }
  </style>
</head>
<body>

  <div id="game-container"></div>

  <div id="ui-layer">
    <!-- TELA 1: MENU INICIAL ESTILO STAR ISLAND -->
    <div id="start-hud">
      <h1 class="game-title">ISISLAND</h1>
      <div class="side-menu">
        <button class="star-btn" id="btn-start-game">Start Game</button>
      </div>
      <div class="bottom-left-hud">
        <button class="hud-toggle" id="btn-quality">Quality: HIGH</button>
        <button class="hud-toggle" id="btn-sound">Sound: ON</button>
      </div>
    </div>

    <!-- TELA 2: CADASTRO ROSINHA -->
    <div id="profile-screen">
      <div class="pink-card">
        <h2>✨ Quem vai brincar? ✨</h2>
        <div class="gender-row">
          <button class="gender-btn girl active" id="btn-girl">👧 Menina</button>
          <button class="gender-btn boy" id="btn-boy">👦 Menino</button>
        </div>
        <div class="photo-box" id="photo-preview">📸</div>
        <input type="file" id="file-input" accept="image/*" style="display:none">
        <div class="photo-btns">
          <button class="btn-small btn-load" id="btn-load-photo">📁 Carregar Foto</button>
          <button class="btn-small btn-remove" id="btn-remove-photo">🗑️ Remover</button>
        </div>
        <input type="text" class="name-input" id="player-name-input" placeholder="Digite seu nome..." maxlength="16" value="Isis">
        <button class="btn-ok" id="btn-profile-ok">OK ✔</button>
      </div>
    </div>

    <!-- TELA 3: GUARDA-ROUPA (10 OPÇÕES DE CADA) -->
    <div id="wardrobe-screen">
      <div class="avatar-preview-panel">
        <div id="avatar-name-label" style="font-weight:bold; color:#7B1FA2; font-size:18px;">Isis</div>
        <canvas id="avatar-canvas" width="140" height="190"></canvas>
        <div style="font-size:11px; color:#777; text-align:center;">Gerado pela sua foto!</div>
      </div>
      <div class="wardrobe-panel">
        <div class="cat-tabs">
          <button class="cat-tab active" data-cat="hats">🧢 Chapéus</button>
          <button class="cat-tab" data-cat="tops">👕 Cima</button>
          <button class="cat-tab" data-cat="bottoms">🩳 Baixo</button>
          <button class="cat-tab" data-cat="shoes">👟 Calçados</button>
          <button class="cat-tab" data-cat="acc">🕶️ Acessórios</button>
        </div>
        <div class="items-grid" id="items-grid"></div>
        <button class="btn-ok" id="btn-create-avatar" style="padding:10px; font-size:18px;">CRIAR AVATAR 🌟</button>
      </div>
    </div>
  </div>

  <!-- TRANSIÇÕES -->
  <div id="cloud-overlay"></div>
  <div id="iris-overlay"></div>

  <script>
    // ==========================================
    // ESTADO GLOBAL DO JOGADOR E CONFIGURAÇÕES
    // ==========================================
    const GameState = {
      quality: 'HIGH',
      sound: true,
      playerName: 'Isis',
      gender: 'F', // 'F' (biquíni inicial) ou 'M' (sunguinha inicial)
      skinColor: '#FFCCAA',
      hairColor: '#3E2723',
      photoLoaded: false,
      equipped: {
        hats: -1,
        tops: -1,    // -1 = roupa de banho padrão (biquíni / sunga)
        bottoms: -1,
        shoes: -1,
        acc: -1
      }
    };

    // Paleta de 10 cores vibrantes para os 10 itens de cada categoria
    const ITEM_COLORS = [
      '#FF5252', '#FF4081', '#AB47BC', '#536DFE', '#29B6F6',
      '#26A69A', '#66BB6A', '#FFEE58', '#FFA726', '#8D6E63'
    ];

    // Catálogo de 10 opções por categoria (adaptado para Menino e Menina)
    function getCatalog(gender) {
      const isF = gender === 'F';
      return {
        hats: [
          'Boné', 'Chapéu Sol', 'Gorro', 'Coroa', 'Tiara',
          'Cartola', 'Boina', 'Chapéu Praia', 'Viseira', 'Capuz'
        ],
        tops: isF ? [
          'Camiseta', 'Regatinha', 'Manga Longa', 'Blusinha', 'Cropped',
          'Jaquetinha', 'Moletom', 'Bata', 'Colete', 'Cardigã'
        ] : [
          'Camiseta', 'Regata', 'Manga Longa', 'Polo', 'Camisa',
          'Jaqueta', 'Moletom', 'Suéter', 'Colete', 'Casaco'
        ],
        bottoms: isF ? [
          'Shortinho', 'Saia', 'Vestido', 'Calça Jeans', 'Legging',
          'Jardineira', 'Vestido Festa', 'Saia Rodada', 'Bermuda', 'Calça Moletom'
        ] : [
          'Shortinho', 'Bermuda', 'Calça Jeans', 'Calça Cargo', 'Calça Moletom',
          'Jardineira', 'Bermuda Praia', 'Short Esporte', 'Calça Social', 'Bermuda Jeans'
        ],
        shoes: [
          'Chinelo', 'Sandália', 'Tênis', 'Botinha', 'Bota Chuva',
          'Sapatilha', 'Coturno', 'Papete', 'Tênis Led', 'Pantufa'
        ],
        acc: [
          'Óculos Sol', 'Óculos Grau', 'Relógio', 'Pulseira', 'Brinco',
          'Colar', 'Laço / Gravata', 'Mochilinha', 'Bracelete', 'Óculos Estrela'
        ]
      };
    }

    // ==========================================
    // DESENHO DO BONEQUINHO ESTILO ROBLOX (2D)
    // ==========================================
    function drawRobloxAvatar(ctx, w, h) {
      ctx.clearRect(0, 0, w, h);
      const cx = w / 2;
      const eq = GameState.equipped;
      const isF = GameState.gender === 'F';

      // Sombra no chão
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.beginPath();
      ctx.ellipse(cx, h - 14, 34, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // Pernas (Blocos Roblox)
      ctx.fillStyle = GameState.skinColor;
      ctx.fillRect(cx - 22, 118, 19, 48);
      ctx.fillRect(cx + 3, 118, 19, 48);

      // Roupa de banho padrão caso sem parte de baixo
      if (eq.bottoms === -1) {
        ctx.fillStyle = isF ? '#FF4081' : '#1E88E5';
        ctx.fillRect(cx - 23, 115, 46, 16);
      } else {
        const bColor = ITEM_COLORS[eq.bottoms];
        const bName = getCatalog(GameState.gender).bottoms[eq.bottoms];
        ctx.fillStyle = bColor;
        if (bName.includes('Vestido') || bName.includes('Saia')) {
          ctx.beginPath();
          ctx.moveTo(cx - 24, 112);
          ctx.lineTo(cx + 24, 112);
          ctx.lineTo(cx + 32, 148);
          ctx.lineTo(cx - 32, 148);
          ctx.closePath();
          ctx.fill();
        } else if (bName.includes('Calça') || bName.includes('Legging') || bName.includes('Jardineira')) {
          ctx.fillRect(cx - 23, 115, 20, 45);
          ctx.fillRect(cx + 3, 115, 20, 45);
          ctx.fillRect(cx - 23, 112, 46, 10);
        } else {
          // Shorts / Bermudas
          ctx.fillRect(cx - 23, 115, 20, 24);
          ctx.fillRect(cx + 3, 115, 20, 24);
          ctx.fillRect(cx - 23, 112, 46, 8);
        }
      }

      // Calçados
      if (eq.shoes !== -1) {
        const sColor = ITEM_COLORS[eq.shoes];
        const sName = getCatalog(GameState.gender).shoes[eq.shoes];
        ctx.fillStyle = sColor;
        const shoeH = sName.includes('Bota') || sName.includes('Coturno') ? 20 : 10;
        ctx.fillRect(cx - 24, 166 - shoeH, 22, shoeH);
        ctx.fillRect(cx + 2, 166 - shoeH, 22, shoeH);
      }

      // Braços (Blocos Roblox)
      ctx.fillStyle = GameState.skinColor;
      ctx.fillRect(cx - 38, 68, 14, 46);
      ctx.fillRect(cx + 24, 68, 14, 46);

      // Tronco (Bloco Roblox)
      ctx.fillStyle = GameState.skinColor;
      ctx.fillRect(cx - 23, 66, 46, 50);

      // Parte de cima (ou biquíni para menina se -1)
      if (eq.tops === -1) {
        if (isF) {
          ctx.fillStyle = '#FF4081';
          ctx.fillRect(cx - 23, 78, 46, 16);
        }
      } else {
        const tColor = ITEM_COLORS[eq.tops];
        const tName = getCatalog(GameState.gender).tops[eq.tops];
        ctx.fillStyle = tColor;
        ctx.fillRect(cx - 24, 66, 48, 50);
        if (tName.includes('Manga Longa') || tName.includes('Jaqueta') || tName.includes('Moletom') || tName.includes('Casaco')) {
          ctx.fillRect(cx - 39, 68, 15, 42);
          ctx.fillRect(cx + 24, 68, 15, 42);
        } else if (!tName.includes('Regata') && !tName.includes('Cropped')) {
          ctx.fillRect(cx - 39, 68, 15, 22);
          ctx.fillRect(cx + 24, 68, 15, 22);
        }
      }

      // Cabeça (Bloco arredondado estilo Roblox)
      ctx.fillStyle = GameState.skinColor;
      ctx.beginPath();
      ctx.roundRect(cx - 22, 22, 44, 42, 10);
      ctx.fill();

      // Cabelo personalizado pela foto
      ctx.fillStyle = GameState.hairColor;
      ctx.beginPath();
      ctx.roundRect(cx - 24, 16, 48, 16, 8);
      ctx.fill();
      if (isF) {
        // Maria-chiquinha / cabelo longo lateral
        ctx.fillRect(cx - 27, 24, 8, 32);
        ctx.fillRect(cx + 19, 24, 8, 32);
      }

      // Olhinhos e sorriso
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(cx - 9, 42, 3.5, 0, Math.PI * 2);
      ctx.arc(cx + 9, 42, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(cx, 48, 7, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();

      // Acessórios (Óculos, Relógio, Pulseira, Brinco)
      if (eq.acc !== -1) {
        const aColor = ITEM_COLORS[eq.acc];
        const aName = getCatalog(GameState.gender).acc[eq.acc];
        ctx.fillStyle = aColor;
        ctx.strokeStyle = aColor;
        if (aName.includes('Óculos')) {
          ctx.lineWidth = 3;
          ctx.strokeRect(cx - 17, 36, 14, 10);
          ctx.strokeRect(cx + 3, 36, 14, 10);
          ctx.beginPath(); ctx.moveTo(cx - 3, 41); ctx.lineTo(cx + 3, 41); ctx.stroke();
        } else if (aName.includes('Relógio') || aName.includes('Pulseira') || aName.includes('Bracelete')) {
          ctx.fillRect(cx - 39, 102, 16, 7);
          ctx.fillRect(cx + 23, 102, 16, 7);
        } else if (aName.includes('Brinco')) {
          ctx.beginPath();
          ctx.arc(cx - 24, 48, 4, 0, Math.PI * 2);
          ctx.arc(cx + 24, 48, 4, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Colar / Laço
          ctx.fillRect(cx - 12, 65, 24, 6);
        }
      }

      // Chapéus
      if (eq.hats !== -1) {
        const hColor = ITEM_COLORS[eq.hats];
        ctx.fillStyle = hColor;
        ctx.beginPath();
        ctx.roundRect(cx - 26, 8, 52, 16, 6);
        ctx.fill();
        ctx.fillRect(cx - 32, 20, 64, 5);
      }
    }

    // Atualiza o canvas do guarda-roupa
    function refreshWardrobeCanvas() {
      const c = document.getElementById('avatar-canvas');
      if (c) drawRobloxAvatar(c.getContext('2d'), c.width, c.height);
    }

    // Gera uma textura no Phaser a partir do avatar customizado
    function generateAvatarTexture(scene) {
      const c = document.createElement('canvas');
      c.width = 140; c.height = 190;
      drawRobloxAvatar(c.getContext('2d'), 140, 190);
      if (scene.textures.exists('playerAvatar')) {
        scene.textures.remove('playerAvatar');
      }
      scene.textures.addCanvas('playerAvatar', c);
    }

    // ==========================================
    // TRANSIÇÕES E EVENTOS DE INTERFACE HTML
    // ==========================================
    function playCloudTransition(callback) {
      const overlay = document.getElementById('cloud-overlay');
      overlay.innerHTML = '';
      overlay.style.display = 'block';
      const puffs = [];
      for (let i = 0; i < 14; i++) {
        const p = document.createElement('div');
        p.className = 'cloud-puff';
        const size = 180 + Math.random() * 180;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.top = (Math.random() * 100 - 15) + 'vh';
        const fromLeft = i % 2 === 0;
        p.style.left = fromLeft ? '-250px' : '105vw';
        overlay.appendChild(p);
        puffs.push({ el: p, targetX: (i / 14) * 100 - 10, fromLeft });
      }
      requestAnimationFrame(() => {
        puffs.forEach(p => {
          const dist = p.fromLeft ? (p.targetX + 35) + 'vw' : (-105 + p.targetX) + 'vw';
          p.el.style.transform = `translateX(${dist})`;
        });
      });
      setTimeout(() => {
        if (callback) callback();
        puffs.forEach(p => {
          p.el.style.transform = 'translateX(0px)';
        });
        setTimeout(() => { overlay.style.display = 'none'; }, 900);
      }, 950);
    }

    function playIrisTransition(callback) {
      const iris = document.getElementById('iris-overlay');
      iris.style.display = 'block';
      iris.style.clipPath = 'circle(150% at 50% 50%)';
      // Usa máscara inversa com borda gigante para fechar o círculo
      iris.style.background = 'radial-gradient(circle, transparent 0%, #000 1%)';
      let r = 120;
      const closeTimer = setInterval(() => {
        r -= 6;
        iris.style.background = `radial-gradient(circle, transparent ${Math.max(0, r)}%, #111 ${Math.max(0, r + 1)}%)`;
        if (r <= 0) {
          clearInterval(closeTimer);
          if (callback) callback();
          setTimeout(() => {
            let rOpen = 0;
            const openTimer = setInterval(() => {
              rOpen += 6;
              iris.style.background = `radial-gradient(circle, transparent ${rOpen}%, #111 ${rOpen + 1}%)`;
              if (rOpen >= 130) {
                clearInterval(openTimer);
                iris.style.display = 'none';
              }
            }, 25);
          }, 250);
        }
      }, 25);
    }

    // Controles da Tela 1
    const qualities = ['HIGH', 'MED', 'LOW'];
    document.getElementById('btn-quality').onclick = (e) => {
      const idx = (qualities.indexOf(GameState.quality) + 1) % qualities.length;
      GameState.quality = qualities[idx];
      e.target.textContent = 'Quality: ' + GameState.quality;
    };
    document.getElementById('btn-sound').onclick = (e) => {
      GameState.sound = !GameState.sound;
      e.target.textContent = 'Sound: ' + (GameState.sound ? 'ON' : 'OFF');
    };

    // Controles da Tela 2 (Foto, Nome e Gênero)
    document.getElementById('btn-girl').onclick = () => {
      GameState.gender = 'F';
      document.getElementById('btn-girl').classList.add('active');
      document.getElementById('btn-boy').classList.remove('active');
    };
    document.getElementById('btn-boy').onclick = () => {
      GameState.gender = 'M';
      document.getElementById('btn-boy').classList.add('active');
      document.getElementById('btn-girl').classList.remove('active');
    };

    const fileInput = document.getElementById('file-input');
    const photoPreview = document.getElementById('photo-preview');

    document.getElementById('btn-load-photo').onclick = () => fileInput.click();
    document.getElementById('btn-remove-photo').onclick = () => {
      fileInput.value = '';
      photoPreview.innerHTML = '📸';
      GameState.photoLoaded = false;
      GameState.skinColor = '#FFCCAA';
      GameState.hairColor = '#3E2723';
    };

    fileInput.onchange = (e) => {
      if (e.target.files && e.target.files[0]) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            // Extrai a cor do cabelo (topo da imagem) e tom de pele (centro da imagem)
            const c = document.createElement('canvas');
            c.width = 40; c.height = 40;
            const ctx = c.getContext('2d');
            ctx.drawImage(img, 0, 0, 40, 40);
            const hairPx = ctx.getImageData(20, 6, 1, 1).data;
            const skinPx = ctx.getImageData(20, 22, 1, 1).data;
            GameState.hairColor = `rgb(${hairPx[0]}, ${hairPx[1]}, ${hairPx[2]})`;
            GameState.skinColor = `rgb(${skinPx[0]}, ${skinPx[1]}, ${skinPx[2]})`;
            GameState.photoLoaded = true;
          };
          img.src = ev.target.result;
          photoPreview.innerHTML = `<img src="${ev.target.result}" alt="Foto">`;
        };
        reader.readAsDataURL(e.target.files[0]);
      }
    };

    // Controles da Tela 3 (Grade de 10 itens por aba)
    let activeCategory = 'hats';
    function renderWardrobeGrid() {
      const grid = document.getElementById('items-grid');
      grid.innerHTML = '';
      const items = getCatalog(GameState.gender)[activeCategory];
      items.forEach((name, idx) => {
        const slot = document.createElement('div');
        slot.className = 'item-slot' + (GameState.equipped[activeCategory] === idx ? ' selected' : '');
        slot.style.backgroundColor = ITEM_COLORS[idx] + '33';
        slot.style.borderColor = GameState.equipped[activeCategory] === idx ? '#FF4081' : ITEM_COLORS[idx];
        slot.innerHTML = `<div style="width:18px;height:18px;border-radius:50%;background:${ITEM_COLORS[idx]};margin-bottom:3px;border:2px solid #fff;"></div><span>${name}</span>`;
        slot.onclick = () => {
          // Se clicar no mesmo item, tira e volta pro biquíni/sunga
          GameState.equipped[activeCategory] = (GameState.equipped[activeCategory] === idx) ? -1 : idx;
          renderWardrobeGrid();
          refreshWardrobeCanvas();
        };
        grid.appendChild(slot);
      });
    }

    document.querySelectorAll('.cat-tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeCategory = tab.dataset.cat;
        renderWardrobeGrid();
      };
    });

    // ==========================================
    // CENAS DO PHASER 3
    // ==========================================
    class StartMenuScene extends Phaser.Scene {
      constructor() { super('StartMenuScene'); }

      create() {
        const w = this.scale.width;
        const h = this.scale.height;

        // Céu e Mar Azul estilo Star Island
        this.add.rectangle(w / 2, h / 2, w, h, 0x29B6F6);
        this.add.rectangle(w / 2, h * 0.65, w, h * 0.7, 0x0288D1);

        // Nuvens fofas no fundo
        this.clouds = [];
        for (let i = 0; i < 5; i++) {
          const c = this.add.ellipse(Phaser.Math.Between(50, w - 50), Phaser.Math.Between(50, h * 0.35), 95, 42, 0xFFFFFF, 0.9);
          c.speed = Phaser.Math.FloatBetween(0.2, 0.5);
          this.clouds.push(c);
        }

        const cx = w * 0.44;
        const cy = h * 0.58;

        // Base de areia da ilha infantil (formato de ilha normal, não estrela)
        this.add.ellipse(cx, cy + 25, 380, 210, 0xFFF59D);
        this.add.ellipse(cx, cy + 12, 350, 185, 0x66BB6A);

        // 6 Regiões ao redor da ilha (Datas Comemorativas)
        const regions = [
          { x: -115, y: 35, color: 0xFFD54F, label: '🎭 Carnaval' },
          { x: -55,  y: 62, color: 0xF48FB1, label: '🐰 Páscoa' },
          { x: 35,   y: 62, color: 0xFFB74D, label: '🔥 Festa Junina' },
          { x: 115,  y: 35, color: 0x81C784, label: '🌳 Primavera' },
          { x: 85,   y: -15, color: 0x4FC3F7, label: '🧸 Crianças' },
          { x: -85,  y: -15, color: 0xBA68C8, label: '🎃 Halloween' }
        ];
        regions.forEach(r => {
          this.add.ellipse(cx + r.x, cy + r.y, 92, 52, r.color);
          this.add.text(cx + r.x, cy + r.y, r.label, { fontSize: '11px', color: '#222', fontStyle: 'bold' }).setOrigin(0.5);
        });

        // 7ª Parte: Montanha de Natal no topo central da ilha
        this.add.triangle(cx, cy - 55, 0, 95, 160, 95, 80, 0, 0x8D6E63);
        this.add.triangle(cx, cy - 77, 32, 55, 128, 55, 80, 0, 0xFFFFFF); // Neve
        this.add.text(cx, cy - 55, '🎄 Natal', { fontSize: '13px', color: '#D32F2F', backgroundColor: '#FFF', padding: { x: 4, y: 2 } }).setOrigin(0.5);

        // Peixinhos pulando e caranguejo andando na borda da ilha
        this.fishes = [];
        for (let i = 0; i < 4; i++) {
          const f = this.add.ellipse(cx - 190 + i * 120, cy + 115 + (i % 2) * 20, 20, 10, 0xFF7043);
          f.dir = i % 2 === 0 ? 1 : -1;
          this.fishes.push(f);
        }
        this.crab = this.add.circle(cx - 40, cy + 92, 9, 0xE53935);
        this.tweens.add({ targets: this.crab, x: cx + 40, duration: 2200, yoyo: true, repeat: -1 });

        // Eventos dos botões HTML
        document.getElementById('btn-start-game').onclick = () => {
          playCloudTransition(() => {
            document.getElementById('start-hud').style.display = 'none';
            document.getElementById('profile-screen').style.display = 'flex';
          });
        };

        document.getElementById('btn-profile-ok').onclick = () => {
          const val = document.getElementById('player-name-input').value.trim();
          GameState.playerName = val || 'Isis';
          document.getElementById('avatar-name-label').textContent = GameState.playerName;
          playCloudTransition(() => {
            document.getElementById('profile-screen').style.display = 'none';
            document.getElementById('wardrobe-screen').style.display = 'flex';
            renderWardrobeGrid();
            refreshWardrobeCanvas();
          });
        };

        document.getElementById('btn-create-avatar').onclick = () => {
          playIrisTransition(() => {
            document.getElementById('wardrobe-screen').style.display = 'none';
            this.scene.start('IslandWorldScene');
          });
        };
      }

      update() {
        const w = this.scale.width;
        this.clouds.forEach(c => {
          c.x += c.speed;
          if (c.x > w + 60) c.x = -60;
        });
        this.fishes.forEach(f => {
          f.x += 0.6 * f.dir;
          if (f.x > w * 0.78) f.dir = -1;
          if (f.x < w * 0.12) f.dir = 1;
        });
      }
    }

    // ==========================================
    // CENA DA ILHA JOGÁVEL (3ª PESSOA / ROTAÇÃO)
    // ==========================================
    class IslandWorldScene extends Phaser.Scene {
      constructor() { super('IslandWorldScene'); }

      create() {
        const w = this.scale.width;
        const h = this.scale.height;

        // Gera textura com o bonequinho vestido pela criança
        generateAvatarTexture(this);

        // 7 Regiões em Ordem Cronológica do Calendário (3200px cada = 22400px volta completa)
        this.zones = [
          { name: '1. Carnaval (Fevereiro)', groundColor: 0xFFF176, decoColor: 0xFF4081, badge: '🎭' },
          { name: '2. Páscoa (Abril)', groundColor: 0xF8BBD0, decoColor: 0xAB47BC, badge: '🐰' },
          { name: '3. Festa Junina (Junho)', groundColor: 0xFFE082, decoColor: 0xFB8C00, badge: '🔥' },
          { name: '4. Primavera (Setembro)', groundColor: 0xA5D6A7, decoColor: 0x43A047, badge: '🌻' },
          { name: '5. Dia das Crianças (Outubro)', groundColor: 0x81D4FA, decoColor: 0x039BE5, badge: '🧸' },
          { name: '6. Halloween (Outubro)', groundColor: 0xCE93D8, decoColor: 0x5E35B1, badge: '🎃' },
          { name: '7. Montanha de Natal (Dezembro)', groundColor: 0xFFFFFF, decoColor: 0xE53935, badge: '🎄' }
        ];
        this.zoneWidth = 1400;
        this.totalIslandWidth = this.zones.length * this.zoneWidth;

        // Céu ao fundo e Montanha de Natal sempre visível ao fundo (Parallax)
        this.add.rectangle(w / 2, h / 2, w, h, 0x81D4FA).setScrollFactor(0);
        this.bgMountain = this.add.triangle(w / 2, h * 0.36, 0, 220, 380, 220, 190, 0, 0x78909C).setScrollFactor(0.05);
        this.bgSnow = this.add.triangle(w / 2, h * 0.25, 75, 120, 305, 120, 190, 0, 0xFFFFFF).setScrollFactor(0.05);

        // Mar ao redor na parte inferior com peixinhos e caranguejos
        this.seaY = h * 0.82;
        this.add.rectangle(w / 2, h * 0.91, w, h * 0.22, 0x0288D1).setScrollFactor(0);

        // Construção das 7 partes da ilha lado a lado (permite andar em X e em profundidade Y)
        this.zones.forEach((z, idx) => {
          const zx = idx * this.zoneWidth + this.zoneWidth / 2;
          // Faixa de areia da praia
          this.add.rectangle(zx, h * 0.78, this.zoneWidth, h * 0.10, 0xFFF59D);
          // Gramado / Piso temático da região (perspectiva 3ª pessoa ampla)
          this.add.rectangle(zx, h * 0.56, this.zoneWidth - 6, h * 0.38, z.groundColor);

          // Placa indicando a data comemorativa e espaços esquerda/direita para futuras atividades
          this.add.rectangle(zx, h * 0.40, 320, 44, z.decoColor).setStrokeStyle(3, 0xFFFFFF);
          this.add.text(zx, h * 0.40, `${z.badge} ${z.name}`, {
            fontSize: '18px', color: '#FFF', fontStyle: 'bold'
          }).setOrigin(0.5);

          // Marcadores visuais dos espaços da esquerda e direita da região (vazios por enquanto)
          this.add.ellipse(zx - 380, h * 0.56, 150, 75, z.decoColor, 0.28).setStrokeStyle(2, 0xFFFFFF);
          this.add.ellipse(zx + 380, h * 0.56, 150, 75, z.decoColor, 0.28).setStrokeStyle(2, 0xFFFFFF);

          // Caranguejo e peixinho na praia de cada zona
          const crab = this.add.text(zx - 150, h * 0.77, '🦀', { fontSize: '24px' });
          this.tweens.add({ targets: crab, x: zx + 150, duration: 3000, yoyo: true, repeat: -1 });
          const fish = this.add.text(zx, h * 0.88, '🐠', { fontSize: '22px' });
          this.tweens.add({ targets: fish, x: zx + 220, y: h * 0.85, duration: 2400, yoyo: true, repeat: -1 });
        });

        // Jogador posicionado no início da 1ª data comemorativa (Carnaval)
        this.playerGroundY = h * 0.58;
        this.jumpOffset = 0;
        this.jumpVel = 0;
        this.isJumping = false;

        this.playerShadow = this.add.ellipse(350, this.playerGroundY + 42, 46, 14, 0x000000, 0.25);
        this.player = this.add.image(350, this.playerGroundY, 'playerAvatar').setScale(0.55);
        this.playerLabel = this.add.text(350, this.playerGroundY - 62, GameState.playerName, {
          fontSize: '15px', color: '#FFF', backgroundColor: 'rgba(0,0,0,0.45)', padding: { x: 6, y: 2 }
        }).setOrigin(0.5);

        // Câmera em 3ª pessoa com FOV aberto acompanhando o personagem
        this.cameras.main.startFollow(this.player, true, 0.08, 0.08);
        this.cameras.main.setDeadzone(80, 40);

        // Banner fixo no topo mostrando em qual parte da ilha está
        this.zoneBanner = this.add.text(w / 2, 26, '🎭 1. Carnaval (Fevereiro)', {
          fontSize: '20px', color: '#FFF', backgroundColor: '#E91E63', padding: { x: 16, y: 8 }
        }).setOrigin(0.5).setScrollFactor(0);

        // Controles na Tela: Direcional Esquerdo (Frente, Trás, Cima, Baixo) + Botões A e B na Direita
        this.inputState = { left: false, right: false, up: false, down: false };
        this.createTouchControls(w, h);
        this.cursors = this.input.keyboard.createCursorKeys();
      }

      createTouchControls(w, h) {
        const ui = this.add.container(0, 0).setScrollFactor(0).setDepth(100);

        // Base do Direcional (Esquerda)
        const baseX = 115;
        const baseY = h - 105;
        ui.add(this.add.circle(baseX, baseY, 72, 0x000000, 0.28).setStrokeStyle(3, 0xFFFFFF, 0.6));

        const makeDirBtn = (dx, dy, label, dirKey) => {
          const btn = this.add.circle(baseX + dx, baseY + dy, 26, 0xFFFFFF, 0.45).setInteractive();
          const txt = this.add.text(baseX + dx, baseY + dy, label, { fontSize: '20px', color: '#111', fontStyle: 'bold' }).setOrigin(0.5);
          btn.on('pointerdown', () => { this.inputState[dirKey] = true; btn.setFillStyle(0xFFEB3B, 0.85); });
          btn.on('pointerup', () => { this.inputState[dirKey] = false; btn.setFillStyle(0xFFFFFF, 0.45); });
          btn.on('pointerout', () => { this.inputState[dirKey] = false; btn.setFillStyle(0xFFFFFF, 0.45); });
          ui.add([btn, txt]);
        };

        makeDirBtn(0, -44, '▲', 'up');
        makeDirBtn(0, 44, '▼', 'down');
        makeDirBtn(-44, 0, '◀', 'left');
        makeDirBtn(44, 0, '▶', 'right');

        // Botão A (Escolher / Pegar) e Botão B (Pular) na Direita
        const btnAX = w - 165;
        const btnAY = h - 75;
        const btnA = this.add.circle(btnAX, btnAY, 36, 0x4CAF50, 0.85).setStrokeStyle(4, 0xFFFFFF).setInteractive();
        const txtA = this.add.text(btnAX, btnAY, 'A', { fontSize: '24px', color: '#FFF', fontStyle: 'bold' }).setOrigin(0.5);
        const subA = this.add.text(btnAX, btnAY + 46, 'Pegar', { fontSize: '12px', color: '#FFF', fontStyle: 'bold' }).setOrigin(0.5);

        btnA.on('pointerdown', () => {
          btnA.setScale(0.9);
          this.tweens.add({ targets: this.player, scaleX: 0.65, scaleY: 0.48, duration: 100, yoyo: true });
        });
        btnA.on('pointerup', () => btnA.setScale(1));

        const btnBX = w - 75;
        const btnBY = h - 125;
        const btnB = this.add.circle(btnBX, btnBY, 36, 0xFF4081, 0.85).setStrokeStyle(4, 0xFFFFFF).setInteractive();
        const txtB = this.add.text(btnBX, btnBY, 'B', { fontSize: '24px', color: '#FFF', fontStyle: 'bold' }).setOrigin(0.5);
        const subB = this.add.text(btnBX, btnBY + 46, 'Pular', { fontSize: '12px', color: '#FFF', fontStyle: 'bold' }).setOrigin(0.5);

        btnB.on('pointerdown', () => {
          btnB.setScale(0.9);
          if (!this.isJumping) {
            this.isJumping = true;
            this.jumpVel = -11;
          }
        });
        btnB.on('pointerup', () => btnB.setScale(1));

        ui.add([btnA, txtA, subA, btnB, txtB, subB]);
      }

      update() {
        const h = this.scale.height;
        const speedX = 5.5;
        const speedY = 3.5;

        // Movimentação Frente / Trás (gira pela ilha ciclicamente em ordem cronológica)
        if (this.inputState.right || this.cursors.right.isDown) {
          this.player.x += speedX;
          this.player.flipX = false;
        } else if (this.inputState.left || this.cursors.left.isDown) {
          this.player.x -= speedX;
          this.player.flipX = true;
        }

        // Loop circular da ilha (quando passa da 7ª zona volta para a 1ª e vice-versa)
        if (this.player.x >= this.totalIslandWidth) this.player.x -= this.totalIslandWidth;
        if (this.player.x < 0) this.player.x += this.totalIslandWidth;

        // Movimentação Cima / Baixo dentro da faixa da ilha (profundidade 2.5D)
        const minY = h * 0.44;
        const maxY = h * 0.74;
        if (this.inputState.up || this.cursors.up.isDown) {
          this.playerGroundY = Math.max(minY, this.playerGroundY - speedY);
        } else if (this.inputState.down || this.cursors.down.isDown) {
          this.playerGroundY = Math.min(maxY, this.playerGroundY + speedY);
        }

        // Física simples de Pulo no eixo vertical (Botão B)
        if (this.isJumping) {
          this.jumpOffset += this.jumpVel;
          this.jumpVel += 0.65;
          if (this.jumpOffset >= 0) {
            this.jumpOffset = 0;
            this.jumpVel = 0;
            this.isJumping = false;
          }
        }

        // Escala de perspectiva (um pouquinho menor quando vai para o fundo da ilha, maior quando vem pra frente)
        const depthRatio = (this.playerGroundY - minY) / (maxY - minY);
        const perspectiveScale = 0.48 + depthRatio * 0.16;
        this.player.setScale(perspectiveScale);

        this.player.y = this.playerGroundY + this.jumpOffset;
        this.playerShadow.x = this.player.x;
        this.playerShadow.y = this.playerGroundY + 42 * (perspectiveScale / 0.55);
        this.playerLabel.x = this.player.x;
        this.playerLabel.y = this.player.y - 60;

        // Atualiza o indicador da região atual conforme a ilha gira
        const currentZoneIdx = Math.floor(this.player.x / this.zoneWidth) % this.zones.length;
        const z = this.zones[currentZoneIdx];
        if (z) {
          this.zoneBanner.setText(`${z.badge} ${z.name}`);
        }
      }
    }

    // Inicialização do Phaser
    const phaserConfig = {
      type: Phaser.AUTO,
      parent: 'game-container',
      width: window.innerWidth,
      height: window.innerHeight,
      backgroundColor: '#29B6F6',
      scene: [StartMenuScene, IslandWorldScene]
    };

    const game = new Phaser.Game(phaserConfig);

    window.addEventListener('resize', () => {
      game.scale.resize(window.innerWidth, window.innerHeight);
    });
  </script>
