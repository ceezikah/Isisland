<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IsIsland - A Ilha da Ísis</title>
<!-- Phaser 3 CDN estável e otimizado para mobile -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
<style>
* {
box-sizing: border-box;
user-select: none;
-webkit-user-select: none;
-webkit-touch-callout: none;
}
body {
margin: 0;
padding: 0;
background: #050b14;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
overflow: hidden;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
#game-container {
width: 100%;
max-width: 480px;
height: 100%;
max-height: 854px;
box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
position: relative;
background: #87CEEB;
}
</style>
</head>
<body>
<div id="game-container"></div>
<script>
// Configuração principal do Phaser otimizada para iOS 12 e Safari mobile
const config = {
type: Phaser.AUTO,
parent: 'game-container',
width: 480,
height: 854,
backgroundColor: '#70d6ff',
scale: {
mode: Phaser.Scale.FIT,
autoCenter: Phaser.Scale.CENTER_BOTH
},
scene: [BootScene, MenuScene, AvatarCustomizerScene, IslandWorldScene, KitchenMinigameScene]
};
// Estado Global do Jogador e Jogo
let gameData = {
quality: 'HIGH',
soundEnabled: true,
avatar: {
name: 'Ísis',
gender: 'menina', // 'menina' ou 'menino'
photo: null,
hat: 'Coroa Ouro',
top: 'Camiseta Azul',
bottom: 'Tênis Rosa'
}
};
// -------------------------------------------------------------------------
// 1. BOOT SCENE: Pré-carregamento de texturas procedurais e ativos visuais
// -------------------------------------------------------------------------
class BootScene extends Phaser.Scene {
constructor() {
super('BootScene');
}
preload() {
// Criar texturas gráficas rica e detalhadas programaticamente
let g = this.make.graphics({ x: 0, y: 0, add: false });
// Céu Gradiente Vibrante
g.fillStyle(0x4cc9f0, 1);
g.fillRect(0, 0, 480, 854);
g.generateTexture('sky_bg', 480, 854);
g.clear();
// Ilha Principal Estilo Isométrico Colorido (Cooking Island Style)
g.fillStyle(0x38b000, 1);
g.fillEllipse(240, 450, 400, 260);
g.fillStyle(0x70e000, 1);
g.fillEllipse(240, 440, 360, 220);
g.fillStyle(0xffe6a7, 1); // Areia da praia
g.fillEllipse(240, 480, 420, 120);
g.generateTexture('isometric_island', 480, 800);
g.clear();
// Botão Primário Arredondado Estilizado
g.fillStyle(0xf72585, 1);
g.fillRoundedRect(0, 0, 260, 65, 20);
g.generateTexture('btn_main', 260, 65);
g.clear();
// Botão Secundário
g.fillStyle(0x4361ee, 1);
g.fillRoundedRect(0, 0, 180, 50, 15);
g.generateTexture('btn_sec', 180, 50);
g.clear();
}
create() {
this.scene.start('MenuScene');
}
}
// -------------------------------------------------------------------------
// 2. MENU SCENE: Tela Inicial com Animações, Áudio e Navegação
// -------------------------------------------------------------------------
class MenuScene extends Phaser.Scene {
constructor() {
super('MenuScene');
}
create() {
this.add.image(240, 427, 'sky_bg');
// Nuvens decorativas flutuantes
let cloud1 = this.add.circle(90, 120, 45, 0xffffff, 0.9);
let cloud2 = this.add.circle(390, 180, 65, 0xffffff, 0.9);
this.tweens.add({
targets: [cloud1, cloud2],
x: '+= 35',
duration: 3500,
yoyo: true,
repeat: -1,
ease: 'Sine.easeInOut'
});
// Título Estilizado "ISLAND" com Efeito de Sombra 3D
this.add.text(240, 142, 'ISLAND', { fontSize: '72px', fontStyle: 'bold', color: '#7209b7' }).setOrigin(0.5);
let title = this.add.text(240, 138, 'ISLAND', { fontSize: '72px', fontStyle: 'bold', color: '#ffb703' }).setOrigin(0.5);
this.tweens.add({
targets: title,
scale: 1.04,
duration: 1000,
yoyo: true,
repeat: -1
});
// Ilha Central com Placas de Eventos Sazonais
this.add.image(240, 430, 'isometric_island').setScale(0.95);
this.createSeasonalBadge(240, 330, '👑 Reino da Ísis', 0xf72585);
this.createSeasonalBadge(130, 460, '🎄 Natal', 0x06d6a0);
this.createSeasonalBadge(350, 460, '🐰 Páscoa', 0xff0054);
this.createSeasonalBadge(240, 560, '🎉 Carnaval', 0xffb703);
// Botão Start Game
let btnStart = this.add.image(240, 680, 'btn_main').setInteractive();
this.add.text(240, 680, 'START GAME', { fontSize: '26px', fontStyle: 'bold', color: '#ffffff' }).setOrigin(0.5);
btnStart.on('pointerdown', () => {
this.playClickSound();
this.scene.start('AvatarCustomizerScene');
});
// Controles de Configuração (Qualidade e Som)
let btnQuality = this.add.image(140, 770, 'btn_sec').setInteractive();
let txtQuality = this.add.text(140, 770, ⁠Quality: ${gameData.quality}⁠, { fontSize: '16px', fontStyle: 'bold', color: '#fff' }).setOrigin(0.5);
btnQuality.on('pointerdown', () => {
this.playClickSound();
gameData.quality = gameData.quality === 'HIGH' ? 'LOW' : 'HIGH';
txtQuality.setText(⁠Quality: ${gameData.quality}⁠);
});
let btnSound = this.add.image(340, 770, 'btn_sec').setInteractive();
let txtSound = this.add.text(340, 770, ⁠Sound: ${gameData.soundEnabled ? 'ON' : 'OFF'}⁠, { fontSize: '16px', fontStyle: 'bold', color: '#fff' }).setOrigin(0.5);
btnSound.on('pointerdown', () => {
gameData.soundEnabled = !gameData.soundEnabled;
txtSound.setText(⁠Sound: ${gameData.soundEnabled ? 'ON' : 'OFF'}⁠);
if (gameData.soundEnabled) this.playClickSound();
});
}
createSeasonalBadge(x, y, label, color) {
let badge = this.add.rectangle(x, y, 120, 42, color, 0.95).setInteractive();
badge.setStrokeStyle(3, 0xffffff);
this.add.text(x, y, label, { fontSize: '15px', fontStyle: 'bold', color: '#ffffff' }).setOrigin(0.5);
this.tweens.add({
targets: badge,
y: y - 5,
duration: 900,
yoyo: true,
repeat: -1
});
}
playClickSound() {
if (!gameData.soundEnabled) return;
try {
let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let osc = audioCtx.createOscillator();
let gain = audioCtx.createGain();
osc.type = 'triangle';
osc.frequency.setValueAtTime(440, audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
osc.connect(gain);
gain.connect(audioCtx.destination);
osc.start();
osc.stop(audioCtx.currentTime + 0.15);
} catch (e) {}
}
}
// -------------------------------------------------------------------------
// 3. AVATAR CUSTOMIZER SCENE: Customização, Gênero e Upload de Foto iOS 12
// -------------------------------------------------------------------------
class AvatarCustomizerScene extends Phaser.Scene {
constructor() {
super('AvatarCustomizerScene');
}
create() {
this.add.rectangle(240, 427, 480, 854, 0xffe5ec);
this.add.text(240, 50, 'Crie o seu Avatar!', { fontSize: '28px', fontStyle: 'bold', color: '#d90429' }).setOrigin(0.5);
// Alternador de Gênero (Menina / Menino) corrigido e responsivo
let btnMenina = this.add.rectangle(130, 115, 120, 45, gameData.avatar.gender === 'menina' ? 0xffb703 : 0xffffff).setInteractive();
btnMenina.setStrokeStyle(3, 0xd90429);
let txtMenina = this.add.text(130, 115, '👧 Menina', { fontSize: '16px', fontStyle: 'bold', color: '#000' }).setOrigin(0.5);
let btnMenino = this.add.rectangle(350, 115, 120, 45, gameData.avatar.gender === 'menino' ? 0xffb703 : 0xffffff).setInteractive();
btnMenino.setStrokeStyle(3, 0x1d3557);
let txtMenino = this.add.text(350, 115, '👦 Menino', { fontSize: '16px', fontStyle: 'bold', color: '#000' }).setOrigin(0.5);
btnMenina.on('pointerdown', () => {
gameData.avatar.gender = 'menina';
btnMenina.setFillStyle(0xffb703);
btnMenino.setFillStyle(0xffffff);
});
btnMenino.on('pointerdown', () => {
gameData.avatar.gender = 'menino';
btnMenino.setFillStyle(0xffb703);
btnMenina.setFillStyle(0xffffff);
});
// Caixa de Visualização do Avatar
let avatarBox = this.add.rectangle(240, 260, 200, 210, 0xffffff).setInteractive();
avatarBox.setStrokeStyle(4, 0xffb703);
let avatarPlaceholder = this.add.text(240, 260, 'Visual do Avatar\n(Toque para carregar foto)', { fontSize: '14px', align: 'center', color: '#666' }).setOrigin(0.5);
// Botões de Carregar e Remover Foto
let btnLoadPhoto = this.add.rectangle(150, 395, 150, 45, 0x3a86ff).setInteractive();
this.add.text(150, 395, 'Carregar Foto', { fontSize: '15px', fontStyle: 'bold', color: '#fff' }).setOrigin(0.5);
let btnRemovePhoto = this.add.rectangle(330, 395, 110, 45, 0xef233c).setInteractive();
this.add.text(330, 395, 'Remover', { fontSize: '15px', fontStyle: 'bold', color: '#fff' }).setOrigin(0.5);
// Input de Arquivo Nativo Otimizado para Safari / iOS 12
let fileInput = document.createElement('input');
fileInput.type = 'file';
fileInput.accept = 'image/*';
fileInput.style.display = 'none';
document.body.appendChild(fileInput);
fileInput.onchange = (e) => {
let file = e.target.files[0];
if (file) {
let reader = new FileReader();
reader.onload = (event) => {
let textureKey = 'uploaded_avatar_img';
if (this.textures.exists(textureKey)) {
this.textures.remove(textureKey);
}
this.load.image(textureKey, event.target.result);
this.load.once('complete', () => {
avatarPlaceholder.setVisible(false);
if (this.userAvatarSprite) this.userAvatarSprite.destroy();
this.userAvatarSprite = this.add.image(240, 260, textureKey).setDisplaySize(160, 175);
gameData.avatar.photo = textureKey;
});
this.load.start();
};
reader.readAsDataURL(file);
}
};
btnLoadPhoto.on('pointerdown', () => {
fileInput.click();
});
btnRemovePhoto.on('pointerdown', () => {
if (this.userAvatarSprite) {
this.userAvatarSprite.destroy();
this.userAvatarSprite = null;
}
avatarPlaceholder.setVisible(true);
gameData.avatar.photo = null;
fileInput.value = '';
});
// Campo de Nome Interativo
let nameBox = this.add.rectangle(240, 470, 320, 50, 0xffffff).setInteractive();
nameBox.setStrokeStyle(2, 0xadb5bd);
let nameText = this.add.text(240, 470, gameData.avatar.name, { fontSize: '20px', fontStyle: 'bold', color: '#000' }).setOrigin(0.5);
nameBox.on('pointerdown', () => {
let typedName = prompt("Digite o nome do seu avatar:", gameData.avatar.name);
if (typedName !== null && typedName.trim() !== '') {
gameData.avatar.name = typedName.trim();
nameText.setText(gameData.avatar.name);
}
});
// Seção de Roupas & Acessórios Estilizados
this.add.text(240, 530, 'Escolha o Estilo e Roupas', { fontSize: '18px', fontStyle: 'bold', color: '#333' }).setOrigin(0.5);
let hatOpt = this.createOptionSelector(100, 580, 'Chapéu: Coroa', () => {
gameData.avatar.hat = gameData.avatar.hat === 'Coroa Ouro' ? 'Laço Rosa' : 'Coroa Ouro';
hatOpt.text.setText(gameData.avatar.hat);
});
let topOpt = this.createOptionSelector(240, 580, 'Cima: Camiseta', () => {
gameData.avatar.top = gameData.avatar.top === 'Camiseta Azul' ? 'Cropped Vermelho' : 'Camiseta Azul';
topOpt.text.setText(gameData.avatar.top);
});
let botOpt = this.createOptionSelector(380, 580, 'Baixo: Tênis', () => {
gameData.avatar.bottom = gameData.avatar.bottom === 'Tênis Rosa' ? 'Coturno' : 'Tênis Rosa';
botOpt.text.setText(gameData.avatar.bottom);
});
// Botão OK para Entrar no Jogo
let btnOk = this.add.image(240, 765, 'btn_main').setInteractive();
this.add.text(240, 765, 'OK - ENTRAR NA ILHA', { fontSize: '20px', fontStyle: 'bold', color: '#ffffff' }).setOrigin(0.5);
btnOk.on('pointerdown', () => {
if (fileInput.parentNode) {
fileInput.parentNode.removeChild(fileInput);
}
this.scene.start('IslandWorldScene');
});
}
createOptionSelector(x, y, label, callback) {
let rect = this.add.rectangle(x, y, 125, 40, 0xffffff).setInteractive();
rect.setStrokeStyle(2, 0xffb703);
let txt = this.add.text(x, y, label, { fontSize: '13px', fontStyle: 'bold', color: '#000' }).setOrigin(0.5);
rect.on('pointerdown', callback);
return { rect, text: txt };
}
}
// -------------------------------------------------------------------------
// 4. ISLAND WORLD SCENE: O Mundo Isométrico da Ilha e Locais Sazonais
// -------------------------------------------------------------------------
class IslandWorldScene extends Phaser.Scene {
constructor() {
super('IslandWorldScene');
}
create() {
this.add.image(240, 427, 'sky_bg');
// Ilha principal detalhada
this.add.image(240, 440, 'isometric_island').setScale(1.1);
this.add.text(240, 55, ⁠Bem-vindo(a), ${gameData.avatar.name}!⁠, { fontSize: '24px', fontStyle: 'bold', color: '#ffffff', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5);
// Pontos interativos na Ilha (Restaurantes, Eventos e Mini-jogos)
this.createWorldNode(130, 310, '🍔 Burger Island', 0xf72585);
this.createWorldNode(350, 310, '🍕 Pizza Festival', 0x7209b7);
this.createWorldNode(240, 460, '🍦 Doce Ilha', 0x3a0ca3);
this.createWorldNode(140, 600, '🎄 Natal na Ilha', 0x06d6a0);
this.createWorldNode(340, 600, '🐰 Páscoa', 0xff0054);
// Botão para voltar ao Menu
let btnBack = this.add.rectangle(75, 785, 110, 40, 0x222222, 0.85).setInteractive();
this.add.text(75, 785, '⬅ Menu', { fontSize: '15px', color: '#fff' }).setOrigin(0.5);
btnBack.on('pointerdown', () => {
this.scene.start('MenuScene');
});
}
createWorldNode(x, y, title, color) {
let circle = this.add.circle(x, y, 42, color).setInteractive();
circle.setStrokeStyle(4, 0xffffff);
let label = this.add.text(x, y + 52, title, { fontSize: '13px', fontStyle: 'bold', color: '#ffffff', stroke: '#000000', strokeThickness: 3, align: 'center' }).setOrigin(0.5);
circle.on('pointerdown', () => {
this.tweens.add({
targets: circle,
scale: 1.25,
duration: 120,
yoyo: true
});
this.scene.start('KitchenMinigameScene', { location: title });
});
}
}
// -------------------------------------------------------------------------
// 5. KITCHEN MINIGAME SCENE: O Coração do Jogo (Estilo Cooking Island)
// -------------------------------------------------------------------------
class KitchenMinigameScene extends Phaser.Scene {
constructor() {
super('KitchenMinigameScene');
}
init(data) {
this.currentLocation = data.location || 'Burger Island';
}
create() {
this.add.rectangle(240, 427, 480, 854, 0xf8f9fa);
// Cabeçalho do Local Atual
this.add.rectangle(240, 45, 480, 70, 0x1d3557);
this.add.text(240, 40, this.currentLocation, { fontSize: '24px', fontStyle: 'bold', color: '#ffb703' }).setOrigin(0.5);
// Balcão de Cozinha / Pedidos
this.add.rectangle(240, 220, 420, 200, 0xffffff).setStrokeStyle(3, 0xdee2e6);
this.add.text(240, 140, 'Clientes aguardando pedido:', { fontSize: '16px', fontStyle: 'bold', color: '#495057' }).setOrigin(0.5);
// Exemplo de prato/pedido em preparo
let orderCard = this.add.rectangle(240, 230, 280, 90, 0xffe8d6).setInteractive();
orderCard.setStrokeStyle(2, 0xfcb19d);
this.add.text(240, 230, '🍔 Hambúrguer Especial\nToque para preparar!', { fontSize: '16px', fontStyle: 'bold', color: '#bc6c25', align: 'center' }).setOrigin(0.5);
let score = 0;
let scoreText = this.add.text(240, 320, ⁠Pontos: ${score}⁠, { fontSize: '20px', fontStyle: 'bold', color: '#38b000' }).setOrigin(0.5);
orderCard.on('pointerdown', () => {
score += 10;
scoreText.setText(⁠Pontos: ${score}⁠);
this.tweens.add({
targets: orderCard,
scale: 1.05,
duration: 80,
yoyo: true
});
});
// Área de Aparelhos e Ferramentas da Cozinha
this.add.text(240, 420, 'Equipamentos da Cozinha', { fontSize: '18px', fontStyle: 'bold', color: '#333' }).setOrigin(0.5);
let stove = this.createAppliance(140, 520, '🔥 Fogão', 0xdda15e);
let blender = this.createAppliance(340, 520, '🥤 Liquidificador', 0x606c38);
// Botão Sair / Voltar para a Ilha
let btnReturn = this.add.image(240, 770, 'btn_main').setInteractive();
this.add.text(240, 770, 'VOLTAR PARA A ILHA', { fontSize: '18px', fontStyle: 'bold', color: '#ffffff' }).setOrigin(0.5);
btnReturn.on('pointerdown', () => {
this.scene.start('IslandWorldScene');
});
}
createAppliance(x, y, label, color) {
let box = this.add.rectangle(x, y, 160, 110, color).setInteractive();
box.setStrokeStyle(3, 0xffffff);
this.add.text(x, y, label, { fontSize: '16px', fontStyle: 'bold', color: '#fff' }).setOrigin(0.5);
box.on('pointerdown', () => {
this.tweens.add({
targets: box,
angle: 3,
duration: 60,
yoyo: true,
repeat: 1
});
});
return box;
}
}
// Inicialização Global
window.onload = function() {
new Phaser.Game(config);
};
</script>
</body>
</html>
