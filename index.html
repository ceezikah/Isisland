// Helper universal para desenhar Elipses (100% compatível com iOS 12)
function drawOvalPath(ctx, cx, cy, rx, ry) {
ctx.save();

ctx.scale(rx, ry);
ctx.beginPath();
ctx.arc(0, 0, 1, 0, Math.PI * 2, false);
ctx.restore();
}
function fillStrokeOval(ctx, cx, cy, rx, ry, fillColor, strokeColor, lineWidth) {
drawOvalPath(ctx, cx, cy, rx, ry);
if (fillColor) {
ctx.fillStyle = fillColor;
ctx.fill();
}
if (strokeColor) {
ctx.strokeStyle = strokeColor;
ctx.lineWidth = lineWidth || 3;
ctx.stroke();
}
}
// Helper universal para retângulos arredondados compatível com iOS 12
function fillStrokeRoundRect(ctx, x, y, w, h, r, fillColor, strokeColor, lineWidth) {

if (h < 2 * r) r = h / 2;
if (r < 0) r = 0;
ctx.beginPath();
ctx.moveTo(x + r, y);
ctx.arcTo(x + w, y, x + w, y + h, r);
ctx.arcTo(x + w, y + h, x, y + h, r);
ctx.arcTo(x, y + h, x, y, r);
ctx.arcTo(x, y, x + w, y, r);
ctx.closePath();
if (fillColor) {
ctx.fillStyle = fillColor;
ctx.fill();
}
if (strokeColor) {
ctx.strokeStyle = strokeColor;
ctx.lineWidth = lineWidth || 3;
ctx.stroke();
}
}
// Helper de texto com contorno estilo Cartoon
function drawCartoonText(ctx, text, x, y, fontSize, fillColor, outlineColor, outlineWidth, align) {

ctx.font = "900 " + Math.round(fontSize) + "px 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif";

function startTransition(type, midpointCallback) {
if (State.transition.active) return;
State.transition.active = true;
State.transition.type = type || "CLOUD";
State.transition.progress = 0;
State.transition.phase = "IN";
State.transition.onMidpoint = midpointCallback;
}
function updateAndDrawTransition(ctx, w, h, dt) {
if (!State.transition.active) return;
var tr = State.transition;
var speed = 2.5;
if (tr.phase === "IN") {
tr.progress += dt * speed;
if (tr.progress >= 1) {
tr.progress = 1;
tr.phase = "OUT";
if (tr.onMidpoint) {
var fn = tr.onMidpoint;
tr.onMidpoint = null;
fn();
}
}
} else {
tr.progress -= dt * speed;
if (tr.progress <= 0) {
tr.progress = 0;
tr.active = false;
return;
}
}
ctx.save();
if (tr.type === "IRIS") {
var maxR = Math.sqrt(w * w + h * h) * 0.65;
var curR = Math.max(1, maxR * (1 - tr.progress));
ctx.fillStyle = "#111111";
ctx.beginPath();
ctx.rect(0, 0, w, h);
ctx.arc(w / 2, h / 2, curR, 0, Math.PI * 2, true);
ctx.fill();
} else {
var p = tr.progress;
ctx.fillStyle = "#FFFFFF";
var cols = 6;
for (var i = 0; i <= cols; i++) {
var cx = (i / cols) * w;
var cyTop = -h * 0.3 + p * (h * 0.85);
var cyBot = h * 1.3 - p * (h * 0.85);
ctx.beginPath();
ctx.arc(cx, cyTop, w * 0.22, 0, Math.PI * 2);
ctx.arc(cx, cyBot, w * 0.22, 0, Math.PI * 2);
ctx.fill();
}
}
ctx.restore();
}

vy = (vy / dist) * maxR;

World.joy.stickX = World.joy.baseX + vx;
World.joy.stickY = World.joy.baseY + vy;
World.joy.dx = vx / maxR;
World.joy.dy = vy / maxR;

World.btnA.pressed = false;
World.btnB.pressed = false;
if (World.joy.active && (World.joy.pointerId === id || id === "mouse")) {
World.joy.active = false;
World.joy.pointerId = null;
World.joy.dx = 0;
World.joy.dy = 0;
World.joy.stickX = World.joy.baseX;
World.joy.stickY = World.joy.baseY;
}
}
canvas.addEventListener("touchstart", function(e) {
if (State.screen === "WORLD" && e.cancelable) e.preventDefault();
for (var i = 0; i < e.changedTouches.length; i++) {
var t = e.changedTouches[i];
handlePointerDown(t.identifier, t.clientX, t.clientY);
}
}, false);
canvas.addEventListener("touchmove", function(e) {
if (State.screen === "WORLD" && e.cancelable) e.preventDefault();
for (var i = 0; i < e.changedTouches.length; i++) {
var t = e.changedTouches[i];
handlePointerMove(t.identifier, t.clientX, t.clientY);
}
}, false);
canvas.addEventListener("touchend", function(e) {
for (var i = 0; i < e.changedTouches.length; i++) {
handlePointerUp(e.changedTouches[i].identifier);
}
}, false);
canvas.addEventListener("touchcancel", function(e) {
for (var i = 0; i < e.changedTouches.length; i++) {
handlePointerUp(e.changedTouches[i].identifier);
}
}, false);
canvas.addEventListener("mousedown", function(e) {
handlePointerDown("mouse", e.clientX, e.clientY);
}, false);
window.addEventListener("mousemove", function(e) {
handlePointerMove("mouse", e.clientX, e.clientY);
}, false);
window.addEventListener("mouseup", function() {
handlePointerUp("mouse");
}, false);
var keys = {};
window.addEventListener("keydown", function(e) {
keys[e.keyCode] = true;
if (e.keyCode === 32 && State.screen === "WORLD") triggerJump();
});
window.addEventListener("keyup", function(e) {
keys[e.keyCode] = false;
});
function updateWorldPhysics(dt) {
var moveX = World.joy.dx;
var moveY = World.joy.dy;
if (keys[37] || keys[65]) moveX = -1;
if (keys[39] || keys[68]) moveX = 1;
if (keys[38] || keys[87]) moveY = -1;
if (keys[40] || keys[83]) moveY = 1;
if (Math.abs(moveX) > 0.08 || Math.abs(moveY) > 0.08) {
World.playerX += moveX * 260 * dt;
World.playerY += moveY * 0.32 * dt;
World.walkCycle += dt * 12;
if (moveY > 0.35) {
World.facingBack = false;
} else if (moveY < -0.15 || Math.abs(moveX) > 0.2) {
World.facingBack = true;
}
} else {
World.walkCycle = 0;
}
if (World.playerY < 0.50) World.playerY = 0.50;
if (World.playerY > 0.83) World.playerY = 0.83;
if (World.playerX < 0) World.playerX += TOTAL_WORLD_WIDTH;
if (World.playerX >= TOTAL_WORLD_WIDTH) World.playerX -= TOTAL_WORLD_WIDTH;
if (World.isJumping) {
World.jumpZ += World.jumpVz;
World.jumpVz -= 32 * dt;
if (World.jumpZ <= 0) {
World.jumpZ = 0;
World.jumpVz = 0;
World.isJumping = false;
}
}
if (World.pickAnimTimer > 0) {
World.pickAnimTimer -= dt;
}
}
function renderIslandWorldScene(ctx, w, h, time, dt) {
updateWorldPhysics(dt);
getControlPositions(w, h);
var camX = World.playerX - w * 0.42;
ctx.fillStyle = "#81D4FA";
ctx.fillRect(0, 0, w, h);
ctx.fillStyle = "#039BE5";
ctx.fillRect(0, h * 0.36, w, h * 0.64);
ctx.save();
ctx.strokeStyle = "#222222";
ctx.lineWidth = 4;
ctx.fillStyle = "#E1F5FE";
ctx.beginPath();
ctx.moveTo(0, h * 0.32);
ctx.quadraticCurveTo(w * 0.72, h * 0.38, w * 0.88, h);
ctx.lineTo(0, h);
ctx.closePath();
ctx.fill();
ctx.fillStyle = "#FFD54F";
ctx.beginPath();
ctx.moveTo(0, h * 0.34);
ctx.quadraticCurveTo(w * 0.68, h * 0.40, w * 0.83, h);
ctx.lineTo(0, h);
ctx.closePath();
ctx.fill();
ctx.stroke();
ctx.fillStyle = "#8BC34A";
ctx.beginPath();
ctx.moveTo(0, h * 0.28);
ctx.quadraticCurveTo(w * 0.38, h * 0.36, w * 0.22, h);
ctx.lineTo(0, h);
ctx.closePath();
ctx.fill();
ctx.stroke();
ctx.restore();
for (var zIdx = -1; zIdx <= ZONES.length; zIdx++) {
var wrappedIdx = (zIdx + ZONES.length) % ZONES.length;
var zone = ZONES[wrappedIdx];
var worldX = zIdx * ZONE_WIDTH;
var screenX = worldX - camX;
if (screenX > -ZONE_WIDTH && screenX < w + ZONE_WIDTH) {
ctx.save();
ctx.lineJoin = "round";
ctx.strokeStyle = "#222222";
ctx.lineWidth = 3.5;
var mx = screenX + 140;
var my = h * 0.38;
ctx.fillStyle = "#8D6E63";
ctx.beginPath();
ctx.moveTo(mx - 150, my);
ctx.lineTo(mx - 30, my - 190);
ctx.lineTo(mx + 95, my);
ctx.closePath();
ctx.fill(); ctx.stroke();
ctx.fillStyle = "#FFFFFF";
ctx.beginPath();
ctx.moveTo(mx - 30, my - 190);
ctx.lineTo(mx - 68, my - 130);
ctx.lineTo(mx - 44, my - 120);
ctx.lineTo(mx - 30, my - 138);
ctx.lineTo(mx - 10, my - 120);
ctx.lineTo(mx + 8, my - 130);
ctx.closePath();
ctx.fill(); ctx.stroke();
var tx = screenX + 340;
var ty = h * 0.42;
ctx.fillStyle = zone.tentColor;
ctx.beginPath();
ctx.moveTo(tx - 65, ty);
ctx.lineTo(tx, ty - 75);
ctx.lineTo(tx + 65, ty);
ctx.closePath();
ctx.fill(); ctx.stroke();
ctx.fillStyle = zone.accent;
ctx.beginPath();
ctx.moveTo(tx - 22, ty);
ctx.lineTo(tx, ty - 75);
ctx.lineTo(tx + 22, ty);
ctx.closePath();
ctx.fill(); ctx.stroke();
drawBuntingFlags(ctx, mx - 20, my - 120, tx + 160, ty - 45, 8);
if (wrappedIdx === 0) {
drawCarnivalMasks(ctx, screenX + 470, h * 0.56, 1.35);
} else if (wrappedIdx === 1) {
drawCuteBunny(ctx, screenX + 470, h * 0.56, 1.25);
} else {
fillStrokeRoundRect(ctx, screenX + 450, h * 0.53, 38, 38, 8, zone.accent, "#222222", 3);
}
drawCuteCrab(ctx, screenX + 580 + Math.sin(time * 2 + zIdx) * 20, h * 0.63, 1.0);
drawCuteFish(ctx, screenX + 670, h * 0.46 + Math.sin(time * 1.6 + zIdx) * 8, "#FF9800", -1);
drawCuteFish(ctx, screenX + 740, h * 0.54 + Math.cos(time * 1.4 + zIdx) * 8, "#FFEB3B", 1);
ctx.restore();
}
}
var px = w * 0.44;
var py = h * World.playerY - World.jumpZ;
var depthScale = 0.85 + (World.playerY - 0.50) * 0.95;
if (World.pickAnimTimer > 0) {
depthScale *= 1.12;
}
drawCharacter(ctx, px, py, depthScale, World.facingBack, World.walkCycle);
// Faixa Rosa no Topo
var curZoneIdx = Math.floor(World.playerX / ZONE_WIDTH) % ZONES.length;
if (curZoneIdx < 0) curZoneIdx += ZONES.length;
var activeZone = ZONES[curZoneIdx];
var bannerW = Math.min(340, w * 0.58);
var bannerH = 44;
var bx = (w - bannerW) / 2;
var by = 12;
ctx.save();
ctx.fillStyle = "#D81B60";
ctx.strokeStyle = "#222222";
ctx.lineWidth = 3;
ctx.beginPath();
ctx.moveTo(bx - 22, by + 10);
ctx.lineTo(bx + 6, by + 10);
ctx.lineTo(bx + 6, by + bannerH + 4);
ctx.lineTo(bx - 22, by + bannerH + 4);
ctx.lineTo(bx - 12, by + bannerH * 0.6);
ctx.closePath();
ctx.fill(); ctx.stroke();
ctx.beginPath();
ctx.moveTo(bx + bannerW + 22, by + 10);
ctx.lineTo(bx + bannerW - 6, by + 10);
ctx.lineTo(bx + bannerW - 6, by + bannerH + 4);
ctx.lineTo(bx + bannerW + 22, by + bannerH + 4);
ctx.lineTo(bx + bannerW + 12, by + bannerH * 0.6);
ctx.closePath();
ctx.fill(); ctx.stroke();
fillStrokeRoundRect(ctx, bx, by, bannerW, bannerH, 12, activeZone.ribbonColor, "#222222", 3.5);
drawCartoonText(ctx, activeZone.name, w / 2, by + bannerH / 2, Math.min(20, bannerW * 0.062), "#FFFFFF", "#222222", 4);
ctx.restore();
// Controle Analógico + Botões A e B
ctx.save();
var jx = World.joy.baseX;
var jy = World.joy.baseY;
ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
ctx.strokeStyle = "rgba(34, 34, 34, 0.65)";
ctx.lineWidth = 3;
ctx.beginPath();
ctx.arc(jx, jy, 60, 0, Math.PI * 2);
ctx.fill();
ctx.stroke();
var armW = 34;
var armL = 52;
fillStrokeRoundRect(ctx, jx - armW / 2, jy - armL, armW, armL * 2, 8, "rgba(220, 230, 242, 0.78)", "#546E7A", 2.5);
fillStrokeRoundRect(ctx, jx - armL, jy - armW / 2, armL * 2, armW, 8, "rgba(220, 230, 242, 0.78)", "#546E7A", 2.5);
drawCartoonText(ctx, "▲", jx, jy - 34, 15, "#78909C", "#37474F", 1);
drawCartoonText(ctx, "▼", jx, jy + 34, 15, "#78909C", "#37474F", 1);
drawCartoonText(ctx, "◀", jx - 34, jy, 15, "#78909C", "#37474F", 1);
drawCartoonText(ctx, "▶", jx + 34, jy, 15, "#78909C", "#37474F", 1);
ctx.fillStyle = World.joy.active ? "#FFEB3B" : "#FFFFFF";
ctx.strokeStyle = "#222222";
ctx.lineWidth = 3.5;
ctx.beginPath();
ctx.arc(World.joy.stickX, World.joy.stickY, 24, 0, Math.PI * 2);
ctx.fill();
ctx.stroke();
// Botão A Verde ("(Pegar)")
var scaleA = World.btnA.pressed ? 0.90 : 1.0;
ctx.save();
ctx.translate(World.btnA.x, World.btnA.y);
ctx.scale(scaleA, scaleA);
ctx.fillStyle = "#66BB6A";
ctx.strokeStyle = "#222222";
ctx.lineWidth = 4;
ctx.beginPath();
ctx.arc(0, 0, World.btnA.r, 0, Math.PI * 2);
ctx.fill();
ctx.stroke();
drawCartoonText(ctx, "A", 0, 1, 28, "#FFFFFF", "#222222", 5);
ctx.restore();
drawCartoonText(ctx, "(Pegar)", World.btnA.x, World.btnA.y + World.btnA.r + 16, 15, "#FFFFFF", "#222222", 4);
// Botão B Rosa ("(Pular)")
var scaleB = World.btnB.pressed ? 0.90 : 1.0;
ctx.save();
ctx.translate(World.btnB.x, World.btnB.y);
ctx.scale(scaleB, scaleB);
ctx.fillStyle = "#EC407A";
ctx.strokeStyle = "#222222";
ctx.lineWidth = 4;
ctx.beginPath();
ctx.arc(0, 0, World.btnB.r, 0, Math.PI * 2);
ctx.fill();
ctx.stroke();
drawCartoonText(ctx, "B", 0, 1, 28, "#FFFFFF", "#222222", 5);
ctx.restore();
drawCartoonText(ctx, "(Pular)", World.btnB.x, World.btnB.y + World.btnB.r + 16, 15, "#FFFFFF", "#222222", 4);
ctx.restore();
}
// ==========================================================================
// LOOP PRINCIPAL DE ANIMAÇÃO (COMPATÍVEL COM SAFARI DO iOS 12)
// ==========================================================================
var reqAnimFrame = window.requestAnimationFrame ||
window.webkitRequestAnimationFrame ||
function(cb) { return window.setTimeout(cb, 16); };
var lastTime = Date.now();
var elapsed = 0;
function resizeCanvas() {
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
if (State.screen === "PROFILE") {
drawBackgroundHearts();
}
}
window.addEventListener("resize", resizeCanvas, false);
window.addEventListener("orientationchange", function() {
setTimeout(resizeCanvas, 150);
}, false);
resizeCanvas();
function mainLoop() {
var now = Date.now();
var dt = Math.min(0.05, (now - lastTime) / 1000);
lastTime = now;
elapsed += dt;
var ctx = canvas.getContext("2d");
var w = canvas.width;
var h = canvas.height;
if (State.screen === "MENU") {
renderStartMenuScene(ctx, w, h, elapsed);
} else if (State.screen === "WORLD") {
renderIslandWorldScene(ctx, w, h, elapsed, dt);
} else {
ctx.clearRect(0, 0, w, h);
}
updateAndDrawTransition(ctx, w, h, dt);
reqAnimFrame(mainLoop);
}
setScreen("MENU");
reqAnimFrame(mainLoop);
})();
</script>
</body>
</html>
