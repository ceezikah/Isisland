<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ISISLAND</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
* {
box-sizing: border-box;
-webkit-tap-highlight-color: transparent;
user-select: none;
-webkit-user-select: none;
}
html, body {
margin: 0;
padding: 0;
width: 100vw;
height: 100vh;
overflow: hidden;
background-color: #29B6F6;
font-family: 'Fredoka', 'Arial Rounded MT Bold', sans-serif;
touch-action: none;
}
/* Canvas Principal do Jogo */
#game-canvas {
position: absolute;
top: 0; left: 0;
width: 100vw; height: 100vh;
z-index: 1;
display: block;
}
/* Camada de Telas HTML */
#ui-layer {
position: absolute;
top: 0; left: 0;
width: 100vw; height: 100vh;
z-index: 10;
pointer-events: none;
}
/* =========================================
TELA 1: MENU INICIAL (IDÊNTICO À IMAGEM)
========================================= */
#screen-start {
position: absolute;
top: 0; left: 0;
width: 100%; height: 100%;
pointer-events: none;
}
.start-buttons-box {
position: absolute;
right: 3%;
bottom: 8%;
display: flex;
flex-direction: column;
gap: 10px;
pointer-events: auto;
align-items: stretch;
width: clamp(150px, 24vw, 220px);
}
.btn-cartoon-start {
background: linear-gradient(180deg, #FFD54F 0%, #FFA000 100%);
color: #FFFFFF;
border: 4px solid #222222;
border-radius: 18px;
padding: 12px 18px;
font-size: clamp(18px, 3vw, 26px);
font-weight: 700;
font-family: inherit;
cursor: pointer;
text-shadow: 2px 2px 0 #222, -1px -1px 0 #222, 1px -1px 0 #222, -1px 1px 0 #222;
box-shadow: 0 6px 0 #222222, inset 0 3px 0 rgba(255,255,255,0.6);
transition: transform 0.08s;
}
.btn-cartoon-start:active {
transform: translateY(4px);
box-shadow: 0 2px 0 #222222;
}
.btn-cartoon-sub {
background: linear-gradient(180deg, #4FC3F7 0%, #0288D1 100%);
color: #FFFFFF;
border: 3.5px solid #222222;
border-radius: 14px;
padding: 8px 12px;
font-size: clamp(13px, 2vw, 17px);
font-weight: 700;
font-family: inherit;
cursor: pointer;
text-shadow: 1.5px 1.5px 0 #222;
box-shadow: 0 4px 0 #222222, inset 0 2px 0 rgba(255,255,255,0.5);
}
.btn-cartoon-sub:active {
transform: translateY(3px);
box-shadow: 0 1px 0 #222222;
}
/* =========================================
TELA 2: QUEM VAI BRINCAR? (ROSA C/ CORAÇÕES)
========================================= */
#screen-profile {
display: none;
position: absolute;
top: 0; left: 0;
width: 100%; height: 100%;
background: radial-gradient(circle at center, #FFD1DC 0%, #FF9EBB 100%);
pointer-events: auto;
align-items: center;
justify-content: center;
overflow: hidden;
}
.bg-heart {
position: absolute;
color: #FF5C8D;
opacity: 0.45;
font-size: 32px;
pointer-events: none;
animation: floatHeart 4s ease-in-out infinite alternate;
}
@keyframes floatHeart {
from { transform: translateY(0px) rotate(-6deg); }
to   { transform: translateY(-14px) rotate(6deg); }
}
.profile-card-wrapper {
position: relative;
width: 90%;
max-width: 470px;
}
.profile-card-PinkBack {
position: absolute;
top: -6px; left: -6px; right: -6px; bottom: -6px;
background: #FF4081;
border: 4px solid #222;
border-radius: 26px;
transform: rotate(-2deg);
z-index: 1;
}
.profile-card {
position: relative;
z-index: 2;
background: #FFFFFF;
border: 4px solid #222222;
border-radius: 24px;
padding: 18px 22px;
display: flex;
flex-direction: column;
align-items: center;
gap: 12px;
box-shadow: 0 10px 0 rgba(0,0,0,0.2);
}
.profile-title {
margin: 0;
font-size: clamp(22px, 4vw, 30px);
color: #6D1B3B;
text-align: center;
font-weight: 700;
}
.profile-middle-row {
display: flex;
align-items: center;
justify-content: center;
gap: 14px;
width: 100%;
}
.btn-gender-pill {
padding: 10px 16px;
border-radius: 16px;
border: 3.5px solid #222;
font-family: inherit;
font-size: clamp(14px, 2.5vw, 18px);
font-weight: 700;
cursor: pointer;
display: flex;
align-items: center;
gap: 6px;
box-shadow: 0 4px 0 #222;
transition: transform 0.1s;
}
.btn-gender-pill.girl {
background: #FF80AB;
color: #FFF;
text-shadow: 1px 1px 0 #222;
}
.btn-gender-pill.boy {
background: #4FC3F7;
color: #FFF;
text-shadow: 1px 1px 0 #222;
}
.btn-gender-pill.inactive {
filter: grayscale(0.65) opacity(0.65);
box-shadow: 0 2px 0 #222;
transform: translateY(2px);
}
.photo-frame {
width: clamp(95px, 20vw, 125px);
height: clamp(95px, 20vw, 125px);
background: #FFE4EC;
border: 4px solid #222;
border-radius: 18px;
overflow: hidden;
display: flex;
align-items: center;
justify-content: center;
box-shadow: inset 0 0 0 4px #FFF;
position: relative;
}
.photo-frame img, .photo-frame canvas {
width: 100%;
height: 100%;
object-fit: cover;
}
.photo-actions-row {
display: flex;
gap: 10px;
}
.btn-photo-action {
border: 3px solid #222;
border-radius: 12px;
padding: 7px 14px;
font-family: inherit;
font-size: 14px;
font-weight: 700;
color: #FFF;
cursor: pointer;
text-shadow: 1px 1px 0 #222;
box-shadow: 0 3px 0 #222;
}
.btn-photo-load { background: #29B6F6; }
.btn-photo-remove { background: #EF5350; }
.profile-name-input {
width: 90%;
padding: 10px 14px;
border: 3.5px solid #222;
border-radius: 14px;
font-family: inherit;
font-size: clamp(18px, 3vw, 22px);
font-weight: 700;
text-align: center;
color: #333;
outline: none;
background: #FAFAFA;
}
.btn-ok-green {
background: linear-gradient(180deg, #66BB6A 0%, #388E3C 100%);
color: #FFF;
border: 4px solid #222;
border-radius: 18px;
padding: 10px 45px;
font-family: inherit;
font-size: clamp(22px, 3.5vw, 28px);
font-weight: 700;
cursor: pointer;
text-shadow: 2px 2px 0 #222;
box-shadow: 0 6px 0 #222, inset 0 3px 0 rgba(255,255,255,0.45);
}
.btn-ok-green:active {
transform: translateY(4px);
box-shadow: 0 2px 0 #222;
}
/* =========================================
TELA 3: GUARDA-ROUPA (ROXO C/ ÍCONES)
========================================= */
#screen-wardrobe {
display: none;
position: absolute;
top: 0; left: 0;
width: 100%; height: 100%;
background: linear-gradient(180deg, #D1A3FF 0%, #E6C8FF 100%);
pointer-events: auto;
align-items: center;
justify-content: center;
padding: 14px;
}
.wardrobe-layout {
display: flex;
flex-direction: row;
gap: 16px;
width: 96%;
max-width: 820px;
height: 90%;
max-height: 430px;
align-items: stretch;
}
.avatar-box-card {
flex: 0 0 34%;
background: #FFFFFF;
border: 4px solid #222;
border-radius: 22px;
padding: 12px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: space-between;
box-shadow: 0 8px 0 rgba(0,0,0,0.2);
}
.avatar-box-title {
font-size: clamp(20px, 3vw, 26px);
font-weight: 700;
color: #222;
margin: 2px 0;
}
.avatar-inner-frame {
width: 100%;
flex: 1;
background: #F7F5FA;
border: 3px solid #E0D4EC;
border-radius: 16px;
display: flex;
align-items: center;
justify-content: center;
overflow: hidden;
}
#wardrobe-avatar-canvas {
max-width: 100%;
max-height: 100%;
}
.wardrobe-right-col {
flex: 1;
display: flex;
flex-direction: column;
justify-content: space-between;
gap: 10px;
}
.wardrobe-tabs-bar {
display: flex;
gap: 6px;
padding: 0 4px;
}
.w-tab {
flex: 1;
background: #E1BEE7;
border: 3.5px solid #222;
border-bottom: none;
border-radius: 16px 16px 0 0;
padding: 6px 4px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
cursor: pointer;
font-family: inherit;
font-size: clamp(10px, 1.6vw, 13px);
font-weight: 700;
color: #222;
margin-bottom: -14px;
padding-bottom: 14px;
z-index: 1;
}
.w-tab.active {
background: #FFFFFF;
z-index: 3;
transform: translateY(-3px);
}
.w-tab canvas {
width: 28px;
height: 24px;
}
.wardrobe-grid-card {
position: relative;
z-index: 2;
flex: 1;
background: #FFFFFF;
border: 4px solid #222;
border-radius: 20px;
padding: 14px;
display: grid;
grid-template-columns: repeat(5, 1fr);
grid-template-rows: repeat(2, 1fr);
gap: 10px;
box-shadow: 0 8px 0 rgba(0,0,0,0.2);
overflow-y: auto;
}
.cloth-slot {
border: 3.5px solid #222;
border-radius: 14px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
cursor: pointer;
position: relative;
padding: 4px;
box-shadow: 0 4px 0 #222, inset 0 2px 0 rgba(255,255,255,0.5);
transition: transform 0.08s;
}
.cloth-slot:active {
transform: scale(0.95);
}
.cloth-slot.selected {
outline: 4px solid #FF1744;
transform: translateY(-2px);
}
.cloth-slot canvas {
width: 44px;
height: 44px;
}
.cloth-slot span {
font-size: 10px;
font-weight: 700;
color: #111;
text-align: center;
line-height: 1.05;
margin-top: 2px;
background: rgba(255,255,255,0.75);
padding: 1px 4px;
border-radius: 6px;
}
.btn-create-purple {
align-self: center;
background: linear-gradient(180deg, #AB47BC 0%, #7B1FA2 100%);
color: #FFF;
border: 4px solid #222;
border-radius: 18px;
padding: 10px 36px;
font-family: inherit;
font-size: clamp(18px, 3vw, 24px);
font-weight: 700;
cursor: pointer;
text-shadow: 2px 2px 0 #222;
box-shadow: 0 5px 0 #222, inset 0 2px 0 rgba(255,255,255,0.4);
}
/* =========================================
TELA 4: HUD DE GAMEPLAY NA ILHA
========================================= */
#screen-game-hud {
display: none;
position: absolute;
top: 0; left: 0;
width: 100%; height: 100%;
pointer-events: none;
}
.top-ribbon-wrapper {
position: absolute;
top: 12px;
left: 50%;
transform: translateX(-50%);
display: flex;
align-items: center;
z-index: 5;
}
.ribbon-banner {
background: #FF4081;
color: #FFF;
border: 4px solid #222;
border-radius: 16px;
padding: 8px 26px;
font-size: clamp(16px, 3vw, 24px);
font-weight: 700;
text-shadow: 2px 2px 0 #222;
box-shadow: 0 5px 0 #222;
white-space: nowrap;
}
.btn-exit-island {
position: absolute;
top: 14px;
left: 16px;
pointer-events: auto;
background: #FF5252;
color: #FFF;
border: 3.5px solid #222;
border-radius: 14px;
padding: 8px 14px;
font-family: inherit;
font-size: 15px;
font-weight: 700;
cursor: pointer;
text-shadow: 1.5px 1.5px 0 #222;
box-shadow: 0 4px 0 #222;
z-index: 6;
}
.btn-exit-island:active {
transform: translateY(3px);
box-shadow: 0 1px 0 #222;
}
/* Controle Analógico + D-Pad Visual na Esquerda */
#joystick-zone {
position: absolute;
bottom: 22px;
left: 26px;
width: 140px;
height: 140px;
pointer-events: auto;
touch-action: none;
}
#joystick-canvas {
width: 140px;
height: 140px;
display: block;
}
/* Botões A (Pegar) e B (Pular) na Direita */
.action-buttons-zone {
position: absolute;
bottom: 22px;
right: 26px;
width: 175px;
height: 140px;
pointer-events: auto;
}
.action-btn-wrap {
position: absolute;
display: flex;
flex-direction: column;
align-items: center;
}
.action-btn-wrap.btn-a-pos {
bottom: 0;
left: 0;
}
.action-btn-wrap.btn-b-pos {
top: 0;
right: 0;
}
.btn-round-action {
width: 68px;
height: 68px;
border-radius: 50%;
border: 4px solid #222;
color: #FFF;
font-family: inherit;
font-size: 32px;
font-weight: 700;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
text-shadow: 2px 2px 0 #222;
box-shadow: 0 6px 0 #222, inset 0 4px 0 rgba(255,255,255,0.45);
user-select: none;
}
.btn-round-action.green-a { background: linear-gradient(180deg, #66BB6A 0%, #2E7D32 100%); }
.btn-round-action.pink-b  { background: linear-gradient(180deg, #FF5C8D 0%, #C2185B 100%); }
.btn-round-action:active, .btn-round-action.pressed {
transform: translateY(4px);
box-shadow: 0 2px 0 #222;
}
.action-label {
margin-top: 4px;
font-size: 14px;
font-weight: 700;
color: #FFF;
text-shadow: 1.5px 1.5px 0 #222, -1px -1px 0 #222, 1px -1px 0 #222, -1px 1px 0 #222;
}
/* Ajustes Mobile Retrato */
@media (orientation: portrait) {
.wardrobe-layout {
flex-direction: column;
height: 94%;
max-height: none;
}
.avatar-box-card {
flex: 0 0 38%;
width: 100%;
}
.wardrobe-right-col {
flex: 1;
width: 100%;
}
.wardrobe-grid-card {
grid-template-columns: repeat(5, 1fr);
}
}
</style>
</head>
<body>
<!-- CANVAS DE RENDERIZAÇÃO ILUSTRADA DO JOGO -->
<canvas id="game-canvas"></canvas>
<!-- INTERFACES SOBREPOSTAS -->
<div id="ui-layer">
<!-- TELA 1: INÍCIO -->
<div id="screen-start">
<div class="start-buttons-box">
<button class="btn-cartoon-start" id="btn-start">Start Game</button>
<button class="btn-cartoon-sub" id="btn-quality">Quality: HIGH</button>
<button class="btn-cartoon-sub" id="btn-sound">Sound: ON</button>
</div>
</div>
<!-- TELA 2: CADASTRO (QUEM VAI BRINCAR?) -->
<div id="screen-profile">
<div class="bg-heart" style="top:8%; left:7%;">💗</div>
<div class="bg-heart" style="top:22%; left:14%; font-size:24px;">💖</div>
<div class="bg-heart" style="bottom:18%; left:9%;">💕</div>
<div class="bg-heart" style="top:12%; right:9%;">💗</div>
<div class="bg-heart" style="bottom:24%; right:12%; font-size:26px;">💖</div>
<div class="bg-heart" style="bottom:10%; right:7%;">💕</div>
<div class="profile-card-wrapper">
<div class="profile-card-PinkBack"></div>
<div class="profile-card">
<h2 class="profile-title">Quem vai brincar?</h2>
<div class="profile-middle-row">
<button class="btn-gender-pill girl" id="btn-select-girl">Menina 👧</button>
<div class="photo-frame" id="photo-box">
<canvas id="default-face-canvas" width="120" height="120"></canvas>
</div>
<button class="btn-gender-pill boy inactive" id="btn-select-boy">Menino 👦</button>
</div>
<input type="file" id="photo-file-input" accept="image/*" style="display:none">
<div class="photo-actions-row">
<button class="btn-photo-action btn-photo-load" id="btn-load-photo">Carregar Foto</button>
<button class="btn-photo-action btn-photo-remove" id="btn-remove-photo">Remover</button>
</div>
<input type="text" class="profile-name-input" id="input-player-name" value="Isis" maxlength="16" placeholder="Digite seu nome">
<button class="btn-ok-green" id="btn-profile-ok">OK</button>
</div>
</div>
</div>
<!-- TELA 3: GUARDA-ROUPA (10 OPÇÕES DE CADA COM ÍCONES DESENHADOS) -->
<div id="screen-wardrobe">
<div class="wardrobe-layout">
<div class="avatar-box-card">
<div class="avatar-box-title" id="wardrobe-player-name">Isis</div>
<div class="avatar-inner-frame">
<canvas id="wardrobe-avatar-canvas" width="200" height="250"></canvas>
</div>
</div>
<div class="wardrobe-right-col">
<div class="wardrobe-tabs-bar">
<button class="w-tab active" data-cat="hats">
<canvas id="tab-icon-hats" width="40" height="34"></canvas>
<span>Chapéus</span>
</button>
<button class="w-tab" data-cat="tops">
<canvas id="tab-icon-tops" width="40" height="34"></canvas>
<span>Cima</span>
</button>
<button class="w-tab" data-cat="bottoms">
<canvas id="tab-icon-bottoms" width="40" height="34"></canvas>
<span>Baixo</span>
</button>
<button class="w-tab" data-cat="shoes">
<canvas id="tab-icon-shoes" width="40" height="34"></canvas>
<span>Calçados</span>
</button>
<button class="w-tab" data-cat="acc">
<canvas id="tab-icon-acc" width="40" height="34"></canvas>
<span>Acessórios</span>
</button>
</div>
<div class="wardrobe-grid-card" id="wardrobe-items-grid"></div>
<button class="btn-create-purple" id="btn-finish-avatar">CRIAR AVATAR</button>
</div>
</div>
</div>
<!-- TELA 4: GAMEPLAY HUD (JOYSTICK ANALÓGICO + BOTÕES A/B + SAIR) -->
<div id="screen-game-hud">
<button class="btn-exit-island" id="btn-exit-game">⬅ Sair</button>
<div class="top-ribbon-wrapper">
<div class="ribbon-banner" id="zone-title-banner">Carnaval (Fevereiro)</div>
</div>
<div id="joystick-zone">
<canvas id="joystick-canvas" width="140" height="140"></canvas>
</div>
<div class="action-buttons-zone">
<div class="action-btn-wrap btn-a-pos">
<button class="btn-round-action green-a" id="btn-action-a">A</button>
<span class="action-label">(Pegar)</span>
</div>
<div class="action-btn-wrap btn-b-pos">
<button class="btn-round-action pink-b" id="btn-action-b">B</button>
<span class="action-label">(Pular)</span>
</div>
</div>
</div>
</div>
<script>
// =========================================================================
// 1. ESTADO GLOBAL DO JOGO E CATÁLOGO DE 50 ROUPAS / ACESSÓRIOS
// =========================================================================
const State = {
screen: 'START', // 'START', 'PROFILE', 'WARDROBE', 'GAME'
quality: 'HIGH',
sound: true,
playerName: 'Isis',
gender: 'F',     // 'F' = Menina (biquíni rosa inicial), 'M' = Menino (sunga azul inicial)
skinColor: '#F7C6A3',
hairColor: '#5D3A24',
customPhotoURL: null,
activeCat: 'hats',
equipped: {
hats: -1,
tops: -1,
bottoms: -1,
shoes: -1,
acc: -1
},
// Transições animadas
cloudTransition: { active: false, phase: 'NONE', progress: 0, onMidpoint: null },
irisTransition:  { active: false, phase: 'NONE', radius: 1.5, onMidpoint: null }
};
// Paletas vibrantes dos slots e das roupas
const SLOT_BG_COLORS = [
'#FFD54F', '#81D4FA', '#FF8A80', '#B39DDB', '#80CBC4',
'#A5D6A7', '#FFAB91', '#F48FB1', '#90CAF9', '#CE93D8'
];
const CLOTH_COLORS = [
'#1E88E5', '#FF4081', '#FDD835', '#43A047', '#8E24AA',
'#FB8C00', '#00ACC1', '#E53935', '#3949AB', '#6D4C41'
];
function getWardrobeCatalog(gender) {
const isF = gender === 'F';
return {
hats: [
{ name: 'Boné',        shape: 'cap',       color: '#1E88E5' },
{ name: 'Chapéu Sol',  shape: 'sunhat',    color: '#FDD835' },
{ name: 'Gorro',       shape: 'beanie',    color: '#E53935' },
{ name: 'Coroa',       shape: 'crown',     color: '#FFB300' },
{ name: 'Tiara',       shape: 'tiara',     color: '#FF4081' },
{ name: 'Cartola',     shape: 'tophat',    color: '#37474F' },
{ name: 'Boina',       shape: 'beret',     color: '#8E24AA' },
{ name: 'Praia',       shape: 'strawhat',  color: '#FFA726' },
{ name: 'Viseira',     shape: 'visor',     color: '#00ACC1' },
{ name: 'Capuz',       shape: 'hood',      color: '#43A047' }
],
tops: isF ? [
{ name: 'Camiseta',    shape: 'tshirt',    color: '#29B6F6' },
{ name: 'Regatinha',   shape: 'tank',      color: '#FF4081' },
{ name: 'Manga Longa', shape: 'long',      color: '#AB47BC' },
{ name: 'Blusinha',    shape: 'blouse',    color: '#FDD835' },
{ name: 'Cropped',     shape: 'crop',      color: '#26A69A' },
{ name: 'Jaquetinha',  shape: 'jacket',    color: '#EF5350' },
{ name: 'Moletom',     shape: 'hoodie',    color: '#66BB6A' },
{ name: 'Bata',        shape: 'tunic',     color: '#FFA726' },
{ name: 'Colete',      shape: 'vest',      color: '#5C6BC0' },
{ name: 'Cardigã',     shape: 'cardigan',  color: '#EC407A' }
] : [
{ name: 'Camiseta',    shape: 'tshirt',    color: '#1E88E5' },
{ name: 'Regata',      shape: 'tank',      color: '#FDD835' },
{ name: 'Manga Longa', shape: 'long',      color: '#43A047' },
{ name: 'Polo',        shape: 'tshirt',    color: '#E53935' },
{ name: 'Camisa',      shape: 'jacket',    color: '#26C6DA' },
{ name: 'Jaqueta',     shape: 'jacket',    color: '#546E7A' },
{ name: 'Moletom',     shape: 'hoodie',    color: '#FB8C00' },
{ name: 'Suéter',      shape: 'long',      color: '#7E57C2' },
{ name: 'Colete',      shape: 'vest',      color: '#8D6E63' },
{ name: 'Casaco',      shape: 'cardigan',  color: '#0288D1' }
],
bottoms: isF ? [
{ name: 'Shortinho',   shape: 'shorts',    color: '#42A5F5' },

function drawClothIcon(ctx, w, h, cat, item) {
ctx.clearRect(0, 0, w, h);
ctx.save();
ctx.lineWidth = 2.6;
ctx.strokeStyle = '#222';
ctx.fillStyle = item.color;
ctx.lineJoin = 'round';
ctx.lineCap = 'round';
const cx = w / 2;
const cy = h / 2;
if (cat === 'hats') {
if (item.shape === 'crown') {
ctx.beginPath();
ctx.moveTo(cx - 14, cy + 8);
ctx.lineTo(cx - 14, cy - 8);
ctx.lineTo(cx - 6, cy);
ctx.lineTo(cx, cy - 10);
ctx.lineTo(cx + 6, cy);
ctx.lineTo(cx + 14, cy - 8);
ctx.lineTo(cx + 14, cy + 8);
ctx.closePath();
ctx.fill(); ctx.stroke();
} else {
// Boné / Chapéu cartoon
ctx.beginPath();
ctx.arc(cx, cy + 2, 12, Math.PI, 0);
ctx.closePath();
ctx.fill(); ctx.stroke();
ctx.beginPath();
ctx.roundRect(cx - 16, cy + 1, 32, 6, 3);
ctx.fill(); ctx.stroke();
}
} else if (cat === 'tops') {
ctx.beginPath();
if (item.shape === 'tank' || item.shape === 'crop') {
ctx.roundRect(cx - 11, cy - 11, 22, 22, 4);
} else {
ctx.moveTo(cx - 10, cy - 12);
ctx.lineTo(cx + 10, cy - 12);
ctx.lineTo(cx + 18, cy - 3);
ctx.lineTo(cx + 13, cy + 3);
ctx.lineTo(cx + 10, cy - 1);
ctx.lineTo(cx + 10, cy + 12);
ctx.lineTo(cx - 10, cy + 12);
ctx.lineTo(cx - 10, cy - 1);
ctx.lineTo(cx - 13, cy + 3);
ctx.lineTo(cx - 18, cy - 3);
ctx.closePath();
}
ctx.fill(); ctx.stroke();
} else if (cat === 'bottoms') {
ctx.beginPath();
if (item.shape === 'skirt' || item.shape === 'dress') {
ctx.moveTo(cx - 10, cy - 10);
ctx.lineTo(cx + 10, cy - 10);
ctx.lineTo(cx + 16, cy + 11);
ctx.lineTo(cx - 16, cy + 11);
ctx.closePath();
} else {
const legH = item.shape === 'pants' || item.shape === 'overalls' ? 22 : 14;
ctx.moveTo(cx - 12, cy - 11);
ctx.lineTo(cx + 12, cy - 11);
ctx.lineTo(cx + 12, cy - 11 + legH);
ctx.lineTo(cx + 2, cy - 11 + legH);
ctx.lineTo(cx, cy - 2);
ctx.lineTo(cx - 2, cy - 11 + legH);
ctx.lineTo(cx - 12, cy - 11 + legH);
ctx.closePath();
}
ctx.fill(); ctx.stroke();
} else if (cat === 'shoes') {
ctx.beginPath();
ctx.roundRect(cx - 14, cy - 6, 14, 14, 4);
ctx.roundRect(cx - 14, cy + 1, 28, 9, 4);
ctx.fill(); ctx.stroke();
ctx.fillStyle = '#FFF';
ctx.fillRect(cx - 13, cy + 7, 26, 3);
} else if (cat === 'acc') {
if (item.shape.includes('glass')) {
ctx.fillStyle = item.color;
ctx.beginPath();
ctx.roundRect(cx - 16, cy - 6, 13, 11, 3);
ctx.roundRect(cx + 3, cy - 6, 13, 11, 3);
ctx.fill(); ctx.stroke();
ctx.beginPath();
ctx.moveTo(cx - 3, cy - 1); ctx.lineTo(cx + 3, cy - 1);
ctx.stroke();
} else {
ctx.beginPath();
ctx.arc(cx, cy, 11, 0, Math.PI * 2);
ctx.fill(); ctx.stroke();
ctx.fillStyle = '#FFF';
ctx.beginPath();
ctx.arc(cx, cy, 5, 0, Math.PI * 2);
ctx.fill(); ctx.stroke();
}
}
ctx.restore();
}

// Desenha o Avatar Completo (Estilo Roblox Cartoon da Imagem)
// facing: 'front' | 'back' | 'left' | 'right'
function drawCharacterModel(ctx, cx, cy, scale, facing, walkTime) {
ctx.save();
ctx.translate(cx, cy);
ctx.scale(scale, scale);
const isF = State.gender === 'F';
const catalog = getWardrobeCatalog(State.gender);
const eq = State.equipped;
const swing = Math.sin(walkTime * 10) * 6;
ctx.lineWidth = 3.5;
ctx.strokeStyle = '#222222';
ctx.lineJoin = 'round';
ctx.lineCap = 'round';
// Sombra no chão
ctx.fillStyle = 'rgba(0,0,0,0.18)';
ctx.beginPath();
ctx.ellipse(0, 82, 34, 9, 0, 0, Math.PI * 2);
ctx.fill();
// Cabelo longo parte de trás (se menina e de frente)
if (isF && facing !== 'back') {
ctx.fillStyle = State.hairColor;
ctx.beginPath();
ctx.roundRect(-28, -58, 56, 52, 14);
ctx.fill(); ctx.stroke();
}
// Braços estilo Roblox (trapezoidais articulados)
const drawArm = (side) => {
ctx.save();
const xOff = side * 25;
const yOff = -18 + (side * swing * 0.5);
ctx.translate(xOff, yOff);
ctx.rotate(side * 0.18);
ctx.fillStyle = State.skinColor;
ctx.beginPath();
ctx.roundRect(-8, 0, 16, 44, 6);
ctx.fill(); ctx.stroke();
// Manga da roupa se tiver top equipado
if (eq.tops !== -1) {
const topItem = catalog.tops[eq.tops];
ctx.fillStyle = topItem.color;
const sleeveH = (topItem.shape === 'long' || topItem.shape === 'jacket' || topItem.shape === 'hoodie' || topItem.shape === 'cardigan') ? 34 : (topItem.shape === 'tank' || topItem.shape === 'crop' ? 0 : 18);
if (sleeveH > 0) {
ctx.beginPath();
ctx.roundRect(-9, -1, 18, sleeveH, 5);
ctx.fill(); ctx.stroke();
}
}
// Relógio / Pulseira se acessório equipado
if (eq.acc !== -1) {
const accItem = catalog.acc[eq.acc];
if (accItem.shape === 'watch' || accItem.shape === 'bracelet') {
ctx.fillStyle = accItem.color;
ctx.fillRect(-9, 28, 18, 6);
ctx.strokeRect(-9, 28, 18, 6);
}
}
ctx.restore();
};
drawArm(-1);
drawArm(1);
// Pernas estilo Roblox (Blocos com joelho)
const drawLeg = (side) => {
const lx = side * 12 - 10;
const ly = 26 + (side * swing);
ctx.fillStyle = State.skinColor;
ctx.beginPath();
ctx.roundRect(lx, ly, 20, 50, 5);
ctx.fill(); ctx.stroke();
// Calçado
if (eq.shoes !== -1) {
const shoeItem = catalog.shoes[eq.shoes];
ctx.fillStyle = shoeItem.color;
const shH = shoeItem.shape === 'boot' ? 20 : 11;
ctx.beginPath();
ctx.roundRect(lx - 1, ly + 50 - shH, 22, shH, 4);
ctx.fill(); ctx.stroke();
}
};
drawLeg(-1);
drawLeg(1);
// Parte de Baixo (ou Roupa de Banho Inicial: Biquíni / Sunguinha)
if (eq.bottoms === -1) {
ctx.fillStyle = isF ? '#FF80AB' : '#29B6F6';
ctx.beginPath();
ctx.roundRect(-22, 18, 44, 18, 4);
ctx.fill(); ctx.stroke();
} else {
const botItem = catalog.bottoms[eq.bottoms];
ctx.fillStyle = botItem.color;
if (botItem.shape === 'skirt' || botItem.shape === 'dress') {
ctx.beginPath();
ctx.moveTo(-23, 16);
ctx.lineTo(23, 16);
ctx.lineTo(32, 54);
ctx.lineTo(-32, 54);
ctx.closePath();
ctx.fill(); ctx.stroke();
} else {
const pH = (botItem.shape === 'pants' || botItem.shape === 'overalls') ? 44 : 24;
ctx.beginPath();
ctx.roundRect(-22, 18, 44, 12, 3);
ctx.roundRect(-22, 24, 20, pH, 3);
ctx.roundRect(2, 24, 20, pH, 3);
ctx.fill(); ctx.stroke();
}
}
// Tronco (Bloco Roblox)
ctx.fillStyle = State.skinColor;
ctx.beginPath();
ctx.roundRect(-22, -22, 44, 44, 6);
ctx.fill(); ctx.stroke();
// Parte de Cima (ou Top Rosa de Biquíni inicial para menina / Sunga para menino)
if (eq.tops === -1) {
if (isF) {
ctx.fillStyle = '#FF80AB';
ctx.beginPath();
ctx.roundRect(-22, -18, 44, 36, 4);
ctx.fill(); ctx.stroke();
}
} else {
const topItem = catalog.tops[eq.tops];
ctx.fillStyle = topItem.color;
const tH = topItem.shape === 'crop' ? 26 : 44;
ctx.beginPath();
ctx.roundRect(-23, -22, 46, tH, 6);
ctx.fill(); ctx.stroke();
}
// Se vestido ou jardineira estiver equipado na aba de baixo, cobre o tronco também
if (eq.bottoms !== -1) {
const botItem = catalog.bottoms[eq.bottoms];
if (botItem.shape === 'dress' || botItem.shape === 'overalls') {
ctx.fillStyle = botItem.color;
ctx.beginPath();
ctx.roundRect(-22, -20, 44, 40, 5);
ctx.fill(); ctx.stroke();
}
}
// Cabeça (Bloco Arredondado Roblox)
ctx.fillStyle = State.skinColor;
ctx.beginPath();
ctx.roundRect(-22, -68, 44, 44, 12);
ctx.fill(); ctx.stroke();
if (facing === 'back') {
// De costas: Cabelo cobrindo a nuca
ctx.fillStyle = State.hairColor;
ctx.beginPath();
ctx.roundRect(-25, -72, 50, isF ? 56 : 34, 14);
ctx.fill(); ctx.stroke();
if (isF) {
ctx.fillStyle = '#FF80AB';
ctx.beginPath();
ctx.arc(16, -66, 6, 0, Math.PI * 2);
ctx.fill(); ctx.stroke();
}
} else {
// De frente: Rosto fofo + Cabelo + Lacinho
ctx.fillStyle = State.hairColor;
ctx.beginPath();
ctx.roundRect(-25, -72, 50, 20, 10);
ctx.fill(); ctx.stroke();
if (isF) {
ctx.fillStyle = '#FF80AB';
ctx.beginPath();
ctx.arc(17, -68, 6.5, 0, Math.PI * 2);
ctx.fill(); ctx.stroke();
}
const eyeShift = facing === 'left' ? -4 : (facing === 'right' ? 4 : 0);
ctx.fillStyle = '#222';
ctx.beginPath();
ctx.arc(-8 + eyeShift, -46, 3.2, 0, Math.PI * 2);
ctx.arc(8 + eyeShift, -46, 3.2, 0, Math.PI * 2);
ctx.fill();
// Sorriso
ctx.beginPath();
ctx.arc(eyeShift, -38, 6, 0.15 * Math.PI, 0.85 * Math.PI);
ctx.stroke();
// Óculos ou Brinco se equipado
if (eq.acc !== -1) {
const accItem = catalog.acc[eq.acc];
ctx.fillStyle = accItem.color;
if (accItem.shape.includes('glass')) {
ctx.beginPath();
ctx.roundRect(-18 + eyeShift, -52, 15, 11, 3);
ctx.roundRect(3 + eyeShift, -52, 15, 11, 3);
ctx.fill(); ctx.stroke();
} else if (accItem.shape === 'earring') {
ctx.beginPath();
ctx.arc(-24, -42, 4, 0, Math.PI * 2);
ctx.arc(24, -42, 4, 0, Math.PI * 2);
ctx.fill(); ctx.stroke();
}
}
}
// Chapéu se equipado
if (eq.hats !== -1) {
const hatItem = catalog.hats[eq.hats];
ctx.fillStyle = hatItem.color;
if (hatItem.shape === 'crown') {
ctx.beginPath();
ctx.moveTo(-18, -68);
ctx.lineTo(-18, -86);
ctx.lineTo(-8, -76);
ctx.lineTo(0, -88);
ctx.lineTo(8, -76);
ctx.lineTo(18, -86);
ctx.lineTo(18, -68);
ctx.closePath();
ctx.fill(); ctx.stroke();
} else {
ctx.beginPath();
ctx.roundRect(-24, -84, 48, 18, 8);
ctx.fill(); ctx.stroke();
ctx.beginPath();
ctx.roundRect(-32, -70, 64, 7, 4);
ctx.fill(); ctx.stroke();
}
}
ctx.restore();
}

// =========================================================================
const Input = {
joyX: 0,
joyY: 0,
active: false,
keys: { up: false, down: false, left: false, right: false }
};
function setupJoystick() {
const zone = document.getElementById('joystick-zone');
const jCanvas = document.getElementById('joystick-canvas');
const jCtx = jCanvas.getContext('2d');
function drawJoystickUI() {
jCtx.clearRect(0, 0, 140, 140);
const cx = 70, cy = 70;
// Base em cruz arredondada estilo D-Pad + Analógico da imagem
jCtx.save();
jCtx.fillStyle = 'rgba(255, 255, 255, 0.55)';
jCtx.strokeStyle = 'rgba(34, 34, 34, 0.75)';
jCtx.lineWidth = 3;
jCtx.beginPath();
jCtx.roundRect(cx - 22, cy - 64, 44, 128, 12);
jCtx.roundRect(cx - 64, cy - 22, 128, 44, 12);
jCtx.fill();
jCtx.stroke();
// Setinhas indicadoras nas 4 pontas
jCtx.fillStyle = 'rgba(60, 60, 60, 0.75)';
const drawTri = (x1, y1, x2, y2, x3, y3) => {
jCtx.beginPath();
jCtx.moveTo(x1, y1); jCtx.lineTo(x2, y2); jCtx.lineTo(x3, y3);
jCtx.closePath(); jCtx.fill();
};
drawTri(cx, cy - 55, cx - 10, cy - 40, cx + 10, cy - 40); // Cima
drawTri(cx, cy + 55, cx - 10, cy + 40, cx + 10, cy + 40); // Baixo
drawTri(cx - 55, cy, cx - 40, cy - 10, cx - 40, cy + 10); // Esq
drawTri(cx + 55, cy, cx + 40, cy - 10, cx + 40, cy + 10); // Dir
// Pino Analógico Móvel no centro
const knobX = cx + Input.joyX * 36;
const knobY = cy + Input.joyY * 36;
jCtx.fillStyle = Input.active ? '#FFEB3B' : 'rgba(255, 255, 255, 0.92)';
jCtx.beginPath();
jCtx.arc(knobX, knobY, 22, 0, Math.PI * 2);
jCtx.fill();
jCtx.stroke();
jCtx.restore();
}
function handlePointer(e) {
const rect = zone.getBoundingClientRect();
const clientX = e.touches ? e.touches[0].clientX : e.clientX;
const clientY = e.touches ? e.touches[0].clientY : e.clientY;
const dx = clientX - (rect.left + rect.width / 2);
const dy = clientY - (rect.top + rect.height / 2);
const maxR = 45;
const dist = Math.hypot(dx, dy);
const clamped = Math.min(dist, maxR);
const angle = Math.atan2(dy, dx);
Input.joyX = (clamped / maxR) * Math.cos(angle);
Input.joyY = (clamped / maxR) * Math.sin(angle);
drawJoystickUI();
}
zone.addEventListener('pointerdown', (e) => {
Input.active = true;
zone.setPointerCapture(e.pointerId);
handlePointer(e);
});
zone.addEventListener('pointermove', (e) => {
if (Input.active) handlePointer(e);
});
const release = () => {
Input.active = false;
Input.joyX = 0;
Input.joyY = 0;
drawJoystickUI();
};
zone.addEventListener('pointerup', release);
zone.addEventListener('pointercancel', release);
// Teclado também funciona
window.addEventListener('keydown', (e) => {
if (e.key === 'ArrowUp' || e.key === 'w') Input.keys.up = true;
if (e.key === 'ArrowDown' || e.key === 's') Input.keys.down = true;
if (e.key === 'ArrowLeft' || e.key === 'a') Input.keys.left = true;
if (e.key === 'ArrowRight' || e.key === 'd') Input.keys.right = true;
if (e.key === ' ') triggerJump();
});
window.addEventListener('keyup', (e) => {
if (e.key === 'ArrowUp' || e.key === 'w') Input.keys.up = false;
if (e.key === 'ArrowDown' || e.key === 's') Input.keys.down = false;
if (e.key === 'ArrowLeft' || e.key === 'a') Input.keys.left = false;
if (e.key === 'ArrowRight' || e.key === 'd') Input.keys.right = false;
});
drawJoystickUI();
}

// Auxiliar para texto com borda preta grossa estilo cartoon
function drawCartoonText(text, x, y, fontSize, fillColor, strokeWidth = 5) {
ctx.save();
ctx.font = ⁠700 ${fontSize}px 'Fredoka', 'Arial Rounded MT Bold', sans-serif⁠;
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.lineJoin = 'round';

// Desenha um Caranguejo Cartoon fofo
function drawCartoonCrab(x, y, scale = 1) {
ctx.save();
ctx.translate(x, y);
ctx.scale(scale, scale);
ctx.lineWidth = 2.5;
ctx.strokeStyle = '#222';
ctx.fillStyle = '#E53935';
// Garrinhas
ctx.beginPath();
ctx.arc(-14, -10, 6, 0.3, Math.PI * 1.7);
ctx.arc(14, -10, 6, -0.3, Math.PI * 1.3);
ctx.fill(); ctx.stroke();
// Perninhas
for (let i = -1; i <= 1; i += 2) {
ctx.beginPath();
ctx.moveTo(i * 10, 2); ctx.lineTo(i * 18, 6);
ctx.moveTo(i * 9, 6);  ctx.lineTo(i * 16, 11);
ctx.stroke();
}
// Corpo oval
ctx.beginPath();
ctx.ellipse(0, 0, 13, 9, 0, 0, Math.PI * 2);
ctx.fill(); ctx.stroke();
// Olhinhos
ctx.fillStyle = '#FFF';
ctx.beginPath();
ctx.arc(-5, -8, 3.5, 0, Math.PI * 2);
ctx.arc(5, -8, 3.5, 0, Math.PI * 2);
ctx.fill(); ctx.stroke();
ctx.fillStyle = '#222';
ctx.beginPath();
ctx.arc(-5, -8, 1.5, 0, Math.PI * 2);
ctx.arc(5, -8, 1.5, 0, Math.PI * 2);
ctx.fill();
ctx.restore();
}
// Desenha um Peixinho Cartoon
function drawCartoonFish(x, y, color, dir = 1, scale = 1) {
ctx.save();
ctx.translate(x, y);
ctx.scale(dir * scale, scale);
ctx.lineWidth = 2.2;
ctx.strokeStyle = '#222';
ctx.fillStyle = color;
// Rabinho
ctx.beginPath();
ctx.moveTo(-10, 0);
ctx.lineTo(-18, -7);
ctx.lineTo(-18, 7);
ctx.closePath();
ctx.fill(); ctx.stroke();
// Corpo
ctx.beginPath();
ctx.ellipse(0, 0, 11, 7, 0, 0, Math.PI * 2);
ctx.fill(); ctx.stroke();
// Olho
ctx.fillStyle = '#FFF';
ctx.beginPath(); ctx.arc(5, -2, 2.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
ctx.fillStyle = '#222';
ctx.beginPath(); ctx.arc(6, -2, 1.2, 0, Math.PI * 2); ctx.fill();

}
// Desenha Bandeirinhas de Festa entre dois pontos
function drawBuntingFlags(x1, y1, x2, y2, count = 7) {
ctx.save();
ctx.strokeStyle = '#222';
ctx.lineWidth = 2.5;
ctx.beginPath();
ctx.moveTo(x1, y1);
ctx.quadraticCurveTo((x1 + x2) / 2, Math.max(y1, y2) + 22, x2, y2);
ctx.stroke();
const flagColors = ['#FF4081', '#FFEB3B', '#29B6F6', '#66BB6A', '#AB47BC', '#FF9800'];
for (let i = 1; i < count; i++) {
const t = i / count;
const px = (1 - t) * (1 - t) * x1 + 2 * (1 - t) * t * ((x1 + x2) / 2) + t * t * x2;
const py = (1 - t) * (1 - t) * y1 + 2 * (1 - t) * t * (Math.max(y1, y2) + 22) + t * t * y2;
ctx.fillStyle = flagColors[i % flagColors.length];
ctx.beginPath();
ctx.moveTo(px - 7, py);
ctx.lineTo(px + 7, py);
ctx.lineTo(px, py + 14);
ctx.closePath();
ctx.fill();
ctx.stroke();
}
ctx.restore();
}

ctx.fill();
ctx.stroke();
ctx.fillStyle = '#222222';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText(text, x, y + 1);
ctx.restore();
}

// RENDERIZAÇÃO DA TELA 4: GAMEPLAY EM 3ª PESSOA NA ILHA (IDÊNTICA À IMAGEM 4)
// =========================================================================
function updateAndRenderIslandGame(dt, time) {
const w = canvas.width;
const h = canvas.height;
const totalWidth = World.zones.length * World.zoneWidth;
// 1. Leitura do Controle Analógico / Teclado
let moveX = Input.joyX;
let moveY = Input.joyY;
if (Input.keys.left)  moveX = -1;
if (Input.keys.right) moveX = 1;
if (Input.keys.up)    moveY = -1;
if (Input.keys.down)  moveY = 1;
const isMoving = Math.hypot(moveX, moveY) > 0.12;
if (isMoving) {
World.playerX += moveX * 260 * dt;
// Limita a caminhada somente dentro da faixa de areia/grama da ilha (sem cair no mar nem subir na parede)
World.playerDepth = Math.max(0.12, Math.min(0.88, World.playerDepth + moveY * 0.65 * dt));
World.walkTimer += dt;
if (Math.abs(moveY) > Math.abs(moveX)) {
World.facing = moveY < 0 ? 'back' : 'front';
} else {
World.facing = moveX < 0 ? 'left' : 'right';
}
} else {
World.walkTimer = 0;
}
// Rotação Circular Cronológica da Ilha
if (World.playerX < 0) World.playerX += totalWidth;
if (World.playerX >= totalWidth) World.playerX -= totalWidth;
// Física do Pulo (Botão B)
if (World.isJumping) {
World.playerJumpZ += World.playerJumpVel;
World.playerJumpVel -= 0.72;
if (World.playerJumpZ <= 0) {
World.playerJumpZ = 0;
World.playerJumpVel = 0;
World.isJumping = false;
}
}
// Atualiza o Banner da Data Comemorativa Atual
const zoneIdx = Math.floor(World.playerX / World.zoneWidth) % World.zones.length;
const currentZone = World.zones[zoneIdx];
const bannerEl = document.getElementById('zone-title-banner');
if (bannerEl && bannerEl.textContent !== currentZone.name) {
bannerEl.textContent = currentZone.name;
bannerEl.style.backgroundColor = currentZone.color;
}
// 2. Céu e Mar ao Fundo (Perspectiva Costeira Curva igual à Imagem 4)
ctx.fillStyle = '#4FC3F7';
ctx.fillRect(0, 0, w, h * 0.35);
// Oceano na metade direita/fundo
ctx.fillStyle = '#039BE5';
ctx.fillRect(0, h * 0.28, w, h * 0.72);
// Curva da Praia Dourada (Perspectiva 3ª pessoa onde a ilha fica à esquerda/centro e o mar à direita)
ctx.save();
ctx.lineWidth = 4.5;
ctx.strokeStyle = '#222';
// Espuma da praia
ctx.fillStyle = '#E0F7FA';
ctx.beginPath();
ctx.moveTo(0, h * 0.26);
ctx.quadraticCurveTo(w * 0.92, h * 0.48, w * 0.62, h + 20);
ctx.lineTo(0, h + 20);
ctx.closePath();
ctx.fill();
// Areia Amarela Vibrante da Ilha
ctx.fillStyle = '#FFD54F';
ctx.beginPath();
ctx.moveTo(0, h * 0.26);
ctx.quadraticCurveTo(w * 0.86, h * 0.48, w * 0.56, h + 20);
ctx.lineTo(0, h + 20);
ctx.closePath();
ctx.fill();
ctx.stroke();
// 3. Elementos da Zona Atual (Montanhas, Arbustos, Bandeirinhas, Coqueiros e Decoração da Data)
const localOffset = (World.playerX % World.zoneWidth) / World.zoneWidth;
const parallaxShift = (localOffset - 0.5) * 140;
// Montanhas de Natal sempre ao fundo no topo da ilha
const drawBgMountain = (mx, my, mw, mh, col) => {
ctx.fillStyle = col;
ctx.beginPath();
ctx.moveTo(mx - mw / 2, my);
ctx.lineTo(mx, my - mh);
ctx.lineTo(mx + mw / 2, my);
ctx.closePath();
ctx.fill(); ctx.stroke();
ctx.fillStyle = '#FFF';
ctx.beginPath();
ctx.moveTo(mx, my - mh);
ctx.lineTo(mx - mw * 0.22, my - mh * 0.55);
ctx.lineTo(mx, my - mh * 0.48);
ctx.lineTo(mx + mw * 0.22, my - mh * 0.55);
ctx.closePath();
ctx.fill(); ctx.stroke();
};
drawBgMountain(w * 0.08 - parallaxShift * 0.3, h * 0.45, 220, 190, '#8D6E63');
drawBgMountain(w * 0.24 - parallaxShift * 0.3, h * 0.42, 190, 165, '#A1887F');
// Gramado e Arbustos Verdes na borda esquerda da ilha
ctx.fillStyle = '#66BB6A';
ctx.beginPath();
ctx.moveTo(0, h * 0.38);
ctx.quadraticCurveTo(w * 0.46, h * 0.46, w * 0.26, h * 0.78);
ctx.lineTo(0, h * 0.82);
ctx.closePath();
ctx.fill(); ctx.stroke();
// Decoração Temática da Região Cronológica Atual
const propX = w * 0.36 - parallaxShift * 0.6;
const propY = h * 0.48;
// Lagoa Colorida + Barraca Temática
ctx.fillStyle = currentZone.color;
ctx.beginPath();
ctx.ellipse(propX - 70, propY + 35, 85, 34, -0.1, 0, Math.PI * 2);
ctx.fill(); ctx.stroke();
// Barraca de Festa
ctx.fillStyle = '#AB47BC';
ctx.beginPath();
ctx.moveTo(propX - 35, propY - 10);
ctx.lineTo(propX + 10, propY - 75);
ctx.lineTo(propX + 55, propY - 10);
ctx.closePath();
ctx.fill(); ctx.stroke();
// Máscaras / Símbolos na areia (Direita da personagem)
if (currentZone.prop === 'carnaval') {
// Duas máscaras de carnaval igual na imagem 4
ctx.fillStyle = '#29B6F6';
ctx.beginPath(); ctx.roundRect(w * 0.52, h * 0.52, 34, 38, 10); ctx.fill(); ctx.stroke();
ctx.fillStyle = '#FFEB3B';
ctx.beginPath(); ctx.roundRect(w * 0.57, h * 0.54, 34, 38, 10); ctx.fill(); ctx.stroke();
} else if (currentZone.prop === 'pascoa') {
ctx.fillStyle = '#FF80AB';
ctx.beginPath(); ctx.ellipse(w * 0.54, h * 0.55, 22, 30, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
} else if (currentZone.prop === 'natal') {
ctx.fillStyle = '#2E7D32';
ctx.beginPath();
ctx.moveTo(w * 0.54, h * 0.42); ctx.lineTo(w * 0.49, h * 0.58); ctx.lineTo(w * 0.59, h * 0.58);
ctx.closePath(); ctx.fill(); ctx.stroke();
}
// Bandeirinhas de Festa cruzando o cenário
drawBuntingFlags(w * 0.05, h * 0.25, w * 0.38, h * 0.32, 7);
drawBuntingFlags(w * 0.38, h * 0.32, w * 0.62, h * 0.30, 7);
// Caranguejos na beira da praia e peixinhos no mar à direita
drawCartoonCrab(w * 0.72 + Math.sin(time * 2.5) * 15, h * 0.56, 1.0);
drawCartoonCrab(w * 0.77 + Math.cos(time * 2.0) * 15, h * 0.68, 1.15);
drawCartoonFish(w * 0.78 + Math.sin(time * 1.7) * 20, h * 0.42, '#FF7043', -1, 1.0);
drawCartoonFish(w * 0.88 + Math.cos(time * 1.4) * 25, h * 0.50, '#29B6F6', -1, 1.1);
drawCartoonFish(w * 0.92 + Math.sin(time * 2.2) * 18, h * 0.60, '#FFCA28', -1, 0.95);
// 4. Desenha a Personagem na Ilha com escala de perspectiva 3ª pessoa
const minScreenY = h * 0.46;
const maxScreenY = h * 0.80;
const screenY = minScreenY + World.playerDepth * (maxScreenY - minScreenY);
const screenX = w * 0.34 + (World.playerDepth - 0.5) * (w * 0.14);
const charScale = 0.62 + World.playerDepth * 0.35;
drawCharacterModel(
ctx,
screenX,
screenY - World.playerJumpZ,
charScale,
World.facing,
World.walkTimer
);
ctx.restore();
}

// 6. RENDERIZAÇÃO DAS TRANSIÇÕES (NUVENS E CÍRCULO ÍRIS)
// =========================================================================
function renderTransitions(dt) {
const w = canvas.width;
const h = canvas.height;
// Transição de Nuvens
if (State.cloudTransition.active) {
const ct = State.cloudTransition;
ct.progress += dt * 1.8;
if (ct.phase === 'IN' && ct.progress >= 1) {
ct.phase = 'OUT';
ct.progress = 0;
if (ct.onMidpoint) ct.onMidpoint();
} else if (ct.phase === 'OUT' && ct.progress >= 1) {
ct.active = false;
}
const t = ct.phase === 'IN' ? ct.progress : (1 - ct.progress);
ctx.save();
ctx.fillStyle = '#FFFFFF';
ctx.strokeStyle = '#222222';
ctx.lineWidth = 4;
const cols = 5, rows = 4;
for (let r = 0; r <= rows; r++) {
for (let c = 0; c <= cols; c++) {
const targetX = (c / cols) * w;
const targetY = (r / rows) * h;
const startX = (c < cols / 2) ? -220 : w + 220;
const curX = startX + (targetX - startX) * Math.min(1, t * 1.25);
ctx.beginPath();
ctx.arc(curX, targetY, Math.max(w, h) * 0.22, 0, Math.PI * 2);
ctx.fill();
ctx.stroke();
}
}
ctx.restore();
}
// Transição Circular (Íris fechando e abrindo na Ilha)
if (State.irisTransition.active) {
const it = State.irisTransition;
if (it.phase === 'CLOSE') {
it.radius -= dt * 1.6;
if (it.radius <= 0) {
it.radius = 0;
it.phase = 'OPEN';
if (it.onMidpoint) it.onMidpoint();
}
} else if (it.phase === 'OPEN') {
it.radius += dt * 1.6;
if (it.radius >= 1.35) {
it.active = false;
}
}
const maxR = Math.hypot(w, h) * 0.65;
const curR = Math.max(0, it.radius * maxR);
ctx.save();
ctx.fillStyle = '#111111';
ctx.beginPath();
ctx.rect(0, 0, w, h);
ctx.arc(w / 2, h / 2, curR, 0, Math.PI * 2, true);
ctx.fill();
ctx.restore();
}
}

const next = (qualities.indexOf(State.quality) + 1) % qualities.length;
State.quality = qualities[next];
e.target.textContent = 'Quality: ' + State.quality;
};
document.getElementById('btn-sound').onclick = (e) => {
State.sound = !State.sound;
e.target.textContent = 'Sound: ' + (State.sound ? 'ON' : 'OFF');
};
// Tela 2: Seleção Menina / Menino + Upload da Foto + Nome
document.getElementById('btn-select-girl').onclick = () => {
State.gender = 'F';
document.getElementById('btn-select-girl').classList.remove('inactive');
document.getElementById('btn-select-boy').classList.add('inactive');
if (!State.customPhotoURL) drawDefaultKidsFace();
};
document.getElementById('btn-select-boy').onclick = () => {
State.gender = 'M';
document.getElementById('btn-select-boy').classList.remove('inactive');
document.getElementById('btn-select-girl').classList.add('inactive');
if (!State.customPhotoURL) drawDefaultKidsFace();
};
const photoInput = document.getElementById('photo-file-input');
const photoBox = document.getElementById('photo-box');
document.getElementById('btn-load-photo').onclick = () => photoInput.click();
document.getElementById('btn-remove-photo').onclick = () => {
photoInput.value = '';
State.customPhotoURL = null;
State.skinColor = '#F7C6A3';
State.hairColor = '#5D3A24';
photoBox.innerHTML = '<canvas id="default-face-canvas" width="120" height="120"></canvas>';
drawDefaultKidsFace();
};
photoInput.onchange = (e) => {
if (e.target.files && e.target.files[0]) {
const reader = new FileReader();
reader.onload = (ev) => {
State.customPhotoURL = ev.target.result;
const img = new Image();
img.onload = () => {
// Amostra suave de tom de pele e cabelo evitando cores escuras extremas
const tempC = document.createElement('canvas');
tempC.width = 40; tempC.height = 40;
const tCtx = tempC.getContext('2d');
tCtx.drawImage(img, 0, 0, 40, 40);
const sPx = tCtx.getImageData(20, 20, 1, 1).data;
// Mistura com tom de pele quente infantil para ficar sempre bonito como na ilustração
const r = Math.round(sPx[0] * 0.45 + 247 * 0.55);
const g = Math.round(sPx[1] * 0.45 + 198 * 0.55);
const b = Math.round(sPx[2] * 0.45 + 163 * 0.55);
State.skinColor = ⁠rgb(${r}, ${g}, ${b})⁠;
};
img.src = ev.target.result;
photoBox.innerHTML = ⁠<img src="${ev.target.result}" alt="Foto">⁠;
};
reader.readAsDataURL(e.target.files[0]);
}
};
// Tela 2 -> Tela 3 (Guarda-Roupa)
document.getElementById('btn-profile-ok').onclick = () => {
const nameVal = document.getElementById('input-player-name').value.trim();
State.playerName = nameVal || 'Isis';
document.getElementById('wardrobe-player-name').textContent = State.playerName;
startCloudTransition(() => {
setScreenVisibility('WARDROBE');
initTabIcons();
renderWardrobeItems();
updateWardrobePreview();
});
};
// Abas do Guarda-Roupa
document.querySelectorAll('.w-tab').forEach(tab => {
tab.onclick = () => {
document.querySelectorAll('.w-tab').forEach(t => t.classList.remove('active'));
tab.classList.add('active');
State.activeCat = tab.dataset.cat;
renderWardrobeItems();
};
});
// Tela 3 -> Tela 4 (Criar Avatar -> Fecha em Círculo e Abre na Ilha)
document.getElementById('btn-finish-avatar').onclick = () => {
startIrisTransition(() => {
World.playerX = 420;
World.playerDepth = 0.55;
World.facing = 'back';
setScreenVisibility('GAME');
});
};
// Botão Sair da Ilha -> Volta para a Tela Inicial
document.getElementById('btn-exit-game').onclick = () => {
startIrisTransition(() => {
setScreenVisibility('START');
});
};
// Botões A (Pegar) e B (Pular)
const btnA = document.getElementById('btn-action-a');
const btnB = document.getElementById('btn-action-b');
btnA.addEventListener('pointerdown', () => {
btnA.classList.add('pressed');
World.grabAnim = 0.35;
});
btnA.addEventListener('pointerup', () => btnA.classList.remove('pressed'));
btnB.addEventListener('pointerdown', () => {
btnB.classList.add('pressed');
triggerJump();
});
btnB.addEventListener('pointerup', () => btnB.classList.remove('pressed'));
// =========================================================================
// 8. LOOP PRINCIPAL DO JOGO (60 FPS)
// =========================================================================
setupJoystick();
drawDefaultKidsFace();
let lastTime = performance.now();
function mainLoop(now) {
const dt = Math.min(0.05, (now - lastTime) / 1000);
lastTime = now;
const timeSec = now / 1000;
ctx.clearRect(0, 0, canvas.width, canvas.height);
if (State.screen === 'START' || State.screen === 'PROFILE' || State.screen === 'WARDROBE') {
renderStartScreen(timeSec);
} else if (State.screen === 'GAME') {
updateAndRenderIslandGame(dt, timeSec);
}
renderTransitions(dt);
requestAnimationFrame(mainLoop);
}
requestAnimationFrame(mainLoop);
</script>
</body>
</html>
